  abstract_short: JEPA 式潜在动力学模型+物理启发探针+MPPI 用于四旋翼实时控制，仅用域随机化仿真数据训练并零样本上机；作者报告长时程开环预测误差低于直接预测模型，户外负载/换桨下仍稳定跟踪。
  summary: 为缓解神经动力学模型自回归推演误差累积、难以支撑敏捷四旋翼长时程预测控制的问题，作者提出 SkyJEPA：以 TCN 编码状态与动作历史，在潜空间用 GRU 多步推演，并以 SIGReg 防止表征坍缩；第二阶段冻结潜在模型，训练一个经可微运动学的物理启发探针把潜态映射为可解释的位置、速度、姿态，从而在
    MPPI 中计算跟踪代价与约束，在 Orin NX 上满足 10 ms 控制预算。训练数据来自 500 个域随机化参数下的 2 万条高斯过程随机参考轨迹仿真跟踪记录。作者报告开环推演中位置、速度、姿态 RMSE 随步长增长明显慢于直接预测模型，对观测噪声更鲁棒；户外零样本闭环跟踪多种参考轨迹，在加载负载和更换螺旋桨时无需重训仍能跟踪。该结果提示
    JEPA 式潜在动力学可用于高频反馈控制而不仅是运动学规划，但输入为全状态估计而非视觉，户外试验每条轨迹仅 5 次，对比基线以神经预测模型为主。
