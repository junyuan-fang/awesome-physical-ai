  summary: 为缓解 VLM 语义空间与具身控制之间的结构错配、视频预测类中间表示冗余且推理慢的问题，AffordanceVLA 将结构化可供性（操作哪个物体、在哪接触、如何从 3D 形状/布局角度交互）作为训练期中间监督，构建理解专家、可供性生成专家和动作专家组成的
    Mixture-of-Transformer 架构，并以三阶段课程训练：先用约 8.8M 条通用定位/指点数据预训练，再在带自动可供性标注的 InternData-A1 仿真数据上协同训练，最后在目标任务微调。作者报告在 LIBERO
    四套件平均成功率 95.8%、CALVIN ABC→D 平均链长 4.33，并在 RoboCasa 与 LIBERO-Plus OOD 评测上优于所列基线；消融显示仅加数据（Pi0 架构）提升有限、冻结可供性专家性能崩溃，去掉 Stage
    II 主要损害泛化。真机上（每任务 15 次）基础任务平均 88.3% 对 π0 70.8%，同图像不同指令的复杂任务 82.9% 对 44.8%。结果提示可供性中间表示有助保持语言-视觉对齐并改进指令跟随，但真机试次较少、训练数据与算力（16×H200）投入大，与基线的数据量对齐程度仍需细看。
