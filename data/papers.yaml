    TesserAct、4DNeX 等 4D 基线，并给出架构消融；在 TIANJI M6+WUJI 灵巧手的 6 个真机任务上，策略优于 DP、π0、π0.5、VPP、Mimic-Video，受控对比显示 RGB-DF 表征优于仅 RGB
