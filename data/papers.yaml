  summary: 主流 VLA 将 VLM 作为条件编码器、另接流匹配动作专家，VLM 的推理能力只能间接影响动作。为让 VLM 本身成为决策者，作者提出 G0.5：以 Qwen3.5-2B 初始化，一个自回归解码器在同一 token 流中生成可选的思维链（子任务分解、物体框、动作提示）与动作码；动作由按运动部件分组、带时间对比目标的
    RVQ 分词器编码到 27 维统一动作空间，只预测活动自由度组以压缩 token；视觉编码器中插入时空注意力实现多秒视觉记忆。在 14 种具身的机器人数据与 VQA 数据上单阶段预训练后，作者报告：R1-Lite/R1-Pro 六个真机任务-具身设置平均
