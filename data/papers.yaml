  summary: 为解决 VLA 与代码即策略系统依赖被动视觉、无法推断质量和刚度等隐藏物理属性的问题，作者提出 PhysCaP：在 CaP-Agent0 之上加入免训练的物理属性提取模块，仅凭机械臂关节力矩估计质量、凭夹爪力-位移估计刚度；再用
    Planner 决定是否探索与何时停止，Prioritizer 过滤不合理交互并按启发式优先级排序。在 AgileX PiPER 真机的找空罐、挑熟牛油果、装购物袋三个任务（每任务 10 次，Gemini 3.1 Pro 作骨干）上，作者报告纯视觉
    CaP 只能盲猜，CaP+PhysX 过度探索，而 PhysCaP 成功率相当或更高且交互次数与执行时间更少；LIBERO 中复现找空罐任务也呈相同趋势。验证实验显示 PhysX 质量估计误差明显低于各种输入组合下的 VLM 估计。该结果提示显式物理测量可补足基础模型的物理推断短板，但任务均为小规模桌面场景、试次少、依赖商用
