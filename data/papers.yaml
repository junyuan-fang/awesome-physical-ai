  abstract_short: 机器人学习中进度奖励建模的综述，按接口（输入/目标/输出）、构造方法（冻结基础模型、时序监督、指令微调、程序化奖励）与数据/基准三层梳理，并讨论局限与方向。
  summary: 为弥补进度奖励模型在观测形式、目标指定、输出信号、监督来源与评测协议上缺乏统一框架、结果难以比较的问题，该综述把领域组织为三步：先看接口，即当前任务状态如何表示（单帧、时序上下文等）、目标如何指定（语言、视觉）、输出是标量分数、进度增量、排序偏好还是可执行奖励函数；再看构造方法，归纳为冻结基础模型打分（CLIP、GVL、TOPReward
    等）、从时序或相对监督学习（VIP 等）、指令微调的进度预测（RoboReward、Robometer 等）和程序化奖励（Eureka、Text2Reward 等）四类；最后按人工参与程度梳理进度监督数据构建，并把基准分为进度保真、鲁棒泛化和下游效用三类，指出平滑的奖励曲线不等于忠实进度、下游策略提升也不能单独证明奖励正确。该综述为比较进度模型提供了较清晰的分类，但不含新实验或统一复评，结论依赖对已有文献的归纳，配套仓库为论文列表而非代码。
