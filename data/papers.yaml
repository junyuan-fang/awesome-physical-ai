    相机控制与 next forcing 头，并用受损历史与自身 rollout 残差做防漂移训练；最后结合 DMD、self-forcing++ 与一致性蒸馏把每块采样步数从约 30 降到 4。训练数据混合 Sekai-Real、SpatialVid、RealEstate10K、DL3DV
