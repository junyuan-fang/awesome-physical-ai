  abstract_short: Flex-π 用冻结的 Wan VAE 同时编码 RGB 与 3D 点图，加上 DINO 语义，与动作联合去噪，单个 checkpoint 支持从纯动作到全联合生成；作者报告在真机双臂灵巧任务上比最强基线高
    2–7 倍。
  summary: 现有世界-动作模型（WAM）几乎都只预测为像素重建训练的 RGB 隐变量，缺少操作所需的 3D 几何和物体语义监督。作者发现，冻结的视频生成 VAE 几乎能无损地编码 3D 点图，据此提出 6B 参数的 Flex-π：由
    Depth Anything 3 生成的点图和 DINOv3 特征与 RGB 一起投影到共享隐空间，在 Mixture-of-Transformers 中与动作联合做 flow matching 去噪；逐流 dropout 加跨模态强制，使同一
    checkpoint 可以在任意输入/输出流组合下运行，不需要新传感器，也可以不增加推理延迟。模型在 AgiBot World 上预训练后按任务微调。作者报告：在 YAM 双臂真机的五个任务（含毫米级插装的自修夹爪、软包拉链）上，纯动作模式和全联合模式都优于
    π0.5、Fast-WAM 和 ManiFlow，任务越难优势越大；在未见物体、杂乱干扰和半量数据条件下仍保持领先；RoboTwin 50 任务平均成功率为 94.6%，高于所列 VLA 与 WAM 基线；消融显示 DINO 和点图流都带来提升。这提示把几何与语义引入
    WAM 的联合预测可以提高示教效率和泛化，但收敛较慢，全联合模式仍比同规模 VLA 慢，在 LIBERO-Plus 上仍落后于数据更多的强 VLM 方法。
