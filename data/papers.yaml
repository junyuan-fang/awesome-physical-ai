  summary: 为评估前沿通用模型是否已具备具身智能，作者在 12 个基准上以统一协议测试 GPT-6-Astra：允许从训练集演示构建冻结的 in-context 知识包，并把执行步数放宽至官方上限的 10 倍，另在 8 类真机平台做零样本部署，并消融
    System 1/System 2 协作与动作表示。作者报告在 LIBERO-Long++/Ultra-Long/LIBERO-PRO 接近饱和（Ultra-Long 98.8%），RoboDojo 81.9%、DexJoCo 87.3%；扩展预算使
    RoboDojo 成功率约增至三倍。真机上刚性抓放 17/18 成功，而布料折叠 2/4、插头插入 0/11、移动导航 9/23；单次 LIBERO-Ultra-Long 任务约耗九百万 token、近两小时。结果提示基准能力已跨过门槛但实用具身智能未达，代价是
    ICL 依赖昂贵的机器人演示、真机时间不可无限延长，且新基准原型尚未公开。
