  abstract_short: NVIDIA 开放的人形通用 VLA：System 2 VLM + System 1 DiT flow-matching 双系统，用真机、仿真、神经生成轨迹与人类视频「数据金字塔」训练；作者报告在三套仿真基准与
    GR-1 真机上优于基线。
  summary: 人形机器人缺乏可用于大规模预训练的数据，不同本体数据又形成「数据孤岛」。GR00T N1 为此提出双系统 VLA：以 Eagle-2 VLM 作为 System 2 理解视觉与语言，以 DiT flow-matching
    动作模块作为 System 1 生成高频动作，二者端到端联合训练，并用逐本体的状态/动作编码器支持从单臂到双手灵巧人形的多种本体。训练数据组织为金字塔：底层为人类视频（以 VQ-VAE 潜动作为标签），中层为仿真与神经生成轨迹，顶层为
    GR-1 遥操作、Open X-Embodiment 与 AgiBot-Alpha 真机数据。作者报告在 RoboCasa、DexMimicGen 跨本体套件和 GR-1 桌面任务三套仿真基准上（每任务 100 条示范）优于 Diffusion
    Policy 等基线，在 GR-1 真机双手操作任务上少量数据即可取得较高成功率，神经轨迹协同训练在低数据量下带来提升。该工作提供了开放权重的人形基础模型和可复现的仿真评测；但真机对照主要是 Diffusion Policy，评测集中于桌面操作，未涉及行走等全身控制。
