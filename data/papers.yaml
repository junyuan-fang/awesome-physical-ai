  summary: 为解决自我中心视频中相机、场景几何与手–物交互通常分开重建、尺度与坐标系不一致的问题，作者提出全栈方案 EgoXperience：EgoX-Engine 用立体深度与 SLAM 把手部 MANO、物体轨迹和场景对齐到同一度量世界坐标，据此标注
