  title: 'SPRINT: Efficient Spectral Priors for Humanoid Athletic Sprints'
  authors: Wei, Yantong et al.
  affiliations:
  - College of Intelligence Science and Technology, National University of Defense Technology, China
  - School of Artificial Intelligence and Robotics, Hunan University, China
  date: '2026-05-27'
  category: locomotion
