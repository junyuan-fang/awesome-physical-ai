    真机 4 个任务上与基线在相同协议下对比。消融显示去掉语言降至 68.5%，双向交互优于单向或拼接。该结果提示执行层操作未必需要 LLM 作为感知-动作中介，但模型不具备开放指令推理和任务分解能力，作者承认面向“打扫房间”这类开放指令仍需扩展，真机任务数量也有限。
