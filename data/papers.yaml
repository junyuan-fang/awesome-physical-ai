  abstract_short: GroundingPI 是 4B 接地基础模型，34 个基准平均 73.68%；作为 VLA 视觉骨干，作者报告 RoboTwin 2.0 四个 OOD 设置全胜、RoboCasa-GR1 用 50% 演示超过基线
    75%。
  summary: 针对 VLA/WAM 从通用视觉-语言或视频骨干继承的感知在密集、微小目标上不足的问题，作者构建 GroundingPI：4B 自回归模型把点与框写成共享词表中的量化坐标，经多模态/空间预训练、SFT 与 GRPO 强化后训练，并用多教师数据引擎扩标注。作者报告在
    34 个接地基准、44 个基线上平均 73.68%，高于 GPT-6 Astra 的 71.54%，Dense200 74.53 对 65.04；作为视觉骨干接入统一的 π 式动作专家后，RoboTwin 2.0 四个 OOD 设置均优于所测骨干（最高相对提升
    24.8%），RoboCasa-GR1 用 50% 演示超过基线 75% 演示，nuScenes 开环 L2 0.296 m（Qwen3-VL-4B 0.301）。消融显示密集接地数据是迁移核心、OCR 可能起催化作用。结果提示感知预训练可独立于动作数据
