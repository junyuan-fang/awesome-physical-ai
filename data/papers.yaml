    2.59×。
  summary: 为解决交互式视频世界模型在长轨迹生成时因上下文增长、二次注意力和多步去噪导致推理昂贵（HY-WorldPlay 单张 A100 生成 10 秒视频超 200 秒）的问题，作者提出免训练加速框架 Light Interaction：利用相机位姿感知的检索相似度判断"新探索"还是"回访"，新探索时丢弃检索到的空间记忆、按局部潜变量动态调整时间窗；回访时复用早期去噪步输出近似中间步；并把
