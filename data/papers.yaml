  abstract_short: 基于 RoboCasa365 的诊断式鲁棒性基准：配对 clean-perturbed 反事实 + 阶段感知诊断；作者报告相同端到端退化可对应不同失败深度，并开源代码与数据集。
  summary: 为弥补 VLA 鲁棒性评测只看聚合成功率、无法看清分布偏移下单次执行如何变化及长程任务失败发生在哪一步的问题，作者构建 RoboCasa-Shift：在 RoboCasa365 上做受控单因子偏移（光照、相机朝向、底座初始化、高斯模糊，各三档严重度）、配对的
    clean-perturbed 反事实 rollout（每对仅差目标偏移），并基于仿真器状态谓词做阶段感知诊断。对 GR00T N1.5 在 4 个通过 clean 门槛的长程任务上共 1,040 次正式 rollout，作者报告不同因子/任务的鲁棒性响应差异显著、严重度增加并非单调退化（如某相机条件
    ΔSR=0 但 8/80 配对结局翻转），相同端到端退化可对应不同失败深度。结果提示 VLA 鲁棒性应作为执行的多维属性评估，但仅单策略、四任务且全仿真。
