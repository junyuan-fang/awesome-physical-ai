  summary: 为让机器人世界模型同时满足保真、长时一致和高效三个条件，从而支撑策略评估、策略改进与测试时规划，作者提出 WEAVER：928M 参数、预测腕部与外部双视角潜变量和本体状态的世界模型，结合稀疏长时记忆+短时历史、diffusion
    forcing 余弦噪声日程、KV cache 与 rectified flow 蒸馏，并在潜空间上蒸馏 Robometer 奖励头与 critic。在 DROID 上预训练、五个真机 Franka 任务各 50 条数据微调后，作者报告：DROID
    验证集与分布外数据上 FID/FVD 优于 Ctrl-World 且推理时间约为其 1/3；真机策略评估中与真实成功率相关系数 0.870；用 WEAVER 生成并按优势筛选的合成数据微调 π0.5，真机成功率平均提升 38%，接近用真实数据微调；best-of-N
