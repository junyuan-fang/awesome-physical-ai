  summary: 为解决现有双臂抓取方法依赖完整物体点云、在单视角部分观测下易把遮挡边界误当可抓面的问题，作者提出PartialBiGrasp：用旋转等变点特征投影到三平面并经U-Net得到连续占据条件特征场，在候选接触点查询局部特征以预测可抓性与单臂抓取位姿，再用学习的力封闭评判器配对，最后以局部占据编码器在SE(3)李代数邻域内采样优化修正碰撞与接触。在DG16M未见物体测试集上，作者报告力封闭率55.16%、仿真抓取成功率67.87%、穿透率17.48%，均优于ContactGraspNet配对、部分点云DAGDiff等基线；在RealSense采集的真实物体数据上力封闭率51.06%，并在xArm7+xArm6异构双臂上演示执行。消融显示残差设计与局部细化均有贡献。结果提示隐式几何推理有助于部分观测双臂抓取，但未建模可达性与运动可行性，真机执行仅定性展示。
