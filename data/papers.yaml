  summary: 为解决多数 VLA 把机器人各身体部位独立处理、难以在高自由度人形上产生协调全身动作的问题，HEX 采用「高层 VLA + 低层 RL 全身控制器」的分层框架：高层提出人形对齐的通用状态表示，把不同本体的本体感知映射到手臂、手、腿、头、腰等规范身体部位槽位；用基于形态的
    MoE 统一本体感知预测器 (UPP) 建模全身协调与短期状态演化；用轻量历史查询特征缓存汇总过去视觉上下文，避免重复编码历史图像；再以残差门控融合与 flow-matching 动作头生成动作；预训练语料超过 1200 万帧、覆盖 7
