  summary: 为让 VLA 在部署分布偏移下无需奖励、无需改动骨干即可自我改进，作者提出基于潜在提示优化（LPO）的测试时训练框架 TTT-VLA：在 π0 式 MoT 结构中增加状态接地专家，以流匹配预测末端位置与夹爪状态作为代理任务，与动作目标联合训练一个可学习的潜在提示（多本体时每个本体一组提示）；部署时先在当前环境收集交互数据，再冻结策略、仅用代理损失离线批量优化潜在提示。在
    SimplerEnv 上，作者报告：WidowX 单本体平均成功率 51.1%（基线）→63.5%（加潜在提示）→67.4%（再加 TTT）；Google Robot 视觉匹配 67.5%→72.4%、变体聚合 58.1%→60.1%；以
    9 本体 OXE-Aug Bridge V2 训练、在 WidowX 评测时 22.8%→31.6%。分析显示收益主要来自少数关键决策点（如判断是否抓取成功）的纠正；在线逐样本更新不稳定、提示易坍缩。结果提示提示是轻量的部署期适配接口，但全部为仿真评测，Google
