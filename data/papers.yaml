  summary: 动作条件视频世界模型生成的画面即使逼真，也可能动错手臂或丢失被操作物体。为提高对动作的忠实度，作者提出 DreamX-Phi 1.0：基于 Wan2.2-TI2V-5B，将每条手臂末端位姿的 SE(3) 变换以 PRoPE
    方式注入注意力并作为残差分支，保留手臂身份和刚体运动结构；增加轻量深度分支约束场景几何；用 SAM3 掩码聚焦物体区域、冻结的 V-JEPA 教师约束物体时空演化；最后以 DMD2 蒸馏为少步生成器。训练语料包括 Ego4D、AgiBot
    World 2026、InternData-A1、Cosmos3-DROID、RoboCOIN 与 RoboTwin 2.0。作者报告在 2026-08-12 的 WorldArena 2.0 排行榜快照中，Track 1 以 EWMScore-P
    60.65 排名第一，Track 2（以世界模型作环境优化策略、在 Adjust Bottle 任务评估）成功率 67.19%、并列第二；离线 WorldArena 1.0 得分 76.88。该结果提示几何化动作编码与物体级监督有助于动作忠实度，但评测仅限
    WorldArena/RoboTwin 仿真，Track 2 只有一个任务，未做组件消融，排名为快照而非最终结果。
