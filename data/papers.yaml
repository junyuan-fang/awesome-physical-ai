  abstract_short: 将 VLM 决策与底层运动执行解耦的人形具身评测框架，VLM 每步发出原子技能、由技能条件运动生成器在半物理仿真中执行；作者报告 9 个 VLM 在 1,218 个找-走-坐任务上最好成功率仅 16.8%。
  summary: 为解决评测 VLM 能否通过身体行动时，决策失误与运动控制失败（如失衡跌倒）相互混淆的问题，HumanCLAW 让带推理脚手架的现成 VLM 每步根据第一人称图像输出一个参数化原子技能，再由在 AMASS/BABEL 上训练、按技能接入
    ControlNet 的运动扩散模型生成亚秒级全身动作，在保留重力与碰撞、但剔除平衡和跟踪误差的“半物理”仿真中执行。在此基础上构建 HumanCLAW-Bench：基于 HSSD 的 41 个室内场景、1,218 个“寻找—导航—坐下”长程
    episode，并把可移动物体设为动态。作者评测 9 个 VLM，报告最好的 Gemini-3.1 端到端成功率仅 16.8%，失败主要来自身体自我感知（不知自身位置、是否到达或碰撞），而非目标识别；消融显示验证器和中层目标是关键，更长文本或图像历史无益。该结果提示通用
