  summary: 为解决灵巧手 VLA 在真机上难以由人纠正、在线交互昂贵的问题，作者提出离线到在线 RL 系统 BORA：离线阶段在一致性策略 VLA 中加入与 VLM cognition token 共享表征的动作条件 critic（Q
    回归 + IQL 式期望回归 V，PPO 式裁剪目标改进策略）；在线阶段冻结 VLA，仅用 RLPD 式 1:1 离线/在线混合数据训练 MLP 残差 actor；人工纠正方面结合可穿戴臂-手遥操作，对拧瓶盖等接触密集动作用基于 15
