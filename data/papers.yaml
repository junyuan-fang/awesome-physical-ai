  abstract_short: SparkVLA 把子任务终止与动作块执行长度放进同一候选集统一排序，作者报告在 RoboCerebra 上成功率 47.12%，比官方分层基线高 30.57 个百分点，并有真机长程任务验证。
  summary: 分层 VLA 在每个重观测点需同时决定"是否结束当前子任务"和"动作块执行多长"，现有方法分别用独立模块处理，二者信息互不可见。SparkVLA 将 Stop 与所有动作前缀长度放入同一候选集，用全自注意力打分头统一排序，仅需离线序数偏好监督、无需阈值调参；另以历史感知的子任务锚点引导视觉
    token 剪枝。在 RoboCerebra 长程基准（60 个留出案例×10 次）上，作者报告平均成功率 47.12%，高于官方 HPE 基线 30.57 个百分点、复现的 Mem-0 26.83 个百分点；更换 OpenVLA-OFT/SmolVLA
    执行器时同样有提升；LIBERO 平均 98.5%。消融显示统一候选集使 Stop 准确率从 80.37% 升至 96.65%。在 AirbotPlay 双臂平台三项多步任务（各 50 次）上作者报告平均 69.3%，比最强基线高 21.3
