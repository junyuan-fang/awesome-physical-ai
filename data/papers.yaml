  summary: 为弥补现有导航基准把室内与室外分开评测、且多抽象掉机器人执行的缺口，NavVerse 在 Isaac Sim 上构建了 100 个室内、50 个城市室外和 50 个室内到室外连通场景，共约 1 万个 episode，覆盖物体导航、视觉语言导航和新提出的地点导航（PlaceNav，如寻找餐厅、银行），通过统一的航点/离散/速度接口驱动
    Spot 等机器人执行，并报告成功率、SPL、覆盖效率以及碰撞率、障碍距离、可通行面比例等安全指标。作者在零样本条件下评测了模块化（SGImagineNav）、RL（PoliFormer）和 VLA（UniNaVid、LongNav-R1）基线，报告
    UniNaVid 任务完成最好，但整体成功率普遍低于 12%；PlaceNav 从纯室外到室内到室外场景成功率由 17.65% 降至 3.64%，模块化方法安全性最好。该结果提示跨场景过渡与长程语义搜索仍是瓶颈，但基准目前多为单层场景、缺少行人等动态因素，基线均为零样本迁移且数量有限。
