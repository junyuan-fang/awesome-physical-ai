  summary: 反应式 VLA 在只有腕部相机时，物体一出视野就被“遗忘”，多步任务中也会丢失进度。为此作者提出 AtlasVLA：用 Depth Anything v3 估计深度，结合手眼标定得到的外参，把 2D 视觉 token 反投影成
    3D，并以 TSDF 风格的体素哈希持续更新“4D 持久世界状态记忆”；同时用可学习的意图查询在 VLM（基于 OpenVLA-7B）中聚合信息，形成“自我工作记忆”来跟踪任务进度；动作由一个以 World-Ego 状态检索结果为条件的
