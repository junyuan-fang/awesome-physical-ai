    快速反射网络，逐步输出参考力与各向异性刚度方向，并用接触触发的门控在位置主导与力主导之间切换；监督信号来自遥操作主从误差推得的力意图。在擦拭曲面/斜面、插充电器、撕便签、翻芯片盒 5 项双臂真机任务（每项 10 次）上，作者报告接入后接触阶段成功率较原骨干提升
