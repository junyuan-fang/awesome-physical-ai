  summary: 机器人策略的评测和部署被各自的软件依赖、数据格式和运行接口割裂：把 N 个策略接到 M 个环境，需要 O(NM) 次单独集成，预处理约定也在反复重写中悄悄改变，导致结果难以横向比较。为此作者发布 XPolicyLab：定义统一的观测、动作和轨迹
    schema，以及只有 update_obs / get_action / reset 和批量接口的最小 adapter 协议；再通过 WebSocket + MessagePack 的依赖隔离服务，把策略推理与环境执行分在不同进程甚至不同机器上。配套的分级一致性检查和可供编码
    agent 执行的 skills 用来规范接入流程。作者报告：截至 2026 年 8 月已接入 42 个策略（VLA、WAM、扩散策略等）；各 adapter 的模型侧代码量差异达一个数量级，而面向环境的循环保持在固定参考的几行以内；在小规模对照实验中，接入一个代表性策略的时间从
    5 小时以上降到 2 小时，使用 agent skills 后降到约 30 分钟；同一套 adapter 驱动了 RoboTwin、RoboDojo 仿真和 RoboDojo-RealEval（三种双臂本体、18 个真机任务）的排行榜。这提示统一接口能降低复现和比较的成本，但它本身不评测算法，集成工作量研究的参与者人数有限，也无法消除真机评测中的物理方差。
