  summary: 为解决 JEPA 式潜在世界模型端到端训练易坍缩、且表征未必与动作相关的问题，作者提出感觉运动世界模型 SMWM：在前向潜在动力学损失之外，只加一个由相邻两帧嵌入预测中间动作的逆动力学头，无需冻结编码器、EMA 目标或分布正则；该约束迫使表征保留与动作相关的信息、丢弃不受控的干扰。在已知真实状态的“点世界”中，作者展示嵌入的有效维数与可控自由度一致、能过滤随机运动干扰点；在
