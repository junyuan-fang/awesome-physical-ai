    copilot 两种模式。在双 Franka FR3 加双 21 自由度 ByteDexter V2 的 56 自由度平台上，作者报告相比直接切换遥操作，介入抖动降低 99.8%，介入后抓取失败减少 87.5%、完成时间缩短 19.1%，并优于
    Jacobian 映射与增量指令基线；以 GR-Dexter 微调得到基础策略后，用 1 小时 copilot 纠错数据继续训练，在三项长程双手灵巧任务上的子目标完成分平均比等量遥操作数据高 19%。结果提示对灵巧手而言，平滑介入接口和在策略分布上的纠错数据都很关键，但每个策略只评测
    10 次，后训练仅用简单 SFT，且未公开代码与数据。
