  abstract_short: SafePBDS 用 pullback 控制屏障函数把任务流形安全约束转为构型空间加速度线性约束，并提供残差动作接口；作者报告 Franka-Allegro 真机抓取成功率 92.5%，手内旋转超 360°。
  summary: 为解决灵巧操作中目标与约束分布在异构几何空间（构型流形、SE(3)、距离等）且需实时、可证安全地协调的问题，作者在 pullback bundle dynamical systems（PBDS）基础上提出 SafePBDS：一是
    pullback 控制屏障函数（ECBF/BCBF），把任务流形上的安全条件转成构型空间加速度的线性约束，在 QP 中硬性满足；二是任务流形动作接口，允许高层策略注入低维残差运动，零输入即退化为自主行为，任意输入下安全性仍保持。作者先在球面质点与
    7 自由度机械臂仿真中验证图卡不变性、安全恢复与避障消融（去掉障碍 CBF 会穿透障碍），再在 23 自由度 Franka Panda–Allegro 平台上报告：20 个家用物体 120 次抓取成功率 92.5%；用一维动作排除任一手指，3
    个物体 36 次三指抓取成功率 94.4%；并实现基于模型、掌心朝下的手内双向旋转超过 360°。该结果提示几何一致的安全运动层可作为学习策略的安全底座，但本文以模型化控制为主、学习策略只通过接口概念性接入，缓存中未见与学习型抓取方法的定量对比，且依赖已知物体模型与感知。
