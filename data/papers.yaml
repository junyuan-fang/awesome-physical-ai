- arxiv_id: '2605.26820'
  title: Can VLA Models Learn from Real-World Data Continually without Forgetting?
  authors: Zhu, Jiarun et al.
  affiliations:
  - HKU
  - EIT, Ningbo
  - SUSTech
  - INFIFORCE
  - HUST
  - HITSZ
  date: '2026-05-26'
  category: vla
  route: adjacent
  contribution: benchmark
  tags:
  - continual-learning
  - experience-replay
  - catastrophic-forgetting
  - real-world
  - bimanual
  abstract_short: 构建 10 个真机单臂/双臂任务的 VLA 持续学习基准，作者报告朴素顺序微调严重遗忘（单臂 AS 31.4、BWT -81.0），而配置得当的经验回放 AS 达 97.2，并优于同算力的多任务联合训练。
  summary: 为弥补 VLA 持续学习研究多在 LIBERO 等仿真上进行、可能低估真实部署中遗忘程度的缺口，作者用两台 PiPER-X 机械臂和四路 RealSense 构建真实世界持续操作基准：5 个单臂与 5 个双臂任务（含叠碗、挂杯、叠毛巾等可形变操作），每个单臂任务
    500 条、双臂任务 300 条遥操作示范，以分步打分计算平均分 AS、后向迁移 BWT 与前向迁移 FWT。基于一个 flow-matching 类预训练 VLA 的标准微调流程，作者报告：顺序微调在单臂流上 AS 31.4、BWT
    -81.0，双臂流 AS 38.3、BWT -68.6；加入经验回放后两条流 AS 均为 97.2、BWT 转为正值，并高于联合多任务训练的 82.6 与 83.2。作者进一步分析回放比例、回放频率和动作归一化策略，发现固定首任务归一化统计量最好，并在
    10 任务交替流上用非对称回放频率实现稳定学习。结论提示真实数据流下回放仍是简单有效的基线，但只覆盖单一平台和单一基础模型，每格评测次数有限，回放需持续存储历史数据，且数据与代码尚未公开。
  links:
    arxiv: https://arxiv.org/abs/2605.26820
