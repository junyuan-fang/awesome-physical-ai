  abstract_short: 通过合并/拆分动作对示教重定时（VSTA）并把速度作为条件输入，使单个 VLA 可双向调速；作者报告 LIBERO 上默认速度成功率不降反升，并可借 GPT-4o 动态调度速度。
  summary: 现有 VLA 只能继承示教数据中的固定执行速度，已有加速工作只是把策略从一个固定速度移到另一个，且几乎不涉及减速。TempoVLA 观察到每步预测动作的幅值直接决定机器人运动速度，于是在数据侧提出可变速轨迹增广 VSTA：按运动模式与方向切分示教片段，再在片段内合并或拆分动作，把示教在线重定时到目标速度；在模型侧以文本前缀、调制
    RMSNorm 或软提示把速度作为显式条件输入 π0 类流匹配 VLA，不改低层控制器。作者报告在 LIBERO 上 VSTA 重放的数据速度比基本贴合目标；三种注入方式效果相当；单速度基线平均 96.7%，多速度训练在 1× 处持平或略高，峰值出现在
    1.2× 左右（最高约 97.4%）；极端速度（如 0.25×、3×）成功率明显下降，原因之一是高速时低层控制器跟踪带宽饱和。Franka 真机 5 个任务中作者报告 VSTA 提升默认速度成功率，并能配合 GPT-4o 在低风险阶段加速、接触阶段减速。该工作提示速度可作为轻量控制维度加入现有
    VLA，但仅在单一仿真基准和少量真机任务上验证，对照只有自身单速度基线，调度器的保守性也限制了实际加速收益。
