  abstract_short: AHEAD 给冻结 OpenVLA 外挂 4.9M 参数潜空间世界模型以预测未来特征；作者报告 20 个动态仿真场景成功率 79–97%（最强基线 31–58%），真机接抛射物 19/30，基线全为 0。
  summary: 为缓解 VLA 按当前观测出动作、默认场景静止而在物体运动时“抓空”的问题，作者提出 AHEAD：一个 predict-then-act 包装器，在冻结 VLA 的视觉特征空间里用小型 flow-matching 世界模型预测未来
    patch token。它用 RAFT 光流给每个 token 加上速度/加速度条件并按恒加速度运动学解析外推，用语言+运动显著性掩码只预测相关 patch，并在预测不确定性超过阈值时自适应停止滚动，最后把预测 token 交给原动作解码器。在自建
    MuJoCo 的 20 个动态场景（匀速、加速、遮挡、碰撞后混沌等）上，作者报告成功率 79–97%，对比 Realtime ACT、Streaming DP、DreamVLA、LaDi-WM 等基线的 31–58%；在 xArm 7
    真机五个任务上为 19/30 到 30/30，抛物接球任务各基线均为 0/30，并有速度扫描和组件消融。结果提示“给冻结 VLA 补前瞻”是低成本的可行路线，但仿真环境为自建、真机仅单平台，恒加速度假设在碰撞后混沌运动中失效，光流只捕捉像平面运动，且尚未公开代码。
