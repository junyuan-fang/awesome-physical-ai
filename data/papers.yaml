    Action100M 语料检索与查询行为相似的演示来引导灵巧操作策略训练。作者报告在留出互联网视频与 AssemblyHands 上检索指标远高于 Flow/HAND/STRAP（mAP@10 0.364 对 0.011）；在改写的 VTDexManip
