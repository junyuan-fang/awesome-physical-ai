  summary: 为缓解 VLA 面对形态异构与数据稀缺时难以跨本体迁移的问题，Being-H0.5 提出以人为中心的学习范式：把人类手部交互轨迹视作物理交互的通用「母语」，构建 UniHand-2.0 预训练配方（3.5 万小时以上，含人类第一人称视频、30
