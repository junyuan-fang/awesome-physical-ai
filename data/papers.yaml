  abstract_short: SPRINT 仅用 5 段（14 秒）人体步态训练频率自适应谱先验，生成参考关节轨迹再由残差 RL 稳定；作者报告 Unitree G1 零样本实机冲刺在 6 m/s 指令下实测约 5.9 m/s，并可平滑切换步态。
  summary: 为解决人形机器人高速冲刺缺乏可用运动参考数据、AMP 类方法在高速下易不稳定或模式坍塌的问题，作者提出 SPRINT：从 LAFAN1 中挑出 5 段走、慢跑、跑步序列（共 428 帧、14 秒），经 GMR 重定向后在频域刻画步态周期性，用以频率为条件的
    VAE 加多谐波相位输入和 FiLM 解码器训练“谱先验”，可外推到超出参考分布的速度；再以冻结先验生成参考轨迹，PPO 训练的残差策略负责动态稳定，配合渐进速度课程与非对称 actor-critic。在 Isaac Gym 中，作者报告谱先验的重建误差、FID
    和边界幅值误差均优于 AI-CPG，消融显示课程学习、残差结构和特权 critic 各有贡献；在 Unitree G1 上零样本部署，1–6 m/s 指令下实测速度与仿真接近（6 m/s 指令时约 5.91 m/s），并展示了从站立到跑步的连续步态切换。结果提示频域先验是高速周期运动的高数据效率参考来源，但只适用于周期性步态，真机评测以速度跟踪和
    FID 为主、缺少与其他高速方法的实机对比，且未公开代码。
