  abstract_short: GAM 以可提示 3D 接地模型为骨干、只用任务物体构建观测；作者报告 RoboTwin 2.0 平均 55.3%、LIBERO-PRO 61%，真机视觉偏移下 17/20 对 π0.5 的 4/20。
  summary: 作者认为语言/视频预训练目标都不直接要求度量 3D 接地，策略因而在物体移动或换目标时失效；为此提出 Grounded Action Model，用冻结的可提示 3D 检测器 WildDet3D 把语言/点/框提示转成物体级
    2D 框、3D 框与度量深度，仅保留任务物体与机械臂的图像 token 和几何 token，再由多流 DiT 预测动作块。作者报告 RoboTwin 2.0 50 任务平均 55.29%（干净 62.96%、随机 47.62%），高于
    Spatial Forcing 的 52.0；LIBERO-PRO 16 种扰动平均 0.61（π0.5 0.53）；双臂 YAM 视觉偏移下保持 17/20（π0.5 4/20），Franka 长时程任务 ID 64.7%、OOD 49.8%。消融中去掉图像掩码或点云裁剪后平均降到
    22.3%/12.8%。结果提示显式接地是有效归纳偏置，但接地错误会直接传播且无法恢复，原始演示数据未发布。
