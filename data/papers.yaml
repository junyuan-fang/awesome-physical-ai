  abstract_short: 用预测平移/旋转体素热力图的动作头替换 VLA 原生解码器，以高斯软标签交叉熵训练；作者报告 LIBERO 上相对 OpenVLA-OFT 的 L1 头同步数提升 8.2 个点，并在低数据下更高效。
  summary: 当前 VLA 的动作解码器（离散 token、L1 回归或流匹配）基本都是单点预测，没有利用相邻动作在几何上相近的结构。ActionMap 提出可直接替换原解码器的体素热力图动作头：对每个动作步分别输出三维平移网格、三维欧拉角网格与夹爪二分类的概率分布，训练时以真值为中心的归一化高斯软标签做交叉熵，推理时用
    top-k 软 argmax 还原连续动作。作者在 OpenVLA-OFT（L1 回归头）和 π 系列流匹配模型两种骨干上验证：同等训练步数下 LIBERO 四套件平均分别提升 8.2 个点（97.3% 对 89.1%）和 1.6 个点（98.5%
    对 96.9%），LIBERO-Long 提升最大；在 10%–50% 数据子集上优势更明显；Franka 真机拾放、清扫、插卡等任务在少数据时表现更好，满数据时与流匹配基线持平。解码策略与网格分辨率消融显示结果对超参数不太敏感。结果提示动作表示本身是值得调整的设计维度，但收益在已充分训练的强基线上有限，真机每格仅
