  abstract_short: 提出视觉提示劫持与视觉转移劫持两类攻击，在看似安全的遥操作数据中植入扰动，经世界模型生成后毒化下游策略；作者报告在 DINO-WM 上实现端到端 PPO 后门，并对 Cosmos-Predict2.5 给出概念验证。
  summary: 世界模型正被用于生成机器人训练数据和替代仿真，这为数据供应链引入了新的攻击面。该文设想恶意遥操作数据提供方在外观安全的数据中嵌入经优化的图像扰动与触发物体，只有输入世界模型后才会激活：针对文本条件世界模型的“视觉提示劫持”让生成视频忽略用户提示、改为执行危险操作（如把刀放到炉上）；针对动作条件世界模型的“视觉转移劫持”使除预定动作外的所有动作导致预测崩溃，从而在其中训练的
    RL 策略学到后门。作者在 LIBERO 数据上微调的 Cosmos-Predict2.5-2B 及自建的三类安全相关任务上报告，分布外任务与模糊提示更易被攻击；在 DINO-WM 的 Single Wall 环境中训练 PPO，实现了见到触发物才偏离目标的后门；对
    Cosmos-Predict2.5 动作条件模型和 r2Dreamer 给出预测退化的概念验证；附录显示朴素的 Cosmos Guardrail 等防护基本无效。该工作提示世界模型应被纳入机器人安全评估，但 VLA 场景仅为概念验证，攻击尚未在更真实的端到端管线中验证，作者也承认攻击实现远非最优。
