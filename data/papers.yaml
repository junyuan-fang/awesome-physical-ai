    checkpoint。
  summary: 为检验「后训练规划器本身」能否提升 agentic 机器人系统（而非只改进 harness 或外部记忆），作者提出 AgenticRoboRL：跨 harness 的规划器后训练框架，以 SFT 在成功轨迹上初始化、再以多轮
    RL 优化，通过 harness 专用 adapter 把录制的模型调用与 episode 结果对齐，从而用同一管线支持 VLA 技能调用（RPent）与控制代码生成（CaP-X）两种执行机制。作者报告 9B Qwen3.5 规划器在
