    rollout 的逐轮与逐回合文本诊断形成"文本梯度"，先演化技能、再演化 harness，并以束搜索保留候选。在 VLABench 上（Qwen3.6-27B 规划器 + 官方 VLA 检查点，作者自建 C1–C4 四个划分、共 800
