  summary: 为解决端到端导航策略缺乏多样真实数据、仿真数据又有 sim-to-real gap 的问题，作者提出 ScaleNav：以共享 DiT 联合预测未来观测与动作块，先在约 1.8 万段互联网自我中心视频上做指令条件视频预训练，再用
    InteriorGS/Habitat-GS 仿真数据做动作对齐并联合微调。作者报告单视角 Short-Horizon OVON（524 episode）成功率 86.5%，自建 HabitatGS-LN（157 episode/45 场景）94.9%、SPL
    86.1，优于 LocateAnything+NavDP/ApexNav、StreamVLN、Uni-NaVid；消融中去掉互联网视频预训练降至 90.4%，改用伪动作则降至 73.9%。Unitree Go2 三环境 60 次试验总体
    83.3%（无互联网视频版 65.0%）。结果提示视频预训练提供可迁移导航先验，但任务限于室内、初始视野内可见目标。
