  abstract_short: 在统一框架下系统比较41种潜动作模型设计（建模范式、正则、集成方式），结论包括LAPO仍是强基线、正则强度比类型更关键，潜动作微调VLM可改善下游策略。
  summary: 为解决潜动作模型（LAM）研究设定不一致、难以判断哪些设计真正影响下游操作的问题，作者把代表性方法统一到预训练LAM、用潜动作微调VLM骨干（Qwen3-VL-4B，OpenVLA-OFT式）、少量动作数据后训练的三阶段流程中，系统比较7种建模范式、21种正则设置和15种集成策略共41种设计，并检验4个代理指标与下游成功率的相关性；Stage
    II使用约5900万帧无动作视频语料。在LIBERO、LIBERO-Plus与RoboTwin2.0（3个种子平均）上，作者报告LAPO综合最好、DINO特征差分接近，光流类方法最差；正则强度比正则类型更关键，VQ-VAE在LIBERO-Plus零样本扰动下最稳健；仅有视频时LAP优于DAP；潜动作维度存在较优取值；加入OXE扩充Stage
    II语料在LIBERO-Plus上最多提升9个百分点；Franka真机四任务上潜动作微调版收敛更快。结果为LAM设计提供了实用参考，但结论基于单一骨干与有限基准，真机规模小，扩展规律仅在两档语料上观察。
