    45.0%、进度 87.85%，π0.5 为 22.5%/73.05%，GR00T N1.7 与 LingBot-VLA 更低；在奶茶、整理书、打扫房间上，测试时计算将成功次数由 5/6/5 提升到 7/9/7（各 10 次），下一子任务预测准确率随计算量上升。结果支持对子任务层做测试时搜索的价值，但每项试验仅
