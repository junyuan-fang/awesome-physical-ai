- arxiv_id: '2605.30834'
  title: 'Hide-and-Seek in Trajectories: Discovering Failure Signals for VLA Runtime Monitoring'
  authors: Park, Seongheon et al.
  affiliations:
  - University of Wisconsin–Madison
  - Georgia Institute of Technology
  date: '2026-05-29'
  venue: NeurIPS 2026
