  summary: 为结合世界-动作模型（WAM）从视频学习物理动态的能力与 VLA 的语言推理能力，作者提出 WLA：以自回归 Transformer（RynnBrain-2B）为骨干预测“下一状态”，包括文本子任务意图与由 meta-query
    输出的紧凑物理动态；后者由 World Expert（SANA-600M）以预测未来画面为目标监督，再与流匹配 Action Expert 共同生成动作。推理默认关闭 World Expert 以降低延迟，也可开启做“采样多个动作块—想象未来—打分选择”的测试时扩展。作者报告
    WLA-0 无具身预训练，在 RoboTwin 2.0 Clean/随机化上 92.94%/90.02%，LIBERO 平均 98.6%（测试时扩展 98.9%），在记忆依赖的 RMBench 四任务平均 56.5%（明显高于 Mem-0
