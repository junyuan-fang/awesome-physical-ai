  abstract_short: RIFT 用可学习的预期 token 一次前向生成未来 K/V 缓存，取代世界动作模型的迭代视频 rollout；作者报告 LIBERO 98.8%、提速 3.1–9.2 倍，真机三任务平均成功率 45.3%。
  summary: 世界动作模型（WAM）依赖迭代生成未来视频来条件化动作，部署延迟高。作者先在 4 个 WAM、40 个 LIBERO 任务上做配对闭环干预：屏蔽或扰动未来 K/V 缓存会显著改变轨迹并降低成功率，而在整个动作去噪中复用同一份最终干净缓存几乎不影响执行（末端平均位移误差约
    1.7–1.9 cm），说明动作读取的是未来表征而非 rollout 过程。据此提出 RIFT：在 Fast-WAM-Joint 架构中放入可学习的预期 token，一次骨干前向构造完整未来缓存，并以条件流匹配作辅助监督。作者报告 LIBERO
    总成功率 98.8%，高于同骨干、同数据的 rollout 式方法，延迟降低 3.1–9.2 倍；未再训练时 LIBERO-Plus 为 81.1%；RoboTwin 2.0 干净/随机场景为 92.9%/92.6%；Galaxea R1
    Lite 真机三任务各 50 次试验平均 45.3%，比 Fast-WAM-Joint 高 6.0 个百分点。该结果提示 WAM 可保留未来条件化而省去部署时的视频生成，但干预结论限于所测模型与协同去噪设置，RoboTwin 上各方法差距很小，真机仅三项任务。
