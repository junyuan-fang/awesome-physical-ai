    2.5与Wan2.2多个骨干上实现，结合自回归转换与DMD2蒸馏加速推理。作者报告：最佳配置相对Cosmos 2.5原生动作条件基线，机器人运动误差降低90.4%、物体运动误差降低60.2%；在IWS六个任务上中训练模型零样本与少数据适配更好；在RoboLab五个策略×六任务开环回放中，生成成功率与参考成功率Pearson
