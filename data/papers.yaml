  abstract_short: 把视频世界模型的 3D 记忆从 RGB 点云搬到扩散潜空间，作者报告端到端生成最高提速 10.57 倍、显存降 55 倍，WorldScore 平均分 70.36 居对比方法首位。
  summary: 为缓解视频世界模型依赖 RGB 点云记忆所带来的反复渲染、VAE 重编码开销与信息损失，作者提出 latent spatial memory：把 VAE 潜变量 token 经深度引导反投影存入 3D 缓存，读取时直接在潜分辨率上投影到目标相机视角，并通过
    ControlNet 式旁路与 LoRA 注入 Wan2.2-5B 主干；生成后再把新帧回写记忆，同时滤除动态物体和天空（v2 中方法名为 LSM-World，v1 摘要称 Mirage）。在 RealEstate10K 上训练后，作者报告
    WorldScore 平均分 70.36，高于 Spatia 等带 3D 缓存的方法与通用视频模型；RealEstate10K 新视角合成 SSIM/LPIPS 最佳，闭环回访 PSNR_C/SSIM_C 最佳；单卡 H100 下缓存读取时间与显存增长远慢于
    RGB 缓存。消融显示潜空间记忆优于同源 RGB 记忆、动态过滤有助长时稳定。该结果提示潜空间缓存是兼顾一致性与效率的可行设计，但实验仅限相机轨迹控制的场景生成，未涉及机器人动作条件或下游决策，对具身任务的价值尚未验证。
