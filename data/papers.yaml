  abstract_short: GesVLA 把指点手势作为与语言并行的指令模态，双 VLM 结构加半合成手势数据；作者报告 ARX5 真机三项挑选任务平均成功率 83.3%，纯文本 VLA 为 31.7%，手势意图识别准确率 94.3%。
  summary: 为解决多相似物体场景下纯文本指令难以指明“这个/放那里”的空间歧义，作者提出 GesVLA：把 MediaPipe 提取的食指与手腕关键点编码为潜变量，与手势关键帧、语言一起输入负责意图推理的 VLM，再由负责在线感知的
    VLM 通过交叉注意力读取其隐状态、驱动 flow-matching 动作专家；数据侧把渲染的手模型叠加到真实 RGB-D 场景上，自动生成带精确指向标注的半合成手势数据，并采用先训练意图推理、再冻结它训练动作的两阶段策略。作者报告在
    88 个真实测试场景中意图识别准确率 94.3%，高于提示式 Qwen3.5-plus 的 38.6% 和几何流水线的 59.1%；在 ARX5 真机抓放积木、挑果冻、挑果蔬三项任务（各 20 次）上平均成功率 83.3%，对比纯文本
    VLA 31.7%、几何流水线+VLA 41.7%、解耦 VLM 变体 61.7%，并有数据增强与训练策略消融。结果提示手势作为一等模态能显著减少拥挤场景的目标歧义，但评测仅单一平台、每任务 20 次，手势依赖固定侧视相机且仅支持指点类手势。
  links:
    arxiv: https://arxiv.org/abs/2605.22812
    project: https://gwxuan.github.io/GesVLA/
    code: https://github.com/GWxuan/GesVLA
  highlight: ''
  review:
    scores:
      C: 3
      E: 3
      O: 3
