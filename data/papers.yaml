  summary: 为解决世界动作模型的视觉推演难以反映接触结果、外观相似的候选动作可能导致滑移或卡滞的问题，作者提出HiTac-WAM：在预训练DreamZero世界动作模型上加触觉分支，通过定向注意力掩码让触觉查询读取视频-动作上下文，并按接触状态→接触条件3D形变→滑移风险的有向层级（带stop-gradient）预测每个候选动作块的未来触觉轨迹；规划时综合触觉代价与任务进度给候选排序，执行时把所选预测作为参考，持续偏差触发安全回撤与重规划。在IMETA-Y1机器人与DM-Tac
    W2触觉传感器上，作者报告平均接触F1为0.921，有向层级较纯形变预测器3D位移误差降17.6%、较纯滑移预测器AUPRC提升60.4%；在薯片抓取、擦黑板、USB插入（共360次真机试验）中，DreamZero单候选31.1%、反应式触觉40.0%、触觉预测排序61.1%、完整系统72.2%。结果提示结构化触觉预测能改善动作选择，但逐任务训练、每任务仅200条示范，滑移风险未校准，代码未开放。
