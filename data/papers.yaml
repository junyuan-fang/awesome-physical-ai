  abstract_short: LIBERO-VIFO 在 40 个 LIBERO 任务上构建 8 类、1,347 个视觉提示实例，同时评测 VLA 跟随授权提示的能力与受未授权提示诱导的风险；作者报告无语言指令时 7 个模型仍有 32–60%
    会执行提示所指任务。
  summary: 视觉提示（箭头、轨迹、文字卡、标识等）正被用于引导机器人，但已有评测只覆盖少量提示形式且只看最终成功率，也没有考虑未授权提示带来的安全风险。为弥补这一缺口，作者发布 LIBERO-VIFO：包含 8 类视觉提示资产（含一套面向机器人的标识体系）和自动插入管线，在
    40 个 LIBERO 任务上生成 1,347 个任务条件化实例；设置四个协议，分别考察四阶段 VQA 理解、授权跟随、语言-提示冲突和无语言诱导。对 OpenVLA-OFT、π0.5、MolmoAct2、InstructVLA、InternVLA-A1.5
    等 7 个 VLA 的评测中，作者报告全链理解准确率不超过 17.6%，理解强不等于跟随强；语言与提示冲突时所有模型未授权跟随率均为 0；但无语言时提示诱导执行率达 32.2–60.1%。场景物体化提示、HazardArena 危险场景与
