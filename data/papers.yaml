    token，仅作为动作专家条件而不进入视觉-语言前缀；通过三阶段训练（对比+重建 grounding、对齐、端到端）接入，并在自建多平台视触觉数据集 NeoData 上预训练。此外提出 ALTER，用进度模型、触觉检测的掉落事件和人工纠正生成二值优势标签做离线策略改进。作者报告在
