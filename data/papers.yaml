  abstract_short: 把机器人动作表示为像素空间中被部分揭示的实体轨迹掩膜来条件视频模型，同一检查点兼作前向与逆向模型；作者报告 DROID/BEHAVIOR 上重建指标明显优于 Ctrl-World，并用于策略评估与规划。
  summary: 为解决视频模型难以接收与其视觉先验对齐、又不依赖特定本体的动作信号这一问题，作者提出 Masked Visual Actions：把动作表示为视频中某个实体（机器人或物体）被部分揭示的时空掩膜轨迹。揭示机器人运动时模型充当前向动力学模型，揭示期望的物体运动时则反推机器人行为。方法以
    Wan-Fun-Control 2.2 14B 为基座做 LoRA 微调，仅用约 15 小时 DROID 真实数据与 RoboCasa 仿真数据（分割与渲染两种掩膜构造）。作者报告在 DROID 上 LPIPS/SSIM/PSNR 为
    0.0945/0.887/23.74，明显优于 Ctrl-World 等基线；在未见过的 BEHAVIOR 双臂本体和自制夹爪上仍可泛化；在 RoboCasa 与真机上想象 rollout 的成功趋势与真实执行相关，用于 Diffusion
    Policy 候选排序可提升成功率，逆向建模也能恢复有竞争力的动作。该结果提示像素对齐的动作接口有助于跨本体世界建模，但模型学到的是相关而非因果，推理速度受 14B 基座限制，规划与评估依赖 VLM 判分。
