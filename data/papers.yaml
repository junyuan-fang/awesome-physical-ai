  summary: 双臂灵巧手协同抓取大物体的研究多停留在仿真，并且依赖完整的物体网格，也不考虑真机上的可达性与接触稳定性。为此作者提出一个真机框架：先在 Unitree H1-2 加 Inspire 灵巧手上用 Apple Vision Pro
    遥操作，采集 33 个大物体、353 次抓取的多模态数据（关节角、RGB-D、关节力矩、触觉）；再用 SAM 分割出物体，经 PointNet++ 编码后由 DDPM 生成双臂关节构型；执行时先做带中间路点的运动规划，再进行“手臂内收直到受阻、手指弯曲直到接触”的力引导微调。在按物体划分的测试集上（7
    个未见物体，每个 5 种位姿、每种 3 次），作者报告总成功率 61.90%，高于 BimanGrasp-DDPM（28.57%）、ViSiL-HD（37.14%）以及单手方法 GraspNet 和 DexGraspAnything；去掉运动规划、力微调或
    DDPM 后成功率都明显下降。这提示真机数据加上执行期反馈对大物体协同抓取很关键，但物体数量少、场景单一（统一背景的桌面），基线需要改造才能跨本体对比，而且模型只预测静态构型，没有把触觉纳入学习。
