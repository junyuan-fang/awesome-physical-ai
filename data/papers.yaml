    Meta Aria 眼镜的第一视角注视映射为机器人视角下的目标掩膜和注视点；再在感知层把轮廓与注视热图绘制到观测图上，在动作层把掩膜和注视点编码为空间 token、以稳定初始化方式注入 GR00T N1.5 的 DiT 动作头。在 Unitree
