    89.3%。
  summary: 为摆脱物理遥操作对真机硬件与固定工作空间的依赖，作者提出数字遥操作范式：操作者的手部位姿流驱动以机器人为中心的生成式世界模型，从单张参考图合成机器人第一视角视频，而记录的位姿经 IK 重定向后即为动作标签，从而得到可直接用于模仿学习的轨迹。RynnWorld-Teleop
    基于 Wan2.2-TI2V-5B，以深度感知骨架渲染作为控制信号，先在 EgoDex、VITRA 人类视频上预训练，再用 1800 条人-机配对数据适配机器人域，并蒸馏为因果自回归学生模型。在 TIANJI M6 双臂+WUJI 灵巧手平台的
    4 个任务上（每任务 35 次），作者报告仅用 300 条生成数据训练的 DP/π0/π0.5 平均成功率为 54–64%，低于 300 条真机数据（77–83%）；而真机数据加 300 条生成数据可稳定提升，优于颜色增强与 H2R 对照，加
