  summary: 为缓解双臂机器人与双臂数据稀缺的问题，作者提出 MonoDuo：遥操作单臂 Franka 完成双臂任务的一侧、人手完成另一侧，并轮换左右角色；再用 HaMeR+SAM2+ICP 估计人手位姿并重定向为末端动作，通过"交叉绘制"（渲染掩膜、E2FGVI
    修复、按 URDF 叠加目标机器人）把人手和源机器人替换为目标双臂 UR5e，合成训练数据并训练 Diffusion Policy。在搬箱、装包、拉拉链、递盘、叠衣 5 个真实任务（每任务 200 条源示范）上，作者报告零样本部署成功率
