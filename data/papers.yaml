  abstract_short: SparsePR 以响应耦合分组与探针拟合残差重建实现免训练块稀疏注意力，作者报告在 Cosmos-Predict2.5 等四个视频/世界模型上端到端加速 1.48–2.61 倍且保真度优于 SVG2 等基线。
  summary: 为解决块稀疏注意力加速视频 Transformer 时，同组查询偏好的键集合不重合、保留注意力质量也不等于保留输出的问题，作者提出免训练的 SparsePR：先按键对采样查询的响应对 K/V 分组，再按查询对键组中心的响应对查询分组以共享路由；随后对少量探针查询计算精确注意力，用加权岭回归拟合稀疏输出到残差的仿射映射并补偿其余查询。在
    HunyuanVideo、Wan2.2 与两个物理世界模型 Cosmos-Predict2.5、Cosmos3-Nano 上，作者报告在约 22% 执行对密度下未探针查询的注意力输出误差比语义分组无校正降低 61.6–90.5%，端到端加速
    1.48–2.61 倍，与稠密参考的 PSNR 为 24.42–31.84 dB，VBench/PBench 质量接近稠密，并对分组、探针选择与校正形式做了消融。该结果提示这类加速可降低视频世界模型推理成本，但它是通用视频生成基础设施，未在机器人规划或策略评估等下游任务上验证。
