    VLM 与动作模块之间的接口——VLM 推断下一阶段目标并输出视觉基元 token，这些 token 条件化 flow-matching 动作专家，其监督信号由末端执行器运动学导出。根据摘要，作者在通用抓放真机实验中报告成功率比 π0.5
    高 37.04%，并在数据效率、空间组合泛化和物体级迁移上有一致提升。然而该论文 v4（2026-09-20）已被作者撤回，备注称希望完成进一步实验改进后再发表；缓存中没有正文，前三个版本的实验设置、基线配置和试验次数均无法在本次复查中核对。因此该条目暂不评分：其思路与解耦式
