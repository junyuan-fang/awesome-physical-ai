  summary: 为解决长时程操作中失败起点模糊、缺少逐帧标注而难以在线检测失败的问题，作者提出 Foresight：冻结 V-JEPA 2-AC 视觉编码器，在各数据集上训练动作条件预测器，取“给定策略下一动作块后预测的潜态”作为时间步
    token，输入因果 Transformer 输出逐步失败分数，只用轨迹级成败标签训练，并以函数型共形预测在成功轨迹上校准随时间变化的阈值。它不依赖策略内部状态，可跨策略使用。在 LIBERO-Long、自建 ManiSkill-Long
    与 BEHAVIOR-1K 上，与 FAIL-Detect、SAFE、RND、Gauge 比较，作者报告平衡准确率均为最佳（LIBERO-Long 0.94），在两个更长基准上 ROC-AUC 也最佳，BEHAVIOR-1K 上 0.76/0.78
    对比最强基线 0.72/0.64；ReactorX 与 Franka 真机四种策略中三种设置 ROC-AUC 最佳，跨策略迁移可行但不对称。该结果提示动作条件世界模型潜变量是可扩展的监控信号，但 LIBERO 上 ROC-AUC 并不领先，世界模型计算开销大，共形保证依赖校准分布匹配。
