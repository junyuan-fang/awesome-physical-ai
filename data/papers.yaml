  abstract_short: 以21种接触拓扑模板为条件、在夹爪规范工作空间中物体无关训练的灵巧抓取生成器；作者报告在DexGraspNet上稳定性与拓扑符合度优于分类学感知基线Dexonomy。
  summary: 为解决灵巧抓取规划器只优化稳定性、倾向生成包络式力量抓取而难以按功能需求生成指定抓型的问题，作者在GOAG的物体无关范式上提出CoToGrasp：将Gonzalez分类学改编为21个夹爪接触拓扑模板，在夹爪规范工作空间中用DGCNN局部特征、Transformer与Set
    Transformer学习“给定拓扑时哪些夹爪区域被激活”，训练数据仅由夹爪运动学采样与模板配对生成（21万样本，不需物体网格）；推理时将物体特征投影到同一工作空间预测接触模板，并经标签一致性检查与优化得到抓取，同时提出拓扑符合度与熵指标。作者报告：相对DFC、GenDexGrasp、DRO-Grasp与GOAG等无条件规划器，其成功率较低（36.94%）但语义熵最高、生成更快；相对Dexonomy在DexGraspNet上成功率与拓扑符合度更高，尤其是精细抓取；Allegro真机演示多种拓扑抓取。结果提示拓扑条件化能缓解抓型模式坍塌，但物理成功率明显低于无条件方法，真机仅静态保持的定性验证。
  links:
