  summary: 为缓解多指灵巧手真机遥操作数据昂贵、人手视频存在本体差异和重定向误差的问题，作者提出 SPD：操作者戴 VR 头显在 MuJoCo 中直接操控与真机对齐的双臂 + 双 22 自由度灵巧手（相机布局、物体相近），5 名操作者一周采集约
