    包含预测未来视觉潜变量的 latent expert、低频去噪的 action expert 与高频触觉 refinement 的 tactile expert，在固定时间步切分流匹配轨迹实现异步级联去噪，并用时序 VQ-VAE 编码指尖力历史。训练分三阶段：沿用
    EgoScale 的 2.2 万小时人类第一视角视频预训练、触觉中训练、约 100 条示教的任务后训练。在 Dexmate Vega-1 双臂加 Sharpa 22 自由度手上的 12 项任务（每项 16 次）中，作者报告平均成功率 65%，最强基线
