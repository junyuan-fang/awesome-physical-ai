  abstract_short: SBLR 在仿真中用点云加指尖力的"神谕传感器"训练策略，用整流流网络在潜空间对齐真实触觉，并以瓶颈重建适应信息损失；作者报告 GelSight Mini 与 DIGIT 真机零样本成功率 85%–97.5%，高于物理触觉仿真基线
    7.5–15 个百分点。
  summary: 触觉传感器种类多、迭代快，为每种传感器建立物理仿真需要大量专业投入，仿真信号也难以逼真。为绕开传感器专用仿真，作者提出 SBLR：在仿真中用易于获取的"神谕传感器"（点云加指尖接触力）训练 RL 策略；在仿真与真实环境中分别采集固定物体的随机探测数据，用本体感觉最近邻构造伪配对，训练双向整流流网络在神谕潜表示与真实触觉潜表示之间转换；第二阶段
    RL 中先把神谕潜表示映射到触觉再映射回来，让策略适应真实传感器带来的信息损失。在 Isaac Lab 的插销、齿轮啮合、拧螺母三项 Factory 任务中（以 TacSL 仿真作代理真实环境），作者报告 SBLR 接近可直接访问触觉仿真的神谕策略，优于离散接触位置、最优传输对齐和无触觉基线；真机插销与齿轮啮合任务中，使用
    GelSight Mini 与 DIGIT 各 40 次零样本成功率为 85%–97.5%，比物理触觉仿真基线高 7.5–15 个百分点。该结果提示可以不建传感器仿真而实现触觉 sim2real，但仍需针对任务物体采集真实对齐数据，拧螺母上与神谕的差距较大，真机只验证了两项任务。
