  abstract_short: 0.5B 紧凑策略 SLIM 用掩码轨迹预测学习动作锚定的观测隐变量，作者报告 LIBERO 97.5%、LIBERO-Plus 零样本 77.45%、CALVIN 平均长度 4.556，并做了真机验证。
  summary: 大型 VLA 在每个控制步都要跑完整的多模态骨干，像素级世界模型又要预测许多与控制无关的外观细节，两者都推高了计算与延迟。为此作者提出 0.5B 参数的 SLIM：以 DINOv2 观测隐变量和连续动作 token 为输入，用
    Mixture-of-Transformers 骨干建模二者的交互。第一阶段做自监督掩码轨迹预测，同时包含逆动力学分支（由当前与未来隐变量重建动作）和前向动力学分支（由当前观测与动作预测 EMA 目标下的未来隐变量）；第二阶段用 flow
    matching 训练可部署策略。作者报告：仅用 LIBERO 数据训练时原始 LIBERO 达 97.5%，同一 checkpoint 在 LIBERO-Plus 零样本为 77.45%，CALVIN ABC→D 平均序列长度 4.556；在
    5 个真机任务（共 750 条示教，含背景、光照、干扰物扰动）上，平均进度分在多数设置下最高，背景扰动下略低于 π0.5 类基线；推理延迟与显存明显低于 7B 级基线。消融显示第一阶段训练和 EMA 目标都有贡献。这提示把动力学作为训练信号塑造紧凑表征，可能是大骨干之外的一条高效路线，但目前只验证了单一模型规模、没有跨本体预训练，也未说明能否扩展到更多样的任务。
