  abstract_short: 把视觉运动策略表示为动作空间的条件去噪扩散过程，配合滚动时域控制与时序扩散 Transformer；作者报告在 4 个基准 15 项任务上平均提升 46.9%。
  summary: 模仿学习中的动作分布常常多模态、具有时序相关性且要求高精度，显式回归会平均化多模态，隐式策略（IBC）训练又不稳定。Diffusion Policy 把视觉运动策略建模为条件 DDPM：以观测为条件，对未来一段动作序列逐步去噪，执行其中部分动作后再滚动重规划；提供
    1D 时序 CNN（FiLM 条件）与时序扩散 Transformer 两种骨干，配合端到端训练的 ResNet-18 视觉编码器、平方余弦噪声调度和 DDIM 加速推理（真机约 0.1 秒延迟）。在 Robomimic、Push-T、Block
    Pushing、Franka Kitchen 等 4 个基准 15 项任务上（3 个种子、多次初始化），作者报告其在所有任务上优于 LSTM-GMM、IBC、BET，平均成功率提升 46.9%；真机 Push-T、马克杯翻转、倒酱与抹酱及双臂任务也取得较高成功率，分析了多模态表达、位置控制协同、动作序列预测和训练稳定性。该方法已成为视觉运动策略的默认基线；局限是推理比单步策略慢，且依赖较多高质量示范。
