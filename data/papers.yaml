  summary: 为在实时控制约束下让世界-动作模型真正用上足够长的视觉历史，作者提出 Long-WAM：先在约 10,000 窗口等效小时的机器人/第一视角视频上做自回归视频预训练（LongLive2.0-Robot），再以因果到因果方式适配动作头，并用异步执行、流式
    VAE 与 NVFP4 量化在边缘设备部署。RoboCasa GR-1 上作者报告上下文从 0 增至 19.2 s 使成功率由 63.3% 升至 78.7%，而双向预训练初始化无净增益；LIBERO-Long 99.5%、RoboTwin
    2.0 平均 94.4%、DOMINO 34.9% SR。RTX 5090 上每动作块（含未来视频潜变量预测）107.4 ms；G1 与 YAM 真机每条件 20 次试验，动态叠杯 95%。该结果提示历史的价值取决于预训练是否学会因果预测，但
    38.4 s 时性能回落，且各基准数字不可横向比较。
