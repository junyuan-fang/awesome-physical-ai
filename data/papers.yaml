    25 个有解析参考分布的场景）用总变差距离衡量概率质量是否对齐，PAW-Coverage（碰撞、稳定性等 25 个场景）衡量合理结果的覆盖率；配套 PAWEval 用 Gemini 按场景规则把每条视频映射为终局结果。对 Veo3.1、Kling
    3、Cosmos 3、Wan2.2 等 11 个模型每场景采样 50 次，作者报告没有模型同时做到低 TVD、高覆盖与高可判读率，平均 TVD 远高于有限样本基线；PAWEval 与人工判断一致率 81.3%。提示词、初始噪声耦合与 LoRA
