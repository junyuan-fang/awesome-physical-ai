  abstract_short: Hide-and-Seek 仅用轨迹级成败标签，以轨迹间/内对比损失训练 VLA 运行时失败检测器；作者报告在 LIBERO-10、VLABench 与真机上对 OpenVLA、π0、π0.5 均优于 SAFE
    等基线。
  summary: 为解决 VLA 失败检测要么依赖昂贵的动作重采样或外部 VLM、要么把轨迹级标签均匀摊到每一步而引入标签噪声的问题，作者把失败检测表述为粗监督学习：在 VLA 内部动作嵌入上训练轻量 LSTM 检测器，用轨迹间对比损失让失败轨迹中最可疑的一步得分高于成功轨迹中最像失败的一步，再用轨迹内对比损失围绕推断的失败起点拉开前后得分，部署时用函数型保形预测构造随时间变化的报警阈值。在
    LIBERO-10 和 VLABench 上、针对 OpenVLA、π0、π0.5 三种策略，作者报告在已见与未见任务的 bACC、wACC、TWA 上均优于 OOD 检测、多采样不确定性与 SAFE 等十余种基线；在 xArm 6 真机两组任务上
    TWA 也最佳；与 Qwen3-VL-8B 在线监控相比，作者报告 bACC 0.843 对 0.712、单步延迟约 1 ms 对 2.3 s。结果提示弱监督即可学到可迁移的失败信号，但检测器需针对每个策略收集成败轨迹训练，且目前仓库仍为占位。
  links:
    arxiv: https://arxiv.org/abs/2605.30834
    project: https://seongheon-96.github.io/hide_and_seek_site/
