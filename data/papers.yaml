  summary: 为弥补现有视频生成基准偏重画质与短时一致性、且多局限单一领域的缺口，作者构建 WorldOlympiad：1,000 段长视频测试集（400 机器人视频取自 RoboCOIN 双臂操作数据、400 游戏视频、200 真实视频），并设三条赛道——物理赛道用
    SAM3 分割加 MLLM 裁判判断力学、热学、材料规则；几何赛道用 Gaussian splatting 重建生成视频，评估结构、跨视角与相机轨迹一致性；交互赛道评估分块指令遵循与块间过渡。作者在统一默认配置下评测 Matrix-Game
    2.0、LingBot-World、Cosmos-Predict-2.5、WoW 等 8 个模型，报告 LingBot-World 总分 0.683 最高，Cosmos-Predict-2.5（2B）以 0.671 接近；几何一致性最高仅
    0.424，热学与材料题较力学更脆弱；并给出与人类偏好排名的对齐分析。该结果提示当前视频世界模型在 3D 一致性和长时交互上仍有明显短板，但评测高度依赖 MLLM 裁判和重建管线，且只考察生成视频质量，不直接衡量其对机器人策略评估或训练的有效性。
