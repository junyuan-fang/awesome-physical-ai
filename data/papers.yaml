  abstract_short: 世界-动作模型（WAM）综述：界定其与 VLA、视频世界模型的边界，按“渲染后解码/仅潜空间/无视频生成”三类及四轴结构梳理现有工作与数据、评测和开放问题。
  summary: 为厘清近两年快速膨胀的“世界-动作模型”与通用世界模型、视频生成模型、VLA 之间的模糊边界，这篇 57 页综述先给出定义：只有当预测的未来进入动作产生、打分或训练路径时才算 WAM。随后从两个互补视角组织文献：一是推理时必须生成到哪一步——渲染像素后解码动作（如
    UniPi、AVDC）、只用中间潜变量或特征（如 VPP、Genie Envisioner）、完全不用视频生成骨干（如 FLARE、JEPA 类）；二是按预测基底、骨干族、动作耦合方式和部署方式四轴拆解，并以统一记号把每项工作列入普查表。在此基础上讨论可交互性、因果性、持久性、物理合理性与泛化，以及数据、评测与开放挑战，归纳出“少生成未来、保留控制所需信息”的趋势。该综述为快速变化的
    WAM 方向提供了分类框架与工作清单，但收录截至 2026 年 5 月，分类边界属作者界定，未做统一实验对比。
