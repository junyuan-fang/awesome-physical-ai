  abstract_short: 测试时采样多条动作块并用轻量潜在世界模型推演，按观测潜态最接近者切换执行块，无需微调 VLA；作者报告 SO-101 上 USB 插拔 75%→95% 等真机提升。
  summary: 为缓解 VLA 动作块一旦提交即开环执行、在随机动力学和执行误差下脆弱的问题，作者提出 DREAM-Chunk：测试时从固定策略批量采样多条候选动作块，用与策略同数据训练的轻量潜在世界模型（RSSM 或 JEPA 式，约
    15M 参数）并行推演各块的潜在未来，执行中每步把真实观测编码后与同相位“梦境”潜态匹配并切换到最一致的块，无需策略微调。在 Kinetix 12 个 2D 环境中，作者报告随动作噪声与候选数增大收益增加，且依赖示范中含纠正行为；在 SO-101（SmolVLA）三项任务
    20 次试验中成功率由 75%/60%/35% 升至 95%/80%/45%，并在 Franka 上做了扰动下插罐实验。世界模型开销 <10 ms，但批量采样使 VLA 推理从约 129 ms 增至 300 ms 以上。该结果提示轻量世界模型可作为动作块的反应式选择器，但它只能挑选策略已有的纠正模式，真机任务与试验数较少，边缘设备上的采样规模受限。
