  abstract_short: 将 drifting 生成模型用于动作条件世界模型，单次前向生成未来帧（40+ FPS）；作者报告在 Bridge-V2、RT-1 等 5 个数据集上比扩散基线快 12 倍以上且画质相当或更好，并可用于动作筛选与离线策略评估。
  summary: 为解决扩散式机器人世界模型多步去噪导致推理过慢、难以支撑在线动作搜索和大规模策略评估的问题，作者提出 DriftWorld：把原用于类别条件图像生成的 drifting 模型改造为动作条件视频预测，在训练期学习漂移场，推理时单次前向即可生成未来帧；关键设计包括单正样本漂移目标、把当前帧作为额外负样本的动作强调，以及在
    DINOv2/v3 特征空间计算核并对运动区域加权。在 Push-T、Robomimic、Bridge-V2、RT-1、Language Table 上，作者报告其相对 IRASim、Ctrl-World、GPC、LVDM 等基线快 12
    倍以上，多数视觉指标相当或更优；用于 GPC-RANK 动作筛选时 Push-T IoU 由 0.635 升至 0.772；作为离线模拟器，策略得分与真值的相关系数在 Push-T 为 0.98、Robomimic 为 0.996/0.962。该结果提示单步生成可显著降低世界模型规划成本，但闭环验证仅在仿真中完成，真实数据集只做开环视觉评估，U-Net
