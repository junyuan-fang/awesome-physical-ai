  abstract_short: TAMP-Nav（Embodied-Navigator）让 VLM 只在图像上点选像素再投影成 3D 路点，配合按需推理、锚点轨迹记忆与两级 GRPO；作者报告 R2R-CE 未见验证集成功率 66.2%，仅用
    9 万条轨迹训练。
  summary: 直接用 VLM 做连续环境视觉语言导航时，原子动作或 3D 坐标回归与其 2D 预训练先验不匹配，逐步思维链拖慢推理，长程记忆又易溢出或丢失关键信息。TAMP-Nav 让 Qwen2.5-VL-7B 先选视角再输出 2D
    像素，经深度投影成 3D 路点交给 SLAM 控制器；仅在关键节点触发思维链并存为高保真锚点，其余历史压缩为时空指示 token；先在 9 万条带选择性 CoT 的 MultiNav-CoT 数据上 SFT，再用叠加全局结果奖励与逐步过程奖励的两级
    GRPO 对齐。作者报告在 R2R-CE / RxR-CE 未见验证集上成功率 66.2% / 65.7%，高于 DualVLN、NavFoM 等；每条轨迹平均约 9 步交互、单任务 16.58 s；RL 将成功率从 55.7% 提升到
    66.2%；自动推理比稠密 CoT 少 73.7% 调用、成功率仅降 0.6 点；真机 100 次室内外试验有对比。不过动作执行依赖深度与 SLAM 控制器，CoT 标注依赖 Gemini 教师，与他法的训练数据规模并不对等。
  links:
