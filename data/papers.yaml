  abstract_short: 在低层控制器与力矩接口之间插入只看本体历史的学习型残差力矩模块，纯仿真训练即可零样本上真机；作者报告在 Franka 上同一组权重改善 RL 推箱、BC 翻转与 MPC 平衡任务，优于在线辨识与 RMA。
  summary: 为解决同一策略在不同机器人实例、负载或仿真与真实之间动力学差异导致的运动偏差，而又不想让策略本身做域随机化或为每台机器人重新采集辨识数据，TAM 把适应层下移到力矩接口：历史编码器把关节位置、速度与施加力矩的长时历史（附加以理想模型逆动力学计算的物理残差特征）压缩为潜变量，力矩适配器据此对名义力矩输出残差修正，使目标机器人的局部运动响应匹配理想模型。TAM
    不读取策略观测、奖励或动作空间，只用与任务无关的随机关节运动在随机化仿真中训练，先在 Panda、Piper、RBY-1、iiwa14、Rizon4 五种机器人上预训练，再做目标机器人仿真微调，不使用真机数据。作者报告在真实 Franka
    上，同一组权重挂在视觉 RL 推箱、BC 翻转与 MPC 球盘平衡策略下方，均优于直接执行、粒子滤波在线辨识和 RMA；切换 OSC 控制器和加负载时末端跟踪误差下降；仿真中对未见过的 Google Robot、Unitree Z1 也降低跟踪误差。局限是需要力矩接口与匹配的运动学结构，只学习一步局部对齐、无长时稳定性保证，接触丰富任务中外力仍可能被误判为本体失配。
