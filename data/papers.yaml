  summary: 为让生成式世界模型从片段级预测走向可变长度、可流式延展且可做奖励优化的统一机器人轨迹模型，自变量机器人提出 WALL-SS：以 InfinityStar 初始化，把观测与动作交错成因果序列，每帧由粗到细逐尺度生成；在各尺度注入对齐的动作表示，近期历史保留细尺度、远期压缩为粗尺度以控制记忆，并用尺度级
