  summary: 为让人形机器人在对话中实时做出与语音同步且语义恰当的手势，作者针对语义数据稀缺、模型忽视音频而依赖历史动作（modality eclipse）以及真机自碰撞三点提出 RoboGesture：构建含 300 余类手势的动捕数据集，并用
