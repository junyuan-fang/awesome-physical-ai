  summary: 为利用海量人类交互视频而不依赖成对的人-机数据或精确相机标定，作者提出 H2R-Grounder：在机器人视频中分割并修补掉机械臂，在干净背景上叠加表示夹爪 2D 位置与朝向的点和箭头（H2Rep），以 LoRA 在上下文学习方式微调
