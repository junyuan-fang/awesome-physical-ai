    基线。
  summary: 为解决世界动作模型（WAM）缺乏组合式技能复用、而 agentic 机器人又缺少物理动力学预测落地的问题，作者提出 AW-0：在统一 mixture-of-transformers 主干中把「代码（技能规划）」「未来视频」「机器人动作」作为三条耦合生成流联合去噪（代码用离散
    masked diffusion，视频/动作用 flow matching），并配自动标注流水线把机器人与人类视频轨迹标注为可复用技能库。在 RoboTwin 2.0 上作者报告平均成功率 50.7%（clean 80.8%、random
    20.6%），超过 π0.5、DreamZero、EgoScale、WLA 等基线；在 YAM 双臂与 Tianji–Sharpa 灵巧手共 8 个真机任务上平均 rubric 71.1%，比最强基线高 25.1 分，hybrid 执行进一步改善鲁棒性。结果提示代码规划能把
    WAM 的规划、预测与执行连接起来，但 random 场景性能骤降暴露像素级 OOD 预测的局限。
