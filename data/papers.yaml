  abstract_short: 在冻结 VLA 推理时，用基于动作专家潜变量训练的离线 RL 流策略组合引导动作采样，且仅在失败检测器报警时启用；作者报告 SIMPLER/PolaRiS 分布外任务最高提升 17.3%。
  summary: 为缓解测试时扩展方法中候选动作都来自同一 VLA、继承相关失败模式，且对每一步都施加同样干预的问题，作者提出 RL²：先在 BridgeV2、DROID 上提取 VLA 动作专家潜变量，训练轻量离线 RL 流匹配策略（QAM，OpenVLA
    场景用 V-GPS 的 CQL 策略），推理时把其速度场与冻结 VLA 的速度场加权组合以增加动作多样性；并基于“引导在失败状态有益、在成功状态有害”的缩放分析，用 SAFE 失败检测器仅在预测失败时启用引导，再由 RoboMonkey/CoVer
    验证器选动作。作者报告：SIMPLER 域内任务上 OpenVLA 平均比重复采样基线高 7.5%；π0 在 SIMPLER 分布外指令下平均高 10.1%、分布外环境高 8.5%；π0.5 在 PolaRiS 分布外指令三任务平均成功率由
    31.8% 提至 42.7%；PiperX 真机四任务平均比改写基线高 17.5%，消融支持潜变量与 RL 训练的作用。该结果提示“何时引导”与“如何引导”可模块化叠加于现有 VLA，但依赖外部验证器与按任务训练的失败检测器，计算开销与对新任务的迁移仍需评估。
