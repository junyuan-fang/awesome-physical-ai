  summary: 为解决以大语言模型为中心的 V→L→A 型 VLA 计算与显存开销大、难以实时部署的问题，TurboVLA 采用直接的 V+L→A 结构：DINOv3 编码多视角图像、BERT 编码指令，经由 Grounding DINO
    初始化的轻量双向视觉-语言交叉注意力交换信息，再用 ACT 式解码器输出连续动作块。作者报告在 LIBERO 上 0.2B 参数平均成功率 97.6%，RTX 4090 推理时延 31.2 ms、显存 0.9 GiB，CUDA Graph
