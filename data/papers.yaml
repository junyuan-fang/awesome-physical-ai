  abstract_short: 针对人形机器人遥操作干预数据不完美，提出乐观价值估计与人类经验视频辅助的 VLA 后训练；作者报告两项真机任务三轮迭代后成功率分别升至 80.0% 和 86.7%。
  summary: 为解决人形机器人带灵巧手的干预数据常含犹豫、重定向误差等次优动作、直接当专家监督会被吸收的问题，作者提出 ROVE：搭建支持全身动捕接管的人在回路采集管线，把干预回合拆成自主执行、适应和恢复三段并在适应段末设置保守边界；用
    n 步 TD 自举加期望分位回归的乐观价值估计（OVE）从混合质量轨迹中估计状态价值，并引入跨具身的人类经验视频补充失败与恢复状态；再以二值优势条件化微调 VLA。在 IRON 人形机器人擦白板与放面包入烤面包机两项真机任务上，作者报告
    ROVE 优于 SFT、HG-DAgger、Filtered BC 与 RECAP，三轮迭代后成功率由 45.0% 升至 80.0%、由 56.7% 升至 86.7%；价值曲线分析显示人类视频与 OVE 使价值估计更贴合任务进度。该结果提示对不完美干预做价值加权优于盲目模仿，但只有两个任务、单一平台，评测次数与统计不确定性未充分说明，且尚为迭代离线框架。
