  summary: 为弥补现有世界模型基准主要检查画质或显式指令是否兑现、忽视模型能否从场景推断未被言明后果的缺口，作者发布 WorldExam：把可控行为拆为原子控制单元，并适配到相机轨迹、离散动作、自然语言三类模型接口；共 8 项任务 1,474
    个用例，分静态场景（相机控制、场景回访）与动态交互（主体控制、地形/物体/社交交互、物理反应、目标完成）两条赛道。相机与主体轨迹、地形交互用 VGGT 类几何重建在 3D 中度量，其余任务用 GPT-5.5 作为 VLM 评委按清单打分，并以
    800 个样本报告与人工评分的相关性；还对相机驱动模型做图像位移标定以公平比较。对 20 个代表模型的评测显示：相机驱动模型相机控制强但不支持动态交互，动作驱动模型主体控制更准但世界常“无反应”，语言驱动模型交互更好却难以遵循复杂控制。该基准对把视频世界模型用作具身仿真器有诊断价值，但场景多为生成图像、部分指标依赖闭源
