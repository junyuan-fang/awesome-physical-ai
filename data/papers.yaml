  summary: 为解决帧条件 VLA 在部分可观测下，相似观测对应不同短程意图而在相邻重规划步之间来回切换、导致动作块冲突的问题，作者提出 IntentVLA：以 Qwen3-VL 4B 编码当前图像和指令，用冻结的 VGGT-1B 编码近期头部相机历史帧，经门控交叉注意力融合并追加一个紧凑的历史证据
