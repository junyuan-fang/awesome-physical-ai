simulators:
- id: isaac-lab
  name: Isaac Lab
  desc: NVIDIA's modular RL training framework built on Isaac Sim.
  links:
    project: https://isaac-sim.github.io/IsaacLab
    code: https://github.com/isaac-sim/IsaacLab
  tags:
  - rl
  - gpu-accelerated
  - nvidia
- id: isaac-sim
  name: Isaac Sim
  desc: NVIDIA's full robot simulator with photorealistic rendering.
  links:
    project: https://developer.nvidia.com/isaac/sim
  tags:
  - photorealistic
  - gpu
  - nvidia
- id: genesis
  name: Genesis
  desc: Universal physics engine for robotics — built in pure Python, 43M FPS claim.
  links:
    project: https://genesis-embodied-ai.github.io
    code: https://github.com/Genesis-Embodied-AI/Genesis
    paper: https://arxiv.org/abs/2412.04268
  tags:
  - physics
  - python
  - multi-material
- id: mujoco-mjx
  name: MuJoCo MJX
  desc: GPU/TPU-accelerated JAX-based version of MuJoCo for massive parallel rollouts.
  links:
    project: https://mujoco.readthedocs.io/en/latest/mjx.html
    code: https://github.com/google-deepmind/mujoco
  tags:
  - jax
  - gpu
  - parallel
- id: habitat-3-0
  name: Habitat 3.0
  desc: Photorealistic embodied AI sim with humans, navigation + manipulation.
  links:
    project: https://aihabitat.org
    paper: https://arxiv.org/abs/2310.13724
    code: https://github.com/facebookresearch/habitat-sim
  tags:
  - navigation
  - humans
  - photorealistic
- id: robocasa
  name: RoboCasa
  desc: Large-scale household simulation framework on top of MuJoCo.
  links:
    project: https://robocasa.ai
    paper: https://arxiv.org/abs/2406.02523
    code: https://github.com/robocasa/robocasa
  tags:
  - household
  - mujoco
  - large-scale
- id: maniskill-3
  name: ManiSkill 3
  desc: GPU-parallelized manipulation skill learning sim.
  links:
    project: https://maniskill.ai
    code: https://github.com/haosulab/ManiSkill
  tags:
  - manipulation
  - gpu
- id: motrixsim
  name: MotrixSim (Motphys / 谋先飞)
  desc: Homegrown Chinese real-time physics engine for multibody dynamics & robotics — generalized coordinates + implicit
    solver, GPU multi-world parallel training. Powers the MIIT/CAS-backed AGIROS embodied-AI ecosystem.
  links:
    project: https://www.motphys.com/en/products
    code: https://github.com/Motphys/motrixsim-docs
  tags:
  - physics
  - gpu
  - multibody
  - china
- id: primesim
  name: PrimeSim
  desc: 跨本体、多视角动作条件生成式机器人仿真器；当前官方仓库为占位，代码与权重待发布。
  links:
    paper: https://arxiv.org/abs/2611.04870
    project: https://primebottech.github.io/PrimeSim-website/
    code: https://github.com/PrimebotTech/PrimeSim
  subcategory: world-model
  added: '2026-11-05'
  last_check: '2026-11-05'
- id: cosmos3-interactive-sim
  name: Cosmos 3 Interactive Simulation
  subcategory: world-model
  desc: 以因果蒸馏和有状态流式推理构造动作/空间条件交互视觉模拟；可结合外部物理状态生成观察，不能等同完整物理引擎。
  links:
    code: https://github.com/nvidia/cosmos-framework
    paper: https://arxiv.org/abs/2611.06627
    weights: https://huggingface.co/nvidia/Cosmos3-Nano-Sim-Bimanual
  added: '2026-11-09'
  last_check: '2026-11-09'
