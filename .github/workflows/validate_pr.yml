name: Validate data and pipeline

on:
  push:
    branches: [master]
    paths: ['scripts/**', 'tests/**', '.github/workflows/validate_pr.yml']
  pull_request:
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test daily failure recovery
        run: python -m unittest discover -s tests -v
      - name: Validate data schemas
        run: python scripts/validate.py
      - name: Check for duplicates
        run: python scripts/check_duplicates.py
      - name: Test README generation
        run: python scripts/generate_readme.py
