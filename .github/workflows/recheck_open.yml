name: Recheck open-source status

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC (10:00 Asia/Shanghai)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck-open
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recheck repos on the weekly / monthly cadence
        run: python scripts/recheck_open.py

      - name: Validate and re-render
        run: |
          python scripts/validate.py
          python scripts/generate_readme.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data digests README.md docs)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data digests README.md docs
            git commit -m "chore: recheck open-source status [skip ci]"
            git push
          else
            echo "No changes."
          fi
