name: Daily fetch (08:00 Asia/Shanghai)

# Deterministic half of the daily pipeline: discover candidates, write the review
# stub, and commit it. The review itself needs an agent/human (docs/DAILY_AGENT.md);
# run scripts/run_agent_daily.sh from your scheduler to apply once the stub is filled.
#
# Note: GitHub only runs scheduled workflows on the default branch, so this is
# inert until the v2 pipeline is merged there.

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 08:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch candidates and write the review stub
        run: |
          if [[ ! -f scripts/fetch_candidates.py ]]; then
            echo "v2 pipeline not present on this branch — nothing to do."
            exit 0
          fi
          DAY=$(TZ=Asia/Shanghai date +%F)
          bash scripts/run_daily.sh fetch "$DAY"

      - name: Commit the review stub if new
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          if [[ -n "$(git status --porcelain pipeline/reviews)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pipeline/reviews
            git commit -m "chore: daily fetch $DAY"
            git push
          else
            echo "No new review stub."
          fi
