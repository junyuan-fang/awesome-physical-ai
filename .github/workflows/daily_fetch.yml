name: Manual candidate fetch (fallback)

# Manual fallback only. Windows Codex owns the daily 08:00 schedule (docs/DAILY_AGENT.md).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch candidates and write the review stub
        run: |
          if [[ ! -f scripts/fetch_candidates.py ]]; then
            echo "v2 pipeline not present on this branch 閳?nothing to do."
            exit 0
          fi
          DAY=$(TZ=Asia/Shanghai date +%F)
          bash scripts/run_daily.sh fetch "$DAY"

      - name: Commit the review stub if new
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          if [[ -n "$(git status --porcelain pipeline/reviews)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pipeline/reviews
            git commit -m "chore: daily fetch $DAY"
            git push
          else
            echo "No new review stub."
          fi
