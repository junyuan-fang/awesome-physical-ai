    为同时减少VLA推理等待和慢速示范造成的执行时间，PTS把路径选择与沿路径行进速率分开：每次重规划从固定噪声一步解码，按推理期间已消耗的进度接入新动作段；加速时累加跨过的增量，夹爪变化期间维持原速，并限制执行器和延迟允许的速率。作者在LIBERO上固定π0.5和SmolVLA权重，注入实测推理时间对应的控制延迟，六种模型与套件组合的吞吐均超过所比部署基线，合并提升分别为33%和104%。与同样一步解码、异步但不加速的执行器相比，时间层收益为28%和38%。结果说明执行调度可挖掘冻结策略的效率，但全部来自仿真，速率上限依赖开发集及执行器精度；动态目标条件下主要收益来自异步执行，PTS与普通异步1倍速相当，尚无真机接触任务验证。
