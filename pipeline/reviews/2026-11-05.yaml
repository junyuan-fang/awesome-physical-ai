  one_liner: 研究按场景选择机器人策略；作者在RoboTwin上报告成功率较最佳固定策略高约1.1个百分点、策略推理耗时少24%。
  summary: |
    为在异构策略之间权衡能力与开销，Route Anything把路由定义为基于可见输入选择期望效用减成本最大的候选，并比较能力分类、赢家标签和逐候选结果预测。机器人实验以指令、三路图像及状态预测七个VLA的成功概率，训练使用49000个结果，测试覆盖十个未见任务、2000个场景，清洁与随机化条件各半。作者报告结果回归路由成功率71.6%，最佳固定策略70.45%，同时减少24%的策略推理时间；同条件赢家标签路由仅42.8%。该对照说明保留每个候选的成功信息比只学唯一赢家更合适。局限是机器人部分仅仿真，时间口径为策略查询累计耗时，不能直接当作端到端部署收益；全模态轨迹矩阵未开放，其他模态的平均效率增益也不能直接归于机器人。
