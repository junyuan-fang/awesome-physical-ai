  one_liner: 拆分动作token监督与梯度隔离：作者发现耦合训练通常改善闭环控制，但收益依赖监督方式和训练历史。
  summary: |
    为判断动作专家是否应反向训练VLM，本文在保持数据、初始化和优化配置一致时，交叉比较动作token监督开关与专家梯度耦合或隔离，并考察同时训练、VLM先训练和专家先训练。驾驶实验使用1434个常规、273个分布外场景，以及AlpaSim中827个闭环场景、每场景五次随机执行。作者报告同时训练时，无动作token监督的梯度耦合使开环轨迹误差降低约四分之一；闭环路线进度在有token时由0.600升至0.703，无token时由0.425升至0.601。两类操作VLA在PolaRiS任务也呈相似趋势。结果反对把隔离视为默认最优，但路线进度并非安全指标，部分分阶段配置碰撞增加；实验仅仿真、每条件单训练种子，亦未充分检验通用VLM能力保留。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 2
    T: 3
  rationale:
    C: 以正交控制实验拆分动作token监督与专家梯度作用，对MoT-VLA训练配方有直接参考价值。
    E: 覆盖驾驶开环/闭环、三种训练历史及两类操作模型；每条件仅一次训练，且没有真机。
