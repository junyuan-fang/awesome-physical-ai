  summary: |
    为缓解视觉语言导航输出缺乏物理约束的问题，本文将高层语义命令投影到可行子目标，再由状态估计、在线有符号距离场和带离散指数障碍约束的低维贝塞尔MPPI生成动作，并可加入JPS全局引导。作者在Unitree G1静态障碍及突然出现障碍的两组受控实验中保持前端与任务条件一致，各比较20次执行；启用约束后，两组碰撞率分别从80%、100%降为0%，相应端到端成功率由15%、0%升至40%、70%。另有较长指令、不同语义前端和Vision 60四足部署。结果支持安全执行层的作用，但没有改善模型本身的语义理解；有限试验中无碰撞不能替代理论假设，感知覆盖、SDF准确性、平台足迹及底层跟踪误差仍决定保证是否成立。
