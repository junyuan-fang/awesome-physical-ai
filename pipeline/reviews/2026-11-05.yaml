  rationale:
    C: 将关键帧换形、骨架引导视频生成与深度逆动力学串联，针对灵巧双臂示范迁移提供明确增量。
    E: 两种真实机器人、同数据基线、逐组件消融及第二策略骨干支撑结论，但任务与视角范围有限。
