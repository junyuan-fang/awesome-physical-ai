  one_liner: CRONOS用共享场景研究VLA非回合式强化学习；作者发现针对性重置可缓解训练退化并改善空间与任务序列泛化。
  summary: |
    为研究真实机器人频繁人工复位的成本，CRONOS在ManiSkill3和SimplerEnv基础上构造四个共享场景、共十六项物体放置任务，让后一任务继承前一任务的状态。作者以OpenVLA和SpatialVLA比较每80、320或2560步场景重置，并分别研究末端自动归位、早期密集复位课程和不可恢复场景检测。实验显示单纯减少复位会因末端偏移及物体散落而降低学习效率，针对性机制能缓解这一问题。在相同290万交互步的空间泛化比较中，SpatialVLA采用320步间隔训练后，Overlap成功率由55.2%升至64.3%，Cluttered由51.2%升至55.0%，连续任务后段也获益。其价值在于揭示重置效率与交互效率的权衡，但不可恢复检测依赖仿真特权状态，尚未验证真实机器人或更复杂接触任务。
  venue: ''
  scores:
    C: 4
    E: 3
    O: 2
    T: 3
  rationale:
    C: 把共享场景、稀疏重置及连续任务引入VLA强化学习评测，明确揭示预训练初态偏置。
    E: 两种VLA和多种重置消融、分布外与序列评测较完整，但均为四场景仿真。
