  summary: 为避免自回归VLA必须等整段动作token解码完成才能执行，ActionCodec2以解码器重建状态为参照逐步量化残差，通过运动原语把重建误差约束在容差内，再用Set-BPE跨坐标与相邻时步无损合并，允许增量释放动作。作者给出平移最小原语集及旋转界分析，在24种本体、2万小时语料上拟合通用版本，报告15
