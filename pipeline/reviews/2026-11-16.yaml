  one_liner: 以动作扰动敏感性审计TD-MPC2动力学，显示相近状态误差未必对应相近反事实预测。
  summary: 为检查世界模型是否真正反映动作改变带来的后果，论文借用系统辨识的敏感性分析，对动作施加固定幅度、多方向扰动，比较模型预测与模拟环境的受迫响应，而非只看重建或任务成功。作者冻结已发布TD-MPC2的其他组件，用相同10万交互预算分别从工作区网格、专家模仿和带噪策略数据微调动力学头，再在MetaWorld
    Push和Peg任务的50条留出轨迹中评估状态误差与动作敏感性误差。作者报告带噪和模仿模型状态预测相近，但带噪在两任务的敏感性预测分别改善16%与48%。这支持动作覆盖影响反事实能力，单一输出指标可能遗漏关键缺陷；不表示敏感性较好必然提升规划成功。证据目前仅两项模拟任务、特定扰动幅度与冻结表征，未给出真机控制或安全保障。缓存附录已核对扰动与留出协议，代码、原始数据和跨模型扩展仍待公开核验。
