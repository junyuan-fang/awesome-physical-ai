  one_liner: HALO以手把手示教与被动移动平台采集全身示范，六阶段真机任务作者报告73.3%成功率。
  summary: 为降低双臂操作与底盘移动联合示教的负担，HALO用运动阻力低的被动平台替代采集阶段的部署底座，操作者直接引导末端并自然行走，从而对齐视角、动作和接触反馈。部署前再校准平台与电动底座响应、进行时间对齐，并遮罩修补人手，缓解采集与执行分布差异。作者在相同操作者、任务和预算下与Mobile
    ALOHA及VR遥操作比较，报告示范收集最高加速2.9倍；训练策略在六阶段移动操作中达73.3%成功率，扎带任务为30%，显示精密接触仍困难。实验包含效率、精度、全身协调和处理模块消融，但操作者覆盖有限，不能据此推断不同用户均有同等收益。官方仓库提供策略训练源码，明确要求另备数据与检查点，尚不足以从公开资源完整重现所有采集与部署环节。
