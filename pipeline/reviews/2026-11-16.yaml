  one_liner: SALA以语言语义软邻域对齐无配对人机视频动作，检验人类视频预训练与任务后训练双轴扩展。
  summary: 为避免潜在动作仅按视频外观而非实际操作语义聚类，SALA利用无配对人类与机器人片段的原子动作描述，估计语义相似度并形成软邻域，使人类潜变量靠近相关机器人动作；机器人动作重建与停止梯度将潜空间锚定到控制，不需要配对视频。作者在统一跨本体数据的模拟比较中报告完整模型Clean成功80.2%、Random为48.6%，去掉语义对齐后为75.5%和36.8%，并检查量化及锚定方式。在现实任务中分别增加通用人类视频预训练量和任务相关人类视频后训练量，观察误差与成功率改善。结果支持语义对应可让无动作人类视频提供控制监督，但不是仅靠人类视频零样本获得机器人策略；仍需机器人锚定数据与准确描述。语言可能合并物理不同的动作，已有任务和本体覆盖有限。项目页显示代码待发布，不能将开放承诺计为已可运行训练。
