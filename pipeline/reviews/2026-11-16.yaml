  one_liner: Robo-MLT以多帧流程监控协调VLA，在血气分析与试管分拣真机任务报告82%和70%成功。
  summary: 为避免医疗实验室机器人虽然执行单动作正确却混淆流程阶段、受人干预后停滞，Robo-MLT将协议转成有序原子技能，使用低频多帧监视器判断完成或不可行，再驱动高频技能条件VLA，并异步协调两者。作者在Static-Aloha双臂、三相机输入下，以相同动作接口比较四种策略和VLM监视器，在血气分析及试管分拣每方法50个常规配置与20个移除样本配置中评测。完整系统成功率82%和70%，相对π0.5高30和22个百分点；移除当前试管后可重排剩余流程，恢复分别18/20和17/20。结果提示显式工作流监测有助于长程恢复，但不是临床诊断或医疗安全认证。任务仅两类、工作台和器材较固定，监视触发仍会出错，学习到的流程是否扩展到新协议未检验；目前未核实本研究训练实现、模型与现实数据开放，不能仅凭模块描述判断可复现。
