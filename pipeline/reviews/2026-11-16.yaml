  summary: 为减少给双臂机器人手写多样物体翻转策略的工作，Flip Anything向编码智能体提供24种物体CAD、机器人URDF和英语任务，让其在物理仿真中运行、分析失败并迭代可执行图，逐步加入交接、推倒、推移、稳定抓取及恢复。作者每轮对每物体15个随机位置评估，共360回合，报告从初始仅交接策略89/360成功，即24.7%，提高到最佳调优版本342/360，即95.0%。论文还展示生成策略在真实机器人上完成翻转，项目页可核对执行与视频。这个数值是已用于自改进的物体集合上的模拟结果，不是未知物体或真机95%成功率；代码图中策略选择和接触规则也经过多轮反馈，不能视为一次提示即可泛化。训练与评估对象重合、模型服务可变和完整自学习轨迹未核实，限制独立复现，现实规模证据仍弱于模拟。
