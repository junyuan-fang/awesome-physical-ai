  summary: 为缓解机器人智能体定义混乱、不同运行框架和预算下结果难以比较的问题，文章提出以基础模型与具身运行框架共同构成Embodied System 2，并与技能层System 1、实时控制层System 0分工。评估框架分别考察模型知识与推理，以及工具调用、记忆、安全、成本等闭环系统能力，要求固定接口、预算和时间协议。作者整理近期公开基准结果，强调同一模型成绩会随框架与评测条件变化，但这些结果来自引用文献，并非本文统一重跑的新实验。该工作可作为设计具身智能体评测的概念清单，有助于识别观察陈旧、响应时限和物理约束被忽略的问题；尚不能据此认定提出的新架构优于已有策略，也没有实证建立长期自主性或安全保证。
