  summary: 为在不增加物理轨迹采集的情况下扩充机器人监督，CrowdMAPS把已访问的真实状态重建到网页三维界面，邀请非专家为同一状态给出多个有效目标姿态，沿每状态动作数量的“宽度”而非只增加轨迹长度扩展数据。目标标签可直接训练关键姿态策略，也可转换为合成动作块与连续示范共同训练。作者在五项真机单臂操作中比较标注宽度与额外专家轨迹，报告宽度从1增到10，关键姿态和轨迹策略平均成功率分别提高35.6及33.0个百分点。结果提示软件众包可补充昂贵现实示教，但这些替代动作没有实际执行验证，其效用依赖运动规划和标注有效性；不能视为等价新增真实交互。任务主要准静态桌面操作，新对象需要手工CAD与描述，复杂接触、动态及双臂尚未验证。当前未核实网页标注系统源码、MAPS数据与模型完整开放，复现与标注质控仍需补证。
