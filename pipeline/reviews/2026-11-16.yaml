  one_liner: VLAN以五类用户约束评估导航；七种模型在100个测试场景中仍难兼顾可达性与安全。
  summary: 为弥补传统导航基准把可通行性视为固定场景属性的缺口，VLAN将同一路径的障碍风险与用户本体绑定，构建1000个场景、2万条轨迹和16万关键帧，分别设置动作预测与语言引导任务。数据通过视频重建、Unity编辑和人工可达性标注生成，区分可通过、绕行、高风险和阻断。作者在100个测试场景、每种用户1931条轨迹上评估七种多模态模型，以成功、碰撞和可达性指标衡量五类用户表现，报告InternVL3.5-8B的跨用户AccSR为0.426；额外30条现实轨迹上为0.302。该资源揭示识别障碍不等于会按用户约束规划，但现实验证规模很小，两个任务家族的原始成功率不能直接横比。已开放评测工具与测试数据，训练集和微调流水线仍待发布。
