- arxiv_id: '2611.01729'
  title: 'ODE Policy: Robot Learning via Action Dynamics, Not Actions'
  prefilter_score: 18.0
  triage: include
  reason: 范围内：连续时间动作策略，同时验证模仿学习、强化学习与真机控制。
  category: rl-il
  route: core
  contribution: method
  tags:
  - neural-ode
  - imitation-learning
  - action-chunking
  - continuous-control
  affiliations:
  - MARS Lab, Nanyang Technological University
  one_liner: 学习动作随物理时间的导数并积分生成轨迹，在 LIBERO、多类策略和14项真机任务中验证效率与连续性。
  summary: |
    为缓解动作块不连续及迭代生成的计算成本，ODE Policy 学习动作随物理时间演化的向量场，从当前动作积分得到后续轨迹，以整段路径误差监督而不直接拟合带噪导数。收缩性正则和跨块延续进一步约束初值扰动，并通过混合速度头容纳多模态行为。作者在 LIBERO、扰动测试、强化学习以及 VLA/WAM 适配中比较多种策略，并在四类平台的14项真机任务上验证。在 Franka 每任务40条演示、20次测试的条件下，袜子折叠成功15/20，最佳对照8/20；插入为14/20，对照4/20。结果支持连续时间参数化改善学习效率及接触任务执行，但小样本真机结果仍有统计不确定性，摄像机变化会使部分视觉策略失败；动作头加速不能直接等同于完整系统延迟下降，也没有保证真实机械系统始终平滑稳定。
  venue: ''
  scores:
    C: 4
    E: 5
    O: 3
    T: 3
  rationale:
    C: 方法将动作导数学习、路径监督与跨块积分统一，并可嵌入 IL、RL、VLA 和 WAM，方法增量清晰。
    E: 第5至7节覆盖多基准、强基线、结构消融、扰动泛化及四类平台14项真机任务，证据广度达到高档；真机单项次数仍有限。
    O: Apache-2.0 仓库包含训练、基线、评测及部分真机/VLA 分支；未确认作者模型检查点和新增真机数据可下载。
    T: 近五年相关成果尚未独立梳理，默认 3，不把实验广度重复计入团队分。
