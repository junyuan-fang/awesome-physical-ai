- arxiv_id: '2611.03103'
  title: 'VLALagBench: Understanding When and Why VLA Inference Latency Matters'
  prefilter_score: 14.0
  triage: include
  reason: 范围内：衡量移动目标条件下 VLA 推理延迟影响的控制评测基准。
  category: vla
