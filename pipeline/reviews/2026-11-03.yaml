- arxiv_id: '2611.01815'
  title: When Does Latent Prediction Error Support Physical Surprise Claims in Video World Models?
  prefilter_score: 11.0
  triage: include
  reason: 范围内：分析动作条件世界模型的预测误差是否支持物理理解判断，直接关联具身建模与评测。
  category: world-model
