  one_liner: 将视觉与渲染触觉代理融合进扩散策略，三种子模拟装配测试中报告59.0%成功率，纯视觉为42.7%。
  summary: |
    为检验接触附近信息对装配策略的帮助，本文在 MuJoCo 的 UR5 任务中，将双相机视觉和两个指尖的局部几何渲染图经 ResNet18、短时 GRU 融合，再以 FiLM 调制扩散动作网络。训练另预测两步后的触觉变化，作为辅助监督；这一路径只在训练使用演示动作，不为部署提供特权控制。作者以三个随机种子、每种子100次配对测试比较观测组合，报告融合策略成功率59.0±2.6%，纯视觉42.7±1.5%，纯触觉代理33.7±0.6%，其中误差项为种子间标准差。结果支持额外局部几何观测有助于这组模拟装配，但所谓触觉是渲染的 RGB 代理，不是经标定的压力或形变传感；所有测试几何都在训练出现，且没有真机验证。种子仅三个，探索性区间不能消除统计局限，也不能由此推出真实触觉硬件的收益。
