    E: 第3至5节覆盖多模型、受控延迟和调度对照，附录 F 有 SO101 验证；真机每条件仅五次，外推需谨慎。
    O: 论文声明将发布代码，但 https://github.com/codestrongestx/VLALagBench 本次返回404，未确认可运行资产，给 2。
    T: 作者相关积累未逐项独立核验，默认 3，不按院校背景推高分数。
