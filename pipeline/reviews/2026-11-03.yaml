  one_liner: 以物理违例、外观扰动和动作对照审计视频世界模型，显示潜空间预测误差不能直接当作物理惊讶度。
  summary: |
    为检验潜空间预测误差能否代表物理规律违背，本文把冻结读出、几何内容、外观变化、静态重复和动作条件配对分开评估，同时讨论校准和不确定性。作者检查 V-JEPA2、VideoMAE2 及用于 PushT、TwoRoom 等控制环境的世界模型，在 IntPhys2 留出场景、256种 Kubric 配置生成的3072段视频及 Physion 片段中构建对照。结果显示外观扰动可产生强于物理违例的信号，合法与不合法事件的误差排序会随设置反转；在所测 Physion 窗口中，静态重复对照有84%产生更高误差。该分析提示评测应先证明分数对动作和物理结构的选择性，而非把低预测误差直接称作物理理解。结论受程序化事件族和选定表征限制，也未测量下游控制收益。公开仓库提供脚本及部分记录，但历史结果校验不等于重新运行全部模型推理。
