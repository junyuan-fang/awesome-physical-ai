  one_liner: FineCraft 按已知任务选择独立适配策略，结合局部视觉与专家续接，在 MetaFine 五任务挑战获综合分0.878、第四名。
  summary: |
    为提高部件识别和多阶段精细操作能力，FineCraft 用已知任务编号选择独立策略：瓶身/瓶盖抓取及字母插入采用 DINOv2 关键点、可见性和局部特征驱动 DiT，其余任务以 LoRA 微调 π0.5。训练结合示范与困难状态下的专家续接，执行时短步重规划，并用阶段、停滞分类器触发插入收尾和纠偏。作者依据 MetaFine 五任务官方榜单报告第四名、综合分0.878，其中杯子运输1.000、字母插入0.681，说明不同精度与持续控制要求下效果并不一致。结果支持按任务适配感知和动作监督，但0.878混合了感知曲线面积、理解及行为指标，不能写成87.8%成功率；已知任务路由也不是学到的通用专家选择器。验证限于单一模拟挑战，局部诊断版本与官方提交不同，尚缺真机和完整组件消融。当前开放五任务推理代码与权重，训练流程并未完整发布。
