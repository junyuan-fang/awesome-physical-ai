  - Nanyang Technological University
  - Stanford University
  - NVIDIA
  one_liner: 在移动目标任务中控制延迟与速度，并比较同步和异步执行；真机小样本验证显示仅静态成功率不足以刻画 VLA。
  summary: |
    为衡量静态操作评测遗漏的推理时延风险，VLALagBench 将释放、放置、抓取和抽屉操作改为目标运动任务，分别控制运动速度、推理延迟与执行调度，并用截止时间安排避免不同延迟改变动作预算。主体在 LIBERO 衍生环境评测 π0.5、GR00T 与 MolmoAct2，扫描0至250毫秒附加延迟，比较同步、延迟异步和连续异步策略，并补充跨模拟器实验。附录在 SO101 上以两种目标速度、三档延迟做小规模验证：0.02米/秒抓取小物体时，延迟从267增至467毫秒，成功由3/5降为0/5；另一释放条件中连续异步改善表现。结果表明时延、场景变化和动作更新方式相互作用，但固定轨迹与每条件五次真机测试不足以概括开放环境可靠性。原文所给代码地址本次返回404，不能把发布承诺视为已复现基准。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 2
    T: 3
  rationale:
