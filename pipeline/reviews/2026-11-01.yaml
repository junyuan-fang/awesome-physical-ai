  one_liner: TouchBridge把人类视觉触觉示教转换为机器人训练数据，四项真机任务平均成功率72.5%。
  summary: |
    为减少灵巧操作对昂贵机器人遥操作数据的依赖，TouchBridge联合设计人类采集端与机器人端的视觉、指尖触觉接口，并用Tac-Retarget保持接触区域及手内、双手之间的空间关系。随后通过视觉合成和相机坐标中的动作转换，将人类示教变为机器人域数据，用于微调预训练VLA。作者在翻书、拧灯泡、挤酱和抓易碎蛋卷四项真实任务中报告，仅用转换数据训练的策略平均成功率72.5%，等量机器人遥操作数据为77.5%，人类采集速度为后者七倍。与DexPilot、UniDex及触觉消融的对照支持接触约束的重要性。该流程重定向时不依赖物体网格或物理仿真，但接触评估使用了仿真重建；示教规模和任务范围仍小，不能据此断言跨任意手型及物体泛化，代码和资产开放情况未确认。
