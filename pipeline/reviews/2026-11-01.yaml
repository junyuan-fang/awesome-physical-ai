  summary: |
    为弥补灵巧手研究在机器人配置、示教采集和策略评测之间工具分散的问题，DexSuite在Genesis上统一任务接口、机械臂与末端组合、遥操作及模拟触觉。框架覆盖30项任务、10种机械臂和12种末端，并选取16个任务形态配对构成基准，配套4700段来自人工、脚本及学习策略的成功轨迹。作者比较状态和图像输入下的多种模仿策略，发现灵巧手并非总因动作维度较高而更难，性能取决于任务和策略；堆叠、连续多物体操作与工具使用仍明显困难。资源价值在于统一条件下分离形态差异与任务复杂性，但当前证据集中在仿真，成功示教也不能代表失败覆盖。项目页可见数据入口与格式说明，原探测Genesis仓库不能代替DexSuite代码；因此认可明确的部分资源开放，训练框架发布和许可仍需补核。
