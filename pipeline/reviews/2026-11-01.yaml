  one_liner: CSO 先用成功轨迹稳定技能表征，再冻结编码器优化策略，作者报告LIBERO成功率从80.1%升至97.5%。
  summary: |
    为缓解技能离散化策略在强化学习微调时表征漂移、概率比不稳定的问题，CSO采用分阶段优化：先以在线成功轨迹进行强化监督微调，使技能表示适应当前任务，再冻结编码器，以技能级概率比进行PPO更新。方法保留多步动作技能结构，减少策略更新与编码空间同时变化造成的耦合。作者在LIBERO、RoboTwin及真实机器人任务上比较技能策略与微调基线，报告LIBERO成功率从80.1%提高至97.5%；五项真机任务的汇总结果为61%，对照QueST为41%。阶段与更新方式消融支持稳定表示的作用，实验也涉及少量示范初始化的条件。结果提示分离表示适配与策略改进可能提高技能强化学习效率，但收益仍受初始示范质量、在线交互预算和技能量化精度制约。不同数据及任务条件的结果不能直接拼成统一提升幅度，缓存未确认本方法的公开代码与训练资产。
