    为降低流匹配动作策略从通用噪声出发反复去噪的计算成本，TOPS从已有离线轨迹构造任务相关、多模态的源分布，并通过反向专家调度设置其协方差，使采样起点更接近可行专家动作。方法不增加在线检索环节，主要改变训练与推断时的源分布选择。作者在LIBERO、CALVIN及八项真机任务中比较标准流匹配和少步采样方案；在LIBERO-10指定配置中，两次函数求值的单步方案成功率由标准对照的53.44%提高至69.67%，采样耗时约为六分之一。真机每任务20次评估，抽屉任务的相应结果由20%升至80%，其他任务结果需分别理解。少步生成与源分布消融支持其效率收益，但任务标识和离线专家分布是重要前提。LIBERO扰动评估未覆盖相机变化，不能据此外推全部视觉泛化；未知任务的源分布构造与完整复现资产仍未核实。
