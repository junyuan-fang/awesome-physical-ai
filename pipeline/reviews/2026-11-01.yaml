  one_liner: BURGER用282项绘图任务诊断VLA语言理解、空间组合及多模态动作，包含28200段仿真示教。
  summary: |
    为分离语言理解与初始图像捷径，BURGER让机器人每次从空白画布出发，按照语言而非目标草图执行绘制。提示驱动流程把图形内容转换为连续末端轨迹，允许同一指令对应不同笔画顺序和有效形状。作者构建282项任务、28200段仿真示教，对五种VLA比较数据规模、任务多样性、空间关系和动作分布，发现不同架构存在不同失败模式，部分模型能组合已知对象形成未见布局。Franka Panda实验还展示了依据人类新画笔画继续完成图案的闭环行为。该基准适合分析语言到动作的联系，但真实实验使用平台数据微调，不能描述为纯仿真零样本迁移；任务简化了笔刷动力学与接触过程，自动笔画顺序也可能引入偏差。原探测的LeRobot是依赖项目，本文代码和数据的实际发布状态仍待核验。
