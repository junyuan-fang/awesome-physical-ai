  one_liner: OSMAbench 用625个匹配场景测试语义谨慎行为，揭示物体语义识别与运动避让之间的差距。
  summary: |
    为评估机器人能否依据物体或场景含义调整移动方式，OSMAbench构建包含18类实体、三档谨慎等级、七条路线和五种厨房的625个匹配场景，并以距离净空及按行程归一化的速度等指标刻画运动谨慎程度。作者在同一策略家族内改变语义处理方式，比较直接决策与视觉语言模型输出参数后交由运动控制的方案。结果显示，模型能够识别需要谨慎对待的语义对象，却未必在实际轨迹中表现出相应减速或避让；显式分离语义参数与执行有助于缩小这一差距。该设计提供了比问答准确率更贴近行为的评估视角，但谨慎等级由基准设定，不能视为客观通用安全标准。证据仅来自仿真及有限策略家族，未验证真实人机交互或事故风险。缓存中的OpenTau仓库属于依赖，不能据此认定本基准已开放，也没有足够依据登记可下载资源。
