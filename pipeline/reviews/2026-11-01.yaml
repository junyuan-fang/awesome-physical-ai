  one_liner: Robotic Data Inoculation 用在线残差扰动促使操作者示范恢复，在三项真机精细操作中评估鲁棒性。
  summary: |
    为弥补人工示范通常只覆盖顺利轨迹、缺少偏离后恢复行为的问题，该方法在遥操作时加入强化学习产生的残差扰动，让操作者在保持任务控制的同时应对失误与状态偏移。采集到的恢复轨迹随后用于行为克隆或离线强化学习，目标是让最终自主策略学会回到可完成任务的状态。作者在插线、T形块和键帽三类真实精细操作中比较干净示范、随机扰动和学习扰动的数据，报告在所设分布偏移下的成功率改善，并分析扰动强度与恢复覆盖的关系。结果支持把采集过程主动扩展到失败邻域，但不能据此把采集称为无人操作：人类仍负责连续控制和纠正，残差学习也需要任务奖励。部分条件的采集成功率及轨迹组成不同，数据质量与扰动机制的贡献不能完全分离。项目入口可追踪，完整代码、各类采集轨迹和许可仍需核实。
