  one_liner: CuraEval 审计机器人示范筛选协议，显示部分筛选收益会随检查点选择和评估次数改变。
  summary: |
    为解决示范数据筛选方法常因训练预算、检查点选择与评估噪声产生不可比结论的问题，CuraEval建立统一模仿学习评估流程，并重新考察基于轨迹长度、动作统计等指标的筛选策略。作者使用robomimic的can、square和transport多操作者数据，各任务约300条示范，比较扩散策略与循环行为克隆。分析发现，部分复杂评分与轨迹长度高度相关，例如功率谱相关指标与长度的相关系数接近0.999。检查点和测试次数也会改变结论：square上长度筛选的表面优势，在采用最终检查点与更多评估回合后不再保持。结果提示数据筛选收益必须与完整数据基线在一致协议下检验，多重比较后不能把偶然提高当成普遍优势。证据主要来自少量状态输入任务，尚未覆盖大规模视觉预训练、真实采集成本或跨机器人数据；公开入口存在，但完整执行资产仍待核实。
