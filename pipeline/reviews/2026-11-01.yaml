  one_liner: ARC 将人工纠正拆成时机与低维方向，再学习残差控制；三项真机任务平均成功率由33.3%升至75%。
  summary: |
    为减少模仿学习策略失误后需要重新采集完整示范的成本，ARC把人工干预拆成何时纠正、在哪些动作方向纠正以及施加多大修正三部分。操作者标记介入时机并提供少量方向反馈，系统在低维子空间内学习残差策略，保持原有ACT策略冻结。作者在Miroki机器人三项任务上使用约55条初始示范，每任务加入约八至十条纠正轨迹，再进行两轮自主学习，每轮以12次执行评估。汇总成功率从33.3%提高到75%，所选二维或三维子空间解释了七关节纠正幅度的约96%至97.7%。结果说明特定任务的纠正可以集中在少数方向，从而降低残差学习难度。但低维结构依赖任务和已有策略，不能据此外推所有机器人错误都具有相同性质。人工仍需决定介入时机，评估样本也较少，尚缺更广泛任务、操作者差异及长期失败恢复测试；代码与训练资产未获确认。
