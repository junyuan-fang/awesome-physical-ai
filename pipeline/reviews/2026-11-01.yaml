  one_liner: PRIME W0 融合历史视觉、世界模型子目标与分层动作专家，作者报告 LIBERO 平均成功率99.1%。
  summary: |
    为缓解当前观测驱动的VLA缺少时序上下文及动作结构约束，PRIME W0把视觉语言骨干逐层KV注入混合专家动作头，并异步生成子目标图像；历史帧经DINOv2桥接，协方差噪声则用于流匹配动作生成。训练分为视觉语言预训练、离散动作预训练、解码器组装和联合微调。补读原文实验后，作者报告LIBERO四套任务平均成功率99.1%，自建真机五类任务平均78.1%，对比表中的π0.5为69.1%；这些数字对应各自评测设置，不能与其他论文直接排名。组件消融支持历史信息和子目标条件的作用，但多个模块及约一万小时混合数据共同变化，贡献拆分仍需谨慎。缓存未保留完整实验样本与重复试验信息，项目页本次不可访问，训练资产和复现条件仍待确认。
