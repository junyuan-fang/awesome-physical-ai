  one_liner: TERRA 用奖励加权动力学适配与探索规划改善地形迁移，作者报告仿真多数设置五次试验内成功。
  summary: |
    为使轮式机器人面对新地形时快速修正动力学误差，TERRA对已有模型进行奖励加权的低秩适配，并学习预测模型损失，用于引导模型预测控制中的探索。方法把少量部署试验集中到可能改善任务表现的状态，避免仅追求全局预测误差下降。作者在仿真中以一百个随机种子、每种设置最多十次试验评估适应速度，报告约90%的设置在五次以内达到目标；真实ERNEST平台在模拟火星风化层材料上的结果显示，通常三至五次试验即可改善通行表现。组件与基线比较支持奖励加权及主动探索的作用，但试验成功率仍依赖任务奖励、损失分箱阈值和初始动力学模型。仿真地形与坡度覆盖有限，真机环境也不足以代表所有户外松软地面。工作展示少次在线适配的潜力，不能推断无需部署奖励或试错即可迁移；项目入口存在，完整复现资产仍待核查。
