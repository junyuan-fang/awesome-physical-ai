  one_liner: 动态操作研究表明执行时域、异步调度与动作连续性共同影响VLA反应性，缩短重规划间隔并非总有收益。
  summary: 为解释预训练VLA在动态目标前反应迟缓的原因，作者将预测时域、执行时域、推理调度和轨迹连续性分开控制，把多种执行机制适配到共同策略与任务设置，并测试历史运动信息和奖励引导的潜变量调整。DOM和DOMINO仿真、传送带及移动杯等真机实验显示，约一秒预测窗口在所测设置较好，而最佳执行窗口依赖检查点；若策略每个动作块起步缓慢，频繁重规划反而阻止有效运动。异步执行只有与连续轨迹衔接配合才能充分发挥短窗口优势，基于不确定性的自适应窗口还会付出额外推理代价。结果支持同时报告观测年龄、可用动作和连续性，但不是对所有原始方法完整系统的排名。真机每设置15至20次且部分目标手动移动，小差异不宜过度解释；本次未找到官方开放资源。
