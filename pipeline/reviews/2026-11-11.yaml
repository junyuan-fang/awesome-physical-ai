  one_liner: LingBot-Touch统一异构触觉表示；作者报告在26项真机任务中将π0.5平均成功率从48.1%提高至69.9%。
  summary: 为缓解触觉经验被传感原理和布局割裂的问题，LingBot-Touch把压阻、磁和视触觉信号映射至规范指尖坐标，通过模态专属分词器、共享Transformer与JEPA潜在预测学习接触表示。原始PDF方法部分记录4983小时预训练数据，冻结编码器后将触觉token接入策略。在26项真机任务、每项20次测试的协议下，作者报告π0.5平均成功率由48.1%升至69.9%，并比较直接加入原始触觉的对照；另有两种手型的探针、12项仿真强化学习任务及数据规模消融。结果支持跨传感器表征迁移，但尚未覆盖电容触觉、掌面和更多手型。当前仓库明确是推理编码器发布，不能把已有实质代码标记解释为完整预训练流水线开放。各项数字仅适用于论文所述测试协议。
