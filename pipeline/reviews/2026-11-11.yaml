  one_liner: RoboScript以单示范和仿真排练更新任务记忆；作者报告RoboTwin 2.0两种设置平均成功率83.4%。
  summary: 为减少操作技能对固定训练分布和权重更新的依赖，WICL让冻结基础模型从单条示范出发，在可重置世界中排练并把反馈写入语义任务记忆。原始PDF的方法说明RoboScript分离技能构建、记忆学习、部署和反思，并用数据隔离及记忆检查器限制部署阶段获取仿真特权信息。在RoboTwin
    2.0全部50项任务、每种设置每项10回合下，作者报告干净与随机化成功率83.6%和83.2%，平均83.4%；结果需与使用更多示范训练的策略区分计算和交互预算。四项PiPER真机任务各10回合成功数为10、7、7、6，但采用离线完整动作序列而非在线重规划。结果支持语义记忆迁移，仍依赖仿真排练、外部模型与工具，真实部署代码尚列为待发布。
