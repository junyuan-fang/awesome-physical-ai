  one_liner: DASH解耦慢语义与快动作流；作者在50项RoboTwin任务上报告0.8B至8B骨干均保持20 Hz控制。
  summary: 为缓解大视觉语言骨干延迟使机器人动作基于过期观测的问题，DASH把冻结VLM和流匹配动作头作为独立进程，经LCM异步通信。动作头融合陈旧语义与自身ResNet提供的新鲜视觉，训练时随机错开两个流的时间，并按实际延迟对重叠动作块聚合。缓存所载v2在会计入推理延迟的50项RoboTwin任务上，每配置约250回合，作者报告0.8B至8B模型保持20
    Hz，同步执行降至9.7至4.1 Hz；相应成功率提升随骨干而异，并非单调随模型增大。另有灵巧手人形机器人抓放实验及组件比较。结果支持执行系统与训练分布协同设计，但任务仍集中于桌面操作，仿真延迟建模和特定硬件测量限制外推；本次未找到可确认的官方代码或权重发布。
