  one_liner: Embodied First Exam以1156项仿真任务评测编码智能体；作者报告最强系统在456项核心任务的标准设置成功率为34%。
  summary: 为评估编码智能体进入物理世界前的控制能力，EFE把1156项任务、35个套件与47种机器人封装为统一容器和外部验证器接口，允许直接控制、编程或训练策略。方法区分可读仿真状态且可重置的特权设置、只读传感器且通常不能重置的标准设置，以及世界持续运行的实时设置。作者对456项核心任务比较八个模型与运行框架组合，报告最强组合在标准设置成功率为34%；在391项配对困难任务上，特权与标准结果为77%和30%，重置消融提示可恢复性影响很大。失败阶段分析补充总成功率，但每项仅一次尝试，缺少重复试验置信区间，主要结论仍来自仿真。公开任务与评测框架可核查，不能据此推断真实机器人上的同等表现。各项数字仅适用于论文所述测试协议。
