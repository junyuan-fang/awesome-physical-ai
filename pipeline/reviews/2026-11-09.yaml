  summary: |
    为缓解高自由度人形关节差异和分层控制训练失配，H²MARL 将每个力矩自由度视为带物理属性描述的异质智能体，高层输出姿态增量，低层以历史状态 Transformer 生成执行目标，并用共同交互轨迹联合优化。作者在 Humanoid-v2 与 Isaac Gym 中比较 HAPPO、MAPPO、HATD3，并消融关节异质性、闭环优化、奖励及智能体划分粒度。相较 MAPPO，作者报告足滑和躯干稳定误差分别改善 7.3% 与 35.0%，但动作平滑指标较差；测得两层平均推理合计 9.259 ms。证据说明物理属性和层间协同有助于所测仿真步态，不能据此确认真机鲁棒性或复杂全身任务泛化。推理时延也仅对应论文硬件与配置，不等同端到端控制延迟。
