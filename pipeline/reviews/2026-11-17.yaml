- arxiv_id: '2611.20557'
  title: 'AsymEEF: Bimanual Manipulation with Asymmetric End Effectors'
  prefilter_score: 11.5
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: method
  tags:
  - bimanual
  - cross-embodiment
  - demonstration-transfer
  - imitation-learning
  affiliations:
  - 'Affiliation: Georgia Institute of Technology'
  - 'Affiliation: Tsinghua University'
  - 'Affiliation: Equal contribution'
  - 'Affiliation: University of California San Diego'
  one_liner: AsymEEF 对齐异构双手并筛选可执行示范，作者报告三项仿真任务的有效示范平均扩增 16.6 倍。
  summary: |
    为减少同一双臂平台换用不同末端执行器后重采示范的成本，AsymEEF 在机器人模型上标注功能接触点，并用少量实机抓取标定修正跨手型差异。共享编码器把腕姿与执行器状态映射到同一潜空间，由按目标形态条件化的解码器生成控制命令。候选轨迹通过整段回放检验接触顺序、碰撞和任务完成情况，成功示范再与源数据一起训练闭环策略。作者在四项仿真及六项真机桌面任务上对比 LAD 和 CEI，报告真机 CPU 安装的直接回放成功率为 79%，两种基线分别为 31% 和 0%。三项仿真任务的渐进扩增共接受 4,959 条轨迹。效果依赖目标执行器具备相应交互能力，以及手工采集的标定帧，跨机械臂及非桌面任务仍待检验。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 1
    T: 3
  rationale:
    C: 功能接触锚点与共享状态接口支持异构双手示范复用及统一策略训练。
    E: 含四项仿真和六项真机操作、同条件回放基线及表示消融。
    O: 原文提供项目链接，本次无法打开核验，未确认可用实现或工件。
    T: 作者在跨形态策略方向的既有积累待核，暂按默认分。
  evidence_read:
  - abstract
  - intro
  - method
  - experiments
