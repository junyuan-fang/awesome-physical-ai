- arxiv_id: '2611.19196'
  title: 'Ego2Sim2Humanoid: Agentic Real-to-Sim for Learning Loco-Manipulation VLAs without Robot Demonstrations'
  prefilter_score: 21.5
  triage: include
  reason: null
  category: vla
  route: core
  contribution: method
  tags:
  - egocentric-video
  - humanoid
  - loco-manipulation
  - real-to-sim
  affiliations:
  - 'Affiliation: University of Notre Dame'
  one_liner: Ego2Sim2Humanoid 仅用眼镜记录转换训练数据，微调后的 G1 在真机举瓶和戴帽试验中分别成功 9/20 和 5/20 次。
  summary: |
    为减少全身行走操作对机器人遥操作的依赖，Ego2Sim2Humanoid 从第一视角眼镜取得 RGB-D、头部轨迹和可见手部姿态。系统逐段重建碰撞场景及目标接触带，规划可达的抓取与站位，并用运动学过渡和强化学习跟踪修正动作。通过物理筛选的轨迹从机器人视角渲染，与本体状态和控制同步，再用于微调 GR00T N1.7。戴帽录像的仿真对照中，作者报告接触带规划把指节穿透的中位数从直接复制掌姿的 1.8 厘米降至 0.8 厘米。Unitree G1 的两项任务各做二十次自主试验，举瓶成功九次，戴帽成功五次。结果展示了无需目标任务真机示范的训练路径；实际失败主要发生在抓取，薄壁物体也让多数戴帽录像未通过轨迹筛选。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 1
    T: 3
  rationale:
    C: 将眼镜示范重建为经接触物理验证、可用于全身 VLA 的训练轨迹。
    E: 有重定向和抓取对照，以及每个任务二十次 G1 真机测试，验证限于两项任务。
    O: 原文和缓存均未给出本方法代码仓库或可下载工件。
    T: 作者在该方向的近期成果待核，暂按默认分。
