- arxiv_id: '2610.31569'
  title: 'Echo: Coupled Action and Task Status Signal Denoising for Vision Language Action Models'
  prefilter_score: 12.0
  triage: include
  reason: 范围内：具身模型或策略方法，已核对缓存中的方法和实验摘录。
  category: vla
  route: core
  contribution: method
  tags:
  - vla
  - failure-detection
  - flow-matching
  affiliations:
  - SJTU
  - Spirit AI
  - THU
  - USTC
  - Tongji
  - HIT
  one_liner: Echo 将停止与失败信号同动作共同去噪，作者在五项真机任务及 LIBERO-Recovery 中报告收益。
  summary: |-
    为使 VLA 在执行中识别完成与失败，并利用状态判断改善动作，Echo 将停止信号和失败信号追加为动作块的两个维度，与机器人动作共同去噪。训练组合成功、终局失败与恢复轨迹，不依赖逐帧进度标注，但多子任务数据仍需边界信息；通过控制信号与动作的交互，并让信号更快去噪，使后续动作生成利用更干净的状态估计。作者在插花、胶囊玩具、插笔、糖葫芦和开抽屉五项真机任务中报告状态预测与任务完成收益，并以外部分数模型和其他状态增强策略作比较。在 LIBERO-Recovery 的每模型 4500 次试验中，成功率为 34.76%，同成功和恢复数据的纯动作基线为 32.67%，帧级状态准确率为 89.97%。该设计把监控融入策略，但收益仍依赖失败与恢复数据的覆盖，特定任务评分和阈值也限制了跨任务结论，尚未验证长期开放环境运行。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 2
    T: 3
  rationale:
    C: 联合去噪使状态信号参与动作生成，超出单纯旁路监控。
    E: 五项真机、分布偏移分析、信号干预消融及仿真补充支持结论。
    O: 缓存仅支持项目入口或发布承诺，未核实本文对应实质实现。
    T: 尚未核实团队近五年的直接相关代表成果，按未知团队默认 3 分。
