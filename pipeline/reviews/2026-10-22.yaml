- arxiv_id: '2610.22471'
  title: Has GPT-6-Astra Achieved Embodied Intelligence?
  prefilter_score: 26.0
  triage: include
  reason: null
  category: vla
  route: adjacent
  contribution: benchmark
  tags:
  - embodied-evaluation
  - vlm-agent
  - benchmark
  - in-context-learning
  - real-robot
  affiliations:
  - SenseNova
  one_liner: 该报告在 12 个基准上用 ICL+扩展步数协议评测 GPT-6-Astra，并在 8 类真机平台验证；作者报告 LIBERO-Ultra-Long 98.8%、RoboDojo 81.9%，但成本与实体验证仍是瓶颈。
  summary: 为评估前沿通用模型是否已具备具身智能，作者在 12 个基准上以统一协议测试 GPT-6-Astra：允许从训练集演示构建冻结的 in-context 知识包，并把执行步数放宽至官方上限的 10 倍，另在 8 类真机平台做零样本部署，并消融
    System 1/System 2 协作与动作表示。作者报告在 LIBERO-Long++/Ultra-Long/LIBERO-PRO 接近饱和（Ultra-Long 98.8%），RoboDojo 81.9%、DexJoCo 87.3%；扩展预算使
    RoboDojo 成功率约增至三倍。真机上刚性抓放 17/18 成功，而布料折叠 2/4、插头插入 0/11、移动导航 9/23；单次 LIBERO-Ultra-Long 任务约耗九百万 token、近两小时。结果提示基准能力已跨过门槛但实用具身智能未达，代价是
    ICL 依赖昂贵的机器人演示、真机时间不可无限延长，且新基准原型尚未公开。
  venue: ''
  scores:
    C: 4
    E: 5
    O: 4
    T: 4
  rationale:
    C: 首个对前沿通用模型做 12 基准统一协议 + 8 类真机的大规模具身能力评估，提出 ICL/扩展预算协议并讨论下一代基准设计，可能影响评测范式。
    E: 12 个基准 × 两档预算、任务级表格与 token/时间成本、System1/2 与动作表示消融、8 平台真机零样本验证，证据面很广。
    O: RoboRSI harness 与评测代码、27B preview 权重、ICL 数据包已开放，但多个基准组件仍标 coming soon，GPT-6-Astra 本身闭源。
    T: SenseNova 联合研究团队规模大，近期有 RoboRSI 与 SenseNova-Vision 等可核实发布。
  evidence_read:
  - abstract
  - intro
  - method
  - experiments
  - code
  pending_checks:
  - PDF 首页未印出作者单位，仅有 Joint Research Team，机构归属需以官方页面确认
  - 新一代具身基准原型是否公开及其任务/判分细节
  open:
    code: substantive
    repo: https://github.com/OpenSenseNova/SenseNova-RoboRSI
    weights: partial
    data: partial
    license: Apache-2.0
    note: 仓库为 RoboRSI harness（272 个代码文件，含 bench 评测入口），README 仍标 “code release coming soon” 且 RoboDojo/RoboLab/LHVLN/VLN-CE/SIMPLE
      等基准组件未放；HF 提供 27B preview 权重与按基准组织的 ICL experience packages，GPT-6-Astra 本体为闭源 API。
