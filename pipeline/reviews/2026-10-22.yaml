    50 小时的 EgoX-Data-6M（101 个物体、270 个任务脚本），并留出 1 小时作为 EgoX-Bench；EgoX 在 VGGT 式骨干上加手、物体与尺度 token，单次前向预测位姿、深度、双手与物体 6DoF。在 HOT3D、EgoX-Bench、HOI4D、H2O
    上作者报告世界坐标手部 W-MPJPE 均最低（EgoX-Bench 由 WiLoR+SLAM 的 328.81 mm 降至 113.24 mm）、深度 AbsRel 最优，但相机 nATE 在 HOT3D 与 EgoX-Bench 不及
    VGGT-，且仅支持刚性物体、无真机验证。
