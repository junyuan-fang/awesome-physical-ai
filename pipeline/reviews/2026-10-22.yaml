    E: 28 个具身理解基准 + 12 个通用多模态基准、与十余个开源/闭源模型对比，范围广且对照合理，但动作与未来状态预测只有定性图示，无真机成功率、无消融
    O: 8B/2B 权重已在 HF 以 safetensors 提供，含 28 个基准评测脚本的 EvalKit 已开源，但主仓库仅 README 与技术报告，训练代码与训练数据未开放且无许可证
