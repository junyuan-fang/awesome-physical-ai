    E: 在 HOT3D、EgoX-Bench、HOI4D、H2O 四个基准上与手部、物体、几何三类基线对比，并给出 ScaleHead/DepthHead 消融与效率表，但无真机或下游任务验证，且部分相机指标不及 VGGT-
