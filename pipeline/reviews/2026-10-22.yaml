  one_liner: GreenWAM 以 79 维解剖动作空间统一 20 类双臂机器人，世界模型与策略共用一套权重；作者报告 RoboTwin 2.0 平均 67.54%、人形真机 ID 95.6%。
  summary: 为回答“一个机器人世界模型能否同时充当世界模型与策略、并跨身体复用”，作者提出 GreenWAM：在 Cosmos 3 Edge 4B 上定义覆盖 20 类双臂机器人的 79 维解剖动作空间，按视觉、动作条件与世界-动作等七种模式联合训练，并把动作专家拆出、蒸馏单步策略。在
    WorldArena 1.0 track 1 上，作者报告 EWMScore 63.31，轨迹/深度/3D 精度 56.0/98.2/93.4，高于 Motubrain 与 FlowWAM；RoboTwin 2.0 干净 86.98%、随机
    48.10%（平均 67.54%），CALVIN 平均链长 4.64，LIBERO-plus 零样本为对比方法最高；Green 人形指令成功率 ID 95.6%/OOD 84.0%，高于 π0.5 的 84.4%/76.0%。结果提示统一动作空间可行，但训练配方与数据未公开，RoboTwin
    随机设置仍落后于使用随机演示的条目。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 4
    T: 3
  rationale:
    C: 用 79 维共享解剖动作空间把 20 类双臂机器人纳入同一世界-动作模型，并为世界模型/策略双重角色提供统一配方，属世界模型子方向的明确增量。
    E: WorldArena、RoboTwin 2.0（50 任务×100 试）、CALVIN、RoboDojo、LIBERO/plus 与 Green 人形 70 条指令，含三组受控实验，但部分榜单仅给排名或相对值。
    O: 推理/评测代码与 4 个基准 checkpoint 开放（OpenMDW 1.1），训练配方、robotics-stage 基座与 1,688 小时语料未发布。
    T: Sber Robotics Center Brain Team 有 GreenVLA 系列发布，但公开可核实的具身基础模型积累有限。
