  - Duke University
  - University of California, San Diego
  - Tsinghua University
  one_liner: Ropedia W0 用相机位姿+投影骨架统一人/机器人运动，建 1.3 万小时 Xp-Data 与 Xp-Teleop；作者报告在 DreamDojo、ω-HOME 等五个跨具身基准上视频预测领先。
  summary: 为解决跨具身世界模型难以同时建模移动与操作、且人/机器人动作空间异构的问题，作者构建 Ropedia W0：用相机位姿编码移动、投影骨架编码操作，统一人类手部标注与机器人前向运动学，先在 1 万小时人类自我中心视频上预训练，再与
    3 千小时机器人数据等概率混合中训练并蒸馏成 4 步生成器。在 DreamDojo（GR-1 In-lab/EgoDex/HV）、Ψ0、ω-HOME、Xp-Teleop 与 AgiBot 五个跨具身基准上，作者报告 PSNR/SSIM/LPIPS
    与相机轨迹误差均优于 DreamDojo、Cosmos3 等基线；未见过的 EgoSuite/OpenAoE 人类视频上 ATE 1.542、PCK@0.1 81.3%，且 DreamDojo 1% 后训练即超过其 100% 基线。结果提示人类经验可迁移到机器人预测，但主指标是视频预测代理，真机闭环仅作应用演示，Xp-Data
    与训练代码未发布。
  venue: ''
  scores:
    C: 5
    E: 4
    O: 4
    T: 4
  rationale:
    C: 首个跨人类/机器人的自我中心 loco-manipulation 世界基础模型，配套 1.3 万小时 Xp-Data 与 Xp-Teleop，资源与范式增量明确。
    E: 五个跨具身基准（各约 50–100 窗口）+ 未见人类视频 + 数据/模型 scaling + 蒸馏 + 真机应用，基线含 DreamDojo/Cosmos3，但主指标为视频预测代理。
    O: 5B 推理代码与权重、Xp-Teleop 数据已放出且许可清晰，但训练/后训练代码、A14B 与 Xp-Data 未发布。
    T: NTU S-Lab（Ziwei Liu 组）与 Ropedia 在自我中心视频与 3D 视觉有可核实积累。
