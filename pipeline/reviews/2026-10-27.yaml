  one_liner: RoboWorM用运动学和多视几何审计视频世界模型，在约2.9万段生成中揭示画质与物理一致性的加速权衡。
  summary: |-
    为弥补视频世界模型评测偏重视觉观感、缺少机器人结构约束的问题，RoboWorM从五个公共语料整理1605个片段，覆盖单臂、双臂、人形以及单视角和多视角配置，提出运动学指标KIVA与几何一致性指标RIGIS。其评分虽不依赖VLM裁判，KIVA的三维轨迹估计仍依赖在真实视频上训练的诊断模型。作者在三类世界模型、九种加速技术和约2.9万段生成中开展审计；对人类标注，KIVA幻觉检测对齐从最强VLM的58.4%提高到73.5%，RIGIS的Spearman相关由0.326升至0.749。结果提示画质保持并不保证物理约束保持，缓存加速相对稳健；但计时排除模型载入和VAE解码，部分长时对比混杂片段深度，不能直接等同完整部署速度或闭环策略收益。代码和完整基准仍为待发布状态。
