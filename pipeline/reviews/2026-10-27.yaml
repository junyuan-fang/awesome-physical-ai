  one_liner: MOTIO以视频、实景资产和物理反馈生成技能，作者报告共享参考策略完成18项仿真开发任务，并展示G1执行。
  summary: |-
    为减少人形技能开发对专门遥操作示范的依赖，MOTIO把普通人类动作视频、米制三维资产和已有全身控制接口交给智能体，生成带接触事件门控的分阶段程序，再以物理执行、多帧观测及人工验收迭代修改。程序既可执行，也可作为BC与DAgger的专家监督。作者报告33个带时间记录的首次验收案例中，智能体活动时间中位数为97分钟；共享参考策略在同一检查点完成18项仿真开发任务及同条件重复，并展示扫描办公室内101.75秒连续G1瓶子投放执行。结果表明程序化技能可连接工程开发和策略蒸馏，但时间包含工具等待，验收依赖人类判断，十八项任务属于开发集合。同条件成功、个别真机演示和螺钉仿真残差改善不能替代独立测试场景的成功率与硬件安全验证。
