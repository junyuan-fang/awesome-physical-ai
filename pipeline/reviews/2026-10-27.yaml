  summary: |-
    为同时改善离散操作候选选择与连续动作修正，JevVLA冻结原策略，学习依赖观测、任务和动作的标量能量；能量值用于比较候选，动作梯度用于局部修正或引导生成。各基准共用约8万参数的网络结构，但分别训练权重和固定输入输出编码，并非一个适配器零样本覆盖所有环境。作者在MetaWorld MT50、VIMA、LanguageTable、LIBERO Plus和CLIPort上，相对各自匹配冻结策略报告成功率增加1.28至2.31个百分点，另以随机选择、最小动作范数和结构消融分析收益来源。这提示轻量偏好模型能在不更新骨干时改善决策，但部分任务出现退化，缺少额外策略适配基线与真机测试，平均增益不能解释为全面能力提升。更正缓存仓库链接末尾句点后可确认实质实现，公开检查点、反馈数据和使用许可仍未核实。
