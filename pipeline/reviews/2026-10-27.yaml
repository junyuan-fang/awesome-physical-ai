  one_liner: EXE分解共享位置与本体专属动作，作者报告RoboTwin 2.0平均成功率76.2%，真机扫垃圾由60%升至80%。
  summary: |-
    为利用第一人称人类示范又避免手部运动学干扰机器人策略，EXE将动作划分为相机坐标下可共享的位置部分和本体特有的旋转、关节及夹爪部分，分别量化，并用对比与语言关系蒸馏对齐共享码本。随后VLM预测离散动作码，机器人微调阶段通过桥接特征训练连续动作专家。作者在RoboTwin 2.0上报告平均成功率76.2%，相同框架去除前两阶段预训练的基线为73.2%；在24项RoboCasa GR1任务上为56.6%，对应基线为52.0%。AgileX Piper扫垃圾任务使用2450条遥操作示范微调，每组十次试验中，分布内成功率由60%升至80%，新物体干扰条件由10%升至30%。这支持因子化跨本体迁移，但真机样本很小，共享位置的语义对应并非普遍保证，收益仍依赖人类姿态数据质量和下游机器人监督。
