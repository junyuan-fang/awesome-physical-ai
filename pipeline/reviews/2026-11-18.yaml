- arxiv_id: '2611.20481'
  title: 'Lift, See, Act: Hierarchical Robot Policy Pretraining with 3D Foundation Models'
  prefilter_score: 9.5
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: method
  tags:
  - pretraining
  - human-video
  - 3d-representation
  - behavior-cloning
  affiliations:
  - School of Electronic and Information Engineering, South China University of Technology
  one_liner: LSA 用人类视频中的三维监督预训练视觉编码器，在 Franka 四项任务及两种换色设置上平均成功率为 68.3%，HRP 为 41.7%。
  summary: |
    为缓解机器人示范昂贵、仅用稀疏人手轨迹预训练容易丢失交互几何的问题，LSA 先用三维基础模型指导浅层特征对齐，再用注意力和结构监督聚焦手物关系，最后预测未来三维手部轨迹。下游冻结视觉编码器，拼接机器人本体状态，并用少量示范训练行为克隆头，执行时只需 RGB 和本体观测。作者在 MetaWorld、DexArt 和 Adroit 的所选任务上比较多种视觉预训练和三维策略，在四项 MetaWorld 消融任务中报告完整模型平均成功率为 92.2%，未做人类视频预训练时为 73.3%。在 Franka 四项任务及两种擦拭毛巾换色设置中，作者报告六个设置平均成功率为 68.3%，同协议下 HRP 为 41.7%。结果提示离线三维监督可改善二维策略的空间表征，真机每种设置仅十次试验，外观泛化只覆盖同一擦拭任务的颜色变化。
  venue: NeurIPS 2026
  scores:
    C: 4
    E: 4
    O: 4
    T: 3
  rationale:
    C: 将三维基础模型的中间特征、手物结构和运动监督迁移到二维策略编码器。
    E: 三套仿真基准和 Franka 真机均与既有方法比较，并有模块和外观扰动消融。
    O: 仓库以 Apache-2.0 发布实质预训练代码，配套发布整理后的 DexYCB 数据；下游复现资产未核实。
    T: 核对了论文署名，团队既往具身成果待补证。
  evidence_read:
