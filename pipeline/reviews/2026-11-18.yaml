- arxiv_id: '2611.21057'
  title: 'WiTac: Wrist-Informed Tactile Representations for Contact-Rich Manipulation'
  prefilter_score: 8.5
  triage: include
  reason: null
  category: vla
  route: core
  contribution: method
  tags:
  - tactile
  - multimodal-fusion
  - dexterous-manipulation
  - pretraining
  affiliations:
  - Sharpa Robotics
  - PKU
  - SJTU
  - ShanghaiTech
  - CUHK
  one_liner: WiTac 先融合腕部视觉与指尖触觉，Sharpa North 四项真机任务中，GR00T N1.7 平均成功率由 37.5% 提升至 66.3%。
  summary: |
    为解决同一指尖触觉形变在不同手物空间关系下需要不同修正的问题，WiTac 将触觉历史特征锚定于腕部坐标系，结合手部运动与腕部图像生成逐指接触表征。作者在约 300 小时的 SharpaDex v1.0 示范上进行自监督预训练，冻结编码器，再通过门控交叉注意力把接触表征注入动作策略。作者在 Sharpa North 的插电池、擦碗、重新插 USB 和开柜四项任务上各收集 200 条下游遥操作示范，报告 GR00T N1.7 的真机平均成功率为 66.3%，纯视觉基线与去腕部视觉版本分别为 37.5% 和 47.5%。第二种 VLA 主干也观察到提升，离线分析显示腕部视觉有助于解读接触与动作方向。结果提示融合时机影响下游控制，迁移证据仍限于同一硬件平台，且四项任务均需要专门示范。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 3
    T: 4
  rationale:
    C: 先按手指在腕部坐标系中融合接触与视觉，再用门控注入两种动作策略。
    E: 四项真机任务覆盖两种 VLA 主干，同时比较跨模态融合消融和独立触觉基线。
    O: 可获取主要预训练数据及上游变形编码器，完整 WiTac 实现和权重待核验。
    T: Sharpa 已发布同方向大规模视触觉示范及触觉变形编码器。
