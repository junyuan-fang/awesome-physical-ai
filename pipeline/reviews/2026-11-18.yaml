- arxiv_id: '2611.20273'
  title: 'DexFormer 2.0: Towards a Cross-Embodiment Foundation Policy for Dexterous Grasping'
  prefilter_score: 9.0
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: model
  tags:
  - dexterous-grasping
  - cross-embodiment
  - reinforcement-learning
  - sim-to-real
  affiliations:
