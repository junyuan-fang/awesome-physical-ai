    O: 3
    T: 3
  rationale:
    C: 填补工业接触丰富多模态数据空白，规模与多平台多遥操作方式有价值，但数据集形式本身增量中等。
    E: 有真机基线、预训练与遥操作方式对比，但仅3个任务、每配置20次，缺少模态消融。
