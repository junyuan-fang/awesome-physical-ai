  one_liner: OpenWAM 把世界-动作模型拆成可组合模块并系统消融，用 6,369 小时数据训练 OpenWAM-α；作者报告 LIBERO 99.3%、EBench 49.4、真机 RoboDojo 24.4% 成功率。
  summary: 针对世界-动作模型各组件紧耦合、难以判断哪些设计真正有效的问题，作者提出 OpenWAM：把生成骨干、视觉表征、信息流、推理与数据配方拆成可组合模块，形成统一训练/推理/部署/评测栈，并以六组受控实验刻画“强生成骨干+紧凑潜空间”“动作专用容量与显式世界→动作通路”等设计原则，再组合成在
    6,369 小时数据上预训练的 OpenWAM-α。作者报告 LIBERO 99.3%、RoboTwin2.0-Full 93.60%、EBench 49.4（领先约 4 分）、RoboCasa-GR1 60.5、VLABench 58.9；但
    LIBERO-Plus 仅 69.2（π0.5 89.0）、RoboTwin Clean2Random 69.0（Qwen-RM 77.1），作者归因于单臂预训练数据不足；真机 18 项双臂 RoboDojo 任务平均 24.4%（π0.5
    12.8%）。结果提示模块化消融能定位瓶颈，但预训练语料未发布。
  venue: ''
  scores:
