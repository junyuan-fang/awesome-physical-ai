- arxiv_id: '2609.38078'
  title: 'MotorMind: Scaffolding General Vision Language Models for Zero-Shot Robot Manipulation'
  prefilter_score: 23.0
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: method
  tags:
  - vlm-agent
  - zero-shot-manipulation
  - libero-pro
  - real-robot
  - harness
  affiliations:
  - University of Illinois Urbana-Champaign
  one_liner: MotorMind 让冻结通用 VLM 经中层级动作与异步监控直接控制机器人；作者报告 LIBERO-PRO 基础 66.7%、扰动 53.8%，真机 xArm6 平均 95%。
  summary: 为检验通用 VLM 能否不依赖动作专家、代码代理或接地工具直接操作机器人，作者先诊断 VLM 在动作选择、进度评估与子目标完成上的可靠性，再提出 MotorMind：把平移/旋转/夹爪参数化为中层级动作交给确定性控制器，由同一冻结
    VLM 分饰 Planner/Executor/Monitor/Verifier/Memory。作者报告在 LIBERO-PRO 的 Goal/Spatial/Object 三套件上基础成功率 66.7%、四类扰动下 53.8%，而所比较的零样本方法最高仅
