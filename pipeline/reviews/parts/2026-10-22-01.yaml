  one_liner: VLA-Δ 在预训练中用未来状态差文本、结构化转移槽与光流显式监督物理状态变化；作者报告 LIBERO 98.4%、RoboTwin 2.0 平均 90.06%，真机 68.0%。
  summary: 作者指出多数 VLA 直接拟合观测-动作对应、缺少中间物理状态变化的显式监督，而推理链、未来图像或潜空间预测又只监督语义或外观；为此提出 VLA-Δ，在 GR00T N1 上加入可学习 Physical State Difference
    Queries，用未来状态差文本、九类结构化转移槽与稠密光流三路信号在预训练中约束转移表征，下游仅用动作损失微调、推理无额外开销。作者报告 LIBERO 平均 98.4%（GR00T-N1.7 97.0），RoboTwin 2.0 干净/随机
    90.06%/89.74%（ZR-0 88.70%/87.98），LIBERO-Plus 语言扰动 89.0% 对 82.6%；AgileX PiPER 真机五任务 200 次试验平均 68.0%，避障 42.5% 最高；逐信号消融从
    95.70% 提升到 98.40%。结果提示转移监督有效，但真机优势有限，标注流水线依赖 Qwen3.8/SAM3/UniDepth 且未发布。
