- arxiv_id: '2608.10484'
  title: 'Lost in Reconstruction: Aligning Action Representations with Language in Vision-Language-Action Models'
  triage: include
  reason: null
  date_v1: '2026-08-11'
  category: vla
  route: core
  contribution: method
  tags:
  - action-tokenizer
  - language-grounding
  - vq-vae
  - interpretability
  - bridgev2
  affiliations:
  - Carnegie Mellon University
  one_liner: SALT 在 VQ-VAE 动作 tokenizer 中加入“让冻结语言模型从量化动作隐变量还原指令”的对齐损失；作者报告 SimplerEnv 平均成功率为 71.9%，VQ-VAE 和 FAST 分别为 42.7% 和 31.2%。
  summary: |
    VLA 的离散动作表征通常只在原始动作空间按 L1/L2 重建误差优化，数值上相近不等于语义上相近，动词所表达的“怎么做”可能在 tokenization 中丢失。作者先在 BridgeV2 上做诊断：动作轨迹包含视觉状态变化之外的动词信息，而仅以重建为目标的离散化会系统性地削弱这部分信息。为此提出 SALT：保持残差 VQ-VAE 的结构，额外要求冻结的语言模型能从量化后的动作隐变量（作为软前缀）还原整条 episode 的指令，从而只改变 tokenizer 对动作空间的划分，不改动下游 VLA。在 BridgeV2 上训练 0.5B 的 miniVLA、只替换 tokenizer 的对照中，作者报告：SimplerEnv WidowX 四个任务的平均成功率，SALT 为 71.9%，同结构的 VQ-VAE 为 42.7%，FAST 为 31.2%；SALT 在 token ID 和学到的动作嵌入上的动词可解码性也最高，重建误差与 VQ-VAE 接近，并出现了专门对应 flip、turn 等动词的码字。这提示动作表征与语言对齐可能是提升语言条件控制的有效杠杆，但实验只用了单一数据集、小模型和仿真评测，没有真机验证，也没有建立语义码字与性能提升之间的因果机制。
  venue: ''
  scores:
    C: 3
    E: 3
    O: 1
    T: 4
  rationale:
    C: 从语言对齐角度改进动作 tokenizer，提出了新的诊断视角和简洁的损失，但适用范围限于可学习隐空间的 tokenizer
    E: 有严格控制变量的 tokenizer 对照和较充分的表征诊断，但下游评测只有 SimplerEnv 的 4 个任务，没有真机
    O: 探测到的 openvla-mini 是基线框架的仓库，不是本文代码；未找到官方代码
    T: CMU Yonatan Bisk 组在语言落地与具身方向有可核实的积累
