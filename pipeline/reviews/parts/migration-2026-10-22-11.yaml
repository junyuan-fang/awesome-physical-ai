- arxiv_id: '2608.09892'
  title: 'XPolicyLab: A Unified Standard and Open Ecosystem for Robot Policy Evaluation and Deployment'
  triage: include
  reason: null
  date_v1: '2026-08-10'
  category: vla
  route: adjacent
  contribution: infra
  tags:
  - policy-evaluation
  - deployment
