- arxiv_id: '2608.09853'
  title: 'RynnValue: Scaling Robotic Value Foundation Models with Temporal Distance'
  triage: include
  reason: null
  date_v1: '2026-08-10'
  category: foundation-general
  route: core
  contribution: model
  tags:
