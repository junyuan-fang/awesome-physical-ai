  one_liner: 发布 HumanoidToolBench：18 个人形工具使用任务（3 场景×3 执行层级×2 工具集模式）与 3.1k 条仿真/真机 G1 示教；7 个策略仿真、3 个真机评测，移动使用阶段成功率大幅下降。
  summary: 为解决现有基准无法在人形机器人上同时考察“功能性工具选择”与“移动执行”的问题，作者构建 HumanoidToolBench：BallMove/BallRetrieve/IceBreak 三个场景分别要求伸展、钩取与敲击，配
    L0 选择抓取、L1 原地使用、L2 移动使用三级执行，再加 standard/decoy 两种工具集构成 18 个任务，并发布 ToolBook——3,003 条仿真与 91 条真机 Unitree G1 遥操作示教。MuJoCo 仿真评测
    7 个策略、真机评测 3 个策略（L1 BallMove/BallRetrieve），作者报告 FastWAM 与 GR00T N1.7 均在 L2 明显退化，例如 FastWAM 在 BallMove 上由 L1 的 76% 降至 9%，decoy
    工具集进一步压低成功率。该结果提示工具选择与移动执行是当前 VLA 的薄弱环节，但真机仅两个任务、每任务 10 次试验，基准设计维度也缺少消融。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 5
    T: 4
  rationale:
    C: 首个在人形机器人上联合评测功能性工具选择与移动执行的基准，18 任务/55 工具资产/3 个执行层级，填补了现有工具使用基准只做 VQA 或固定底座机械臂的空白
    E: MuJoCo 仿真 18 个任务上评测 7 个策略，真机 Unitree G1 上评测 3 个策略并设 standard/decoy 两种工具集对照，另有 GR00T N1.7 选择准确率探针；但真机仅 2 个任务、每任务 10
      次试验，且缺少对基准各设计维度的消融
    O: 代码 102 个文件、MIT 许可，ToolBook 数据在 HF 以 CC BY-NC 4.0 发布，项目页另链接 HF checkpoints，代码/数据/权重三者齐备且许可清晰
    T: 首尔国立大学 SNU-PI、UMass Amherst 与 Google Research（Szpektor、Caciularu）合作，团队在具身基准与视觉语言方向有可核实积累
