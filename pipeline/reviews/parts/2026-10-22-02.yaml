  summary: 为厘清“同时预测未来世界状态并生成可执行动作”这一在 2025–2026 年快速膨胀的方向，作者给出机器人学视角的 WAM 综述：先把 WAM 与经典世界模型、基于模型的强化学习、动作条件视频生成和反应式 VLA 区分开，再按表示、转移建模范式（联合预测
