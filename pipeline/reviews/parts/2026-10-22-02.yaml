  one_liner: 提出 Latent Interface Training 两阶段训练：先学无图像的空间目标动作先验，再经位姿监督潜接口注入视觉；4 个 VLA/WAM 架构上 LIBERO-Plus 总体提升 3.87–10.70 点。
  summary: 针对机器人基础模型在视觉分布偏移下退化、动作专家把与任务无关的视觉线索当作捷径的问题，作者提出 Latent Interface Training（LIT）：第一阶段冻结骨干，仅以语言、机器人状态与动作块末端 SE(3)
    位姿为条件训练动作专家，得到无图像的空间目标先验；第二阶段用可学习潜 token 汇聚骨干表示并监督其重建该末端位姿，使其成为动作专家唯一的视觉条件通路。作者在 Pi0.5、MolmoAct2、FAST-WAM、ImageWAM 四个架构上与同架构基线（同骨干、同数据、同训练步数）对比后报告：LIBERO
    平均成功率持平或略升（Pi0.5 87.75%→91.80%），LIBERO-Plus 零样本总体提升 3.87–10.70 点（MolmoAct2 63.62%→71.92%）；真机 3 个任务在 ID 与光照/相机/干扰物偏移下聚合成功率提升
    13.3–16.7 点。去掉第一阶段或位姿监督使 OOD 总体分别降 3.69 与 3.06 点。该结果提示约束视觉条件通路可缓解捷径，但评测集中于 LIBERO 系与单一真机架构。
