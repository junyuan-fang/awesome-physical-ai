- arxiv_id: '2609.35432'
  title: 'Self-Evolving Coding Agents: From Digital Programs to Physical-World Intelligence'
  prefilter_score: 21.0
  triage: include
  reason: null
  category: vla
  route: core
  contribution: method
  tags:
  - code-as-policy
  - agent
  - long-horizon
  - robocasa
  - self-evolution
