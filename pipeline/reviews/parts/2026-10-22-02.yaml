  - Beihang University
  - Hong Kong University of Science and Technology
  one_liner: 用 500 小时第一视角人体全身运动数据 HumanVerse-500 做三阶段预训练得到人形全身 VLA λ0；SIMPLE 六任务报告 90.0% 成功率，4 个真机任务平均 62.5%。
  summary: 为缓解人形全身 loco-manipulation 示教依赖昂贵遥操作、而现有第一视角人类视频只给出手腕与手部轨迹、缺少全身协调监督的问题，作者用轻量可穿戴系统采集 HumanVerse-500：500 小时、32,993
    条 episode、827 类任务的第一视角视频与同步全身/手部运动，并经 SONIC 重定向到 Unitree G1。在此基础上提出三阶段 VLA λ0（手部预训练 → 全身中训练 → 真机后训练），在 SIMPLE 六个任务 L0–L2
    上作者报告 90.0% 平均成功率（StarVLA 86.1%、Ψ0 85.6%），4 个真机任务各 10 次试验平均成功率 62.5%、进度 80.4%，高于 π0.5 的 40.0%/54.0%；去掉中训练使真机成功率降 40 个百分点。该结果提示全身人类数据可迁移到人形控制，但仍受单一
    G1 平台、小样本真机与单种子缩放拟合限制。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 2
    T: 4
  rationale:
    C: 提出机器人无关的第一视角全身人类数据采集范式，发布 500 小时/33k episodes 的 HumanVerse-500，并给出可迁移到人形全身控制的三阶段 VLA，资源与方法增量清晰
    E: SIMPLE 六个任务×L0–L2 各 10 次 + 4 个真机搬运任务各 10 次 + 三阶段消融 + 数据缩放曲线 + 未见物体泛化，覆盖面广；但真机总量 40 次、缩放为单次种子拟合，作者亦承认不建立跨种子可复现性
    O: 论文结论称将开源代码、模型与数据，当前既无仓库也无下载链接，按现状只能记承诺
    T: 阿里巴巴联合四川大学、上海创智学院、北航与港科大，团队在人形控制与具身数据方向有可核实积累
  evidence_read:
