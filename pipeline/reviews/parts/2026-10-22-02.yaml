  one_liner: 提出 Physical Coding（Code as World + Code as Policy）与 HexaAnything 智能体；在 RoboCasa365 上把 XR-1 的总体成功率从 56.6% 提到 61.1%。
  summary: 针对 VLA/WAM 把任务条件、进度与失败恢复隐式编码进动作序列、视角或布局稍变即失效的问题，作者提出 Physical Coding：以可执行代码表示世界状态（Code as World）与策略流程（Code as Policy），由
    HexaAnything 在 Observer–Plan–Act–Verify–Recover 循环中调用感知、规划与 VLA/WAM 工具，并把验证过的轨迹沉淀为数据与记忆。在 RoboCasa365 上固定 XR-1、每任务 50
    个种子，作者报告总体成功率由 56.6% 升至 61.1%（Composite-Unseen 34.3%→38.3%），但同一 XR-1 配通用编码智能体 Codex 也达 59.5%，差距仅 1.6 个百分点；Harness 轨迹训练的
    HexaModel v0.1 为 61.7%。PhyBench 三个实验平均相对误差 0.8%–4.8%，AgileX 双臂 7 个桌面任务中 5 个三次全成。该结果提示显式状态与独立验证可改善长程执行，但作者自述证据初步，真机每任务仅
    3 次且对照为跨硬件数字。
  venue: ''
  scores:
    C: 4
    E: 3
    O: 2
    T: 3
  rationale:
    C: 提出把物理任务状态与执行流程显式代码化（Code as World / Code as Policy）并支持 Harness、数据、模型多目标自演化的框架，系统横跨仿真与真机；但机制上仍属 code-as-policy + agent
      harness 的整合，增量以框架层为主
    E: RoboCasa365 每任务 50 种子并设 native XR-1、Codex 同模型与开源 planner 对照，另有案例、工具演化与 PhyBench/真机；但真机每任务仅 3 次、部分对照为跨硬件公开数字、工具演化种子很少，作者自称证据初步
    O: 仅有 8 个文件、0 个代码文件的占位仓库和一个项目博客，无权重、无数据、无许可
    T: HexaFuture 团队，除公司域名外无可核实的公开研究记录，暂按默认 3
