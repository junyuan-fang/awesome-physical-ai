    E: 4
    O: 5
    T: 5
  rationale:
    C: 开放权重的人形通用基础模型与异构数据金字塔训练方案，已成为人形 VLA 的常用起点。
    E: 三套仿真基准 + GR-1 真机 + 数据量与神经轨迹消融，较完整；真机基线较少且限于桌面操作。
    O: Apache-2.0 代码、HF 权重与部分仿真训练数据公开，并给出复现仿真结果的说明。
    T: NVIDIA GEAR 团队在机器人基础模型、仿真与数据生成方向有多项标志性成果。
