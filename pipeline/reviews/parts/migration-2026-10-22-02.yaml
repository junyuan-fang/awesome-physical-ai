    E: 两种真机平台多维泛化评测、对比闭源 RT-2-X 等强基线，含微调、LoRA、量化、设计选择消融与 LIBERO 仿真。
    O: MIT 代码、HF 权重（含 LIBERO 微调版）公开，训练数据为公开的 Open X-Embodiment，复现说明完整。
    T: Stanford、Berkeley、TRI、Google DeepMind 等团队，在机器人学习方向有大量标志性成果。
