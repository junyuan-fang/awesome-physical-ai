- arxiv_id: '2606.04708'
  title: 'VISTA: Vision-Grounded and Physics-Validated Adaptation of UMI data for VLA Training'
  triage: include
  reason: null
  date_v1: '2026-06-03'
  category: teleoperation
  route: adjacent
