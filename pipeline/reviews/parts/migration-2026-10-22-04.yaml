  - Northwestern Polytechnical University
  - Shanghai Jiao Tong University
  - East China University of Science and Technology
  - Harbin Engineering University
  - Lumos Robotics
  - Fudan University
  one_liner: 针对 UMI 数据训练 VLA 的腕部鱼眼视觉失配与人采轨迹物理不可行两大问题，构建 800 万条 UMI-VQA、跨本体物理校验打分流水线与两阶段联合训练；作者报告 20 个真机任务上优于 π0.5 等基线。
  summary: |
    为解决用 UMI 手持夹爪数据训练大规模 VLA 时的两类失配——腕部鱼眼视角对预训练 VLM 属分布外、人工采集轨迹常违反目标机器人运动学或引发自碰撞——作者提出 VISTA：（1）构建约 800 万样本的 UMI-VQA（含约 300 万真实鱼眼帧问答），在联合训练中对齐视觉表征；（2）基于 MuJoCo 与 Mink 的跨本体轨迹回放，对每条轨迹做完整性预检并按连续性、自碰撞风险、执行保真度打分，预训练用宽松阈值、下游微调对目标机器人收紧；（3）先做 VQA 与 FAST 离散动作自回归联合训练，再训练知识隔离的流匹配动作专家。作者先诊断性地报告鱼眼输入使 π0.5、LingBot-VLA 在 LIBERO/RoboTwin 上平均下降 13–16 点、VLM 空间推理平均相对下降 8.6%；高分与低分轨迹子集训练的策略在 RealMan 等三种本体上部署成功率差异明显；在鱼眼版仿真基准和 20 个真机任务上 VISTA 优于 π0.5、LingBot-VLA、Wall-X。该结果提示数据层面的视觉对齐与物理过滤对 UMI→VLA 很关键，但仿真基准为作者改造的鱼眼版本，UMI-VQA 的具体发布形式待核实。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 4
    T: 4
  rationale:
    C: 系统化解决 UMI 数据进入 VLA 训练的视觉与物理两类缺口，并提供大规模鱼眼 VQA 与校验工具，对手持采集数据利用有明确增量。
    E: 诊断实验、得分-部署相关性、跨本体部署、仿真与 20 个真机任务及组件消融，较完整；仿真为改造的鱼眼基准。
    O: Apache-2.0 仓库含训练与物理校验代码，权重与数据经 HF collection 发布；UMI-VQA 与轨迹数据的具体条目未逐一核实。
    T: TeleAI（李学龙、白辰甲）在具身智能与 RL 方向有多项可核实成果。
