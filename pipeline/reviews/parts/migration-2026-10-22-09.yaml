- arxiv_id: '2607.19343'
  title: Masked Visual Actions for Unified World Modeling
  triage: include
  reason: null
  date_v1: '2026-07-21'
  category: world-model
  route: core
  contribution: method
  tags:
  - video-world-model
  - action-representation
  - cross-embodiment
