- arxiv_id: '2607.20033'
  title: Robots Acquire Manipulation Skills in Seconds from a Single Human Video
  triage: include
  reason: null
  date_v1: '2026-07-22'
  category: manipulation
  route: core
  contribution: method
  tags:
  - one-shot-imitation
  - human-video
  - bimanual
  - real-robot
  - skill-retention
  affiliations:
  - Beijing Institute of Technology
  - X Square Robot
  - Tsinghua University
  one_liner: HOST 推理时从单条人类视频获得新操作技能、无需参数更新；作者报告 50 个新任务平均约 29 秒习得、成功率 62%，高于用 50 条示教微调的 Wall-OSS（56%）且不遗忘旧技能。
  summary: |
    为解决机器人学习新技能依赖采集示教加离线微调、成本高且会侵蚀已掌握技能的问题，HOST 将技能获取移到推理时：先把机器人轨迹与人类视频映射到共享的任务进度流形上，把预测目标重新定义为与视频未来进度对齐，再以单个自回归模型级联完成“定位当前进度—预测机器人自身未来观测—由预测观测导出动作”。训练分两阶段：19.3 万条、229 个任务的同本体机器人对用于预训练，5,847 条自采人类视频与机器人轨迹配对用于适配。作者在双 ARX R5 臂平台上报告：50 个新任务每任务 20 次试验，平均成功率 62%，比零样本 Wall-OSS 等基线高 45 个百分点，比同样接收视频的 OSVI 基线高 43 个百分点，超过用 50 条示教 LoRA 微调的最强基线，且旧技能成功率不下降，对光照、物体替换和人为干扰较鲁棒。该结果提示“示范驱动预测”可显著降低新技能获取成本，但“单视频”仅在推理期成立，训练仍需大量同本体数据和人-机配对，且只在单一双臂平台上验证。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 3
    T: 3
  rationale:
    C: 把技能获取从训练循环移到推理期、并以进度流形对齐驱动预测，是单视频模仿方向的明确方法增量。
    E: 50 个真机新任务、OSVI 与 VLA 基线、数据/时间效率、遗忘、扰动鲁棒性与逐级消融较完整，但限于单一平台。
    O: 仓库含实质代码，HF 已放出权重，但未找到许可证文件；训练用人类视频数据未见开放。
    T: 北理工与自变量机器人（X Square）、清华在机器人学习上有一定相关成果。
