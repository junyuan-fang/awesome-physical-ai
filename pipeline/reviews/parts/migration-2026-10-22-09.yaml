    E: 有 WorldRoamBench 对比、系统级消融与 LongForcing 对照，但长程效果多为定性展示，无具身下游任务。
    O: 仓库含实质代码（Apache-2.0），HF 已放出 5B 权重与两个数据子集；README 仍有部分 coming soon。
