- arxiv_id: '2606.16533'
  title: 'Kairos: A Regret-Aware Native World-Action Model Stack for Physical AI'
  triage: include
  reason: null
  date_v1: '2026-06-15'
  category: world-model
  route: core
  contribution: model
  tags:
  - world-action-model
  - linear-attention
  - data-curriculum
  - efficient-inference
  - cross-embodiment
  affiliations: []
  one_liner: 4B 原生世界-动作模型栈，以“控制充分状态”为目标，结合跨本体数据课程、混合线性时序注意力与部署协同设计；作者报告在多项具身世界模型与世界-动作基准上领先并具效率优势。
  summary: |
    为解决现有世界模型或侧重像素生成、或缺乏可部署长时状态、难以直接服务具身控制的问题，Kairos 主张世界模型只需学习并维持“控制充分状态”（物体状态、空间关系、接触、任务进度、动作后果、失败风险、部署不确定性）。方法包括：按干预强度组织的跨本体数据课程（开放世界视频→人类行为数据→AgiBotWorld-Beta、DROID 等机器人数据），统一理解/生成/预测的架构与局部-中程-全局三路混合线性时序注意力（LinearDiT），基于执行结果偏好的“遗憾感知”世界-动作对齐训练，以及针对时延与显存的部署协同设计。作者报告在 WorldModelBench 机器人集、PAI-Bench 等具身世界模型基准和世界-动作基准上取得领先或有竞争力的结果，并在 DiT 单步推理时间上随序列长度线性扩展。该结果提示面向控制的状态压缩与线性注意力可兼顾能力与效率，但作者明确各项评测只是“遗憾相关能力”的代理证据，真实闭环遗憾降低与真机自进化留待后续工作。
  venue: ''
  scores:
    C: 4
    E: 3
    O: 4
    T: 3
  rationale:
    C: 完整的世界-动作模型栈并开放 4B 权重，混合线性时序注意力与数据课程对 WAM 方向有参考价值。
    E: 覆盖多项世界模型、世界-动作与效率评测，但作者承认均为代理证据，缓存中未见真机闭环实验。
    O: 实质代码（Apache-2.0）与多份 HF 权重（含 RoboTwin 2.0、LIBERO-Plus 微调版）已开放，训练数据未开放。
    T: 署名为 Kairos Team（含陶大程、王晓刚等），HTML 未列单位，按默认 3 分。
