    O: 2
    T: 3
  rationale:
    C: 将 Cosmos Policy 式潜画布思路迁移到图像目标导航，问题设定清楚但方法增量中等。
    E: 两个离线数据集、规划与直接策略基线、监督目标消融加小规模真机闭环，样本量有限。
