- arxiv_id: '2606.13769'
  title: '$\mu_0$: A Scalable 3D Interaction-Trace World Model'
  triage: include
  reason: null
  date_v1: '2026-06-11'
  category: world-model
  route: core
  contribution: model
  tags:
  - 3d-trace
  - world-model
  - action-free-pretraining
  - cross-embodiment
  affiliations:
