  rationale:
    C: 把触觉作为世界-动作模型的联合预测目标并做大规模预训练，对触觉操作子方向有明确增量。
    E: 公开基准 UniVTAC、自建 NeoSim 与 8 项真机任务加消融，基线覆盖 VLA 与 WAM；但部分基准自建、真机试次有限。
