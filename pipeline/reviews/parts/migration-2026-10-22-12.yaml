    T: 4
  rationale:
    C: 学习式规划加优化监督与兜底的组合属于已有思路的工程整合，主要价值在实车集成细节。
    E: 只有自有数据上的开环指标与试验场定性演示，缺少基线对比与闭环定量评测。
