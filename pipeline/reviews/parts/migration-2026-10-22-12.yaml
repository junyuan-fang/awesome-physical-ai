- arxiv_id: '2512.09406'
  title: 'H2R-Grounder: A Paired-Data-Free Paradigm for Translating Human Interaction Videos into Physically Grounded Robot
    Videos'
  triage: include
  reason: null
  date_v1: '2025-12-10'
  category: manipulation
