- arxiv_id: '2606.31734'
  title: 'MemLearner: Learning to Query Context memory for Video World Models'
  triage: include
  reason: null
  date_v1: '2026-06-30'
  category: world-model
  route: adjacent
  contribution: method
  tags:
  - video-world-model
  - memory
  - long-video
  - camera-control
  affiliations:
  - The University of Hong Kong
  - Fudan University
  - Zhejiang University
  - Kuaishou Technology
  one_liner: 用视频生成模型自身的 query token 自适应检索历史上下文作为视频世界模型记忆；作者报告在含遮挡与动态物体的自建数据上 PSNR/LPIPS/FVD 均优于 CaM、VMem 等基线。
  summary: |
    为解决视频世界模型长时生成中因上下文窗口有限导致场景不一致、且基于视场重叠或点云的规则式检索难以处理遮挡和动态物体的问题，作者提出 MemLearner：引入与预测帧等长的 query token，作为上下文 token 与预测 token 之间的信息桥，并直接复用视频 DiT 自身的浅层（5 层）完成查询，避免从零训练独立模块，同时裁剪不必要的注意力计算。作者用 Unreal Engine 采集带精确相机位姿、遮挡与动态物体的长视频，并为不同位姿质量的数据分配独立相机编码器进行混合训练。在内部 1B 文生视频模型上、所有基线用同一代码库与数据复现的条件下，作者报告自建数据的 GT 对比与回访对比中 PSNR、LPIPS、FID、FVD 均优于 DFoT、FramePack、VMem、Context-as-Memory；在无遮挡的 CaM 数据上与 CaM 接近，并补充 Wan2.1、SpatialVID 结果与用户研究。该工作面向相机控制的场景生成，未涉及机器人动作条件或下游决策，代码与数据未公开。
  venue: ECCV 2026
  scores:
    C: 3
    E: 3
    O: 2
    T: 4
  rationale:
