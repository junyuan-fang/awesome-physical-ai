  summary: 为在实时控制约束下让世界-动作模型真正用上足够长的视觉历史，作者提出 Long-WAM：先在约 10,000 窗口等效小时的机器人/第一视角视频上做自回归视频预训练（LongLive2.0-Robot），再以因果到因果方式适配动作头，并用异步执行、流式
