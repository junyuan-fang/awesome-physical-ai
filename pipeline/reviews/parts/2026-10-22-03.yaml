  one_liner: 三阶段训练的人形全身接箱框架：仿真第一视角 RGB-D 抓接成功率 85.7%，Unitree G1 真机 2.5 m/5 m 处达 65%/40%。
  summary: 为解决人形机器人对快速运动物体的视觉反应式全身控制问题——全身协调、约 1 秒内预测物体动力学、第一视角感知三者耦合——作者提出 Reflex 三阶段框架：先用 PPO 与人体动作先验在特权状态上学全身接箱；再让策略从延迟
    20–60 ms、不完整的箱体观测推断 8 维动力学潜变量；最后固定控制器，用第一视角 RGB-D 与自运动历史回归该潜变量。仿真中作者报告纯视觉抓接成功率 85.7%，接近特权状态的 87.9%，去掉时序历史在居中/侧偏投掷上分别下降
    35.6 与 39.8 个百分点；Unitree G1 真机在 2.5 m 与 5 m 处接住人类投掷纸箱的成功率为 65% 与 40%，相当于人类接球者的 76% 与 59%。该结果提示分阶段训练可把视觉学习与全身控制解耦，但仍限于单一接箱任务与单一机型，真机每条件仅
    20 次试验。
