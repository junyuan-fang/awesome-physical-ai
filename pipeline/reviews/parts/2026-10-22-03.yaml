  rationale:
    C: 首个把表征、动作条件潜动力学与随机策略在单一 JEPA 目标下联合训练的模型，相对 LeWM/DINO-WM 有清晰方法增量
    E: 10 个仿真导航/操作环境、4 个基线、3 seeds×50 episodes，加 SIGReg/编码器/动作头消融与线性探针，另有 3 个真机任务各 30 次试验；但单任务单本体、无跨物体泛化测试
    O: MIT 仓库含 182 个文件/90 个代码文件，HF 上公开 5 个任务 checkpoint 与对应数据集，可直接复现
