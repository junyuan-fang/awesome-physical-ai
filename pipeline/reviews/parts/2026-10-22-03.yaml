  one_liner: 首个端到端 JEPA：联合潜状态预测与动作 flow matching，在 10 个仿真任务上把接触密集/长程任务的规划成功率做到 89.7%/46.2%，规划快 32.3 倍。
  summary: 为缓解 JEPA 世界模型需先单独训练表征与动力学、再接策略或 CEM 求解器的问题，作者提出 LeWAM：用 Mixture-of-Transformers 让干净动作支路预测下一潜状态、加噪动作支路做 flow matching，并用
    SIGReg 约束潜状态，使同一模型既能直接输出动作块，也能用学到的潜动力学做梯度式规划。在 10 个仿真导航/操作任务（3 seeds×50 episodes）上，作者报告其视觉规划成功率高过 LeWM(CEM)、LeWM(IDM)、DINO-WM
    与 GCBC，接触密集与长程任务分别从 28.6%/10.9% 升至 89.7%/46.2%，单次规划约为 CEM 的 1/32；在三个真机任务各 30 次试验中与 Diffusion Policy 相当。该结果提示动作监督可作为防崩塌信号，但仍受单任务单本体、数据规模有限、未验证跨物体泛化的限制。
  venue: ''
  scores:
