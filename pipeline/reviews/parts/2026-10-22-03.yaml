  summary: 为探究 VLM 编码 agent 直接控制机器人能走多远，作者提出 HexaShell：薄 harness 只把 robo 命令转成关节运动而不做决策，acting agent 执行 episode，失败后 optimizer
    agent（同为 Codex/GPT-6-Astra）读完整记录，诊断并修复带测试的工具，能力以代码沉淀，无需演示或额外训练。工具仅用 RGB、相机标定与机械臂状态，靠多视角三角化与已知平面测深获得厘米级位置。在 RoboDojo 官方隐藏
    seed 评测（42 任务×50 episode）中，作者报告 46.9% 成功率与 53.2 progress，居官方榜首；Memory 任务 81.0%、Precision 仅 32.0%，三角化比 Depth Anything V2
    高 8.7 分。该结果提示瓶颈在接触精度，但 harness 未开源、真机仅两段定性演示。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 3
    T: 3
  rationale:
    C: 把编码 agent 的「写工具—测—保留」闭环搬到真机操作，harness 刻意做薄、工具跨任务复用，是新的系统范式而非又一个策略
    E: RoboDojo 官方隐藏 seed、42 任务×50 episode 的第三方评测并居榜首，另有三角化 vs 深度网络、干净 vs 杂乱、失败模式分析与两段真机演示
    O: 仓库公开演化后的工具、任务配置与结果，但 README 明确 harness、executor、agent 容器与演化循环未包含，属部分开放
