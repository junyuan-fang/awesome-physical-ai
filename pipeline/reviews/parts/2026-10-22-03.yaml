- arxiv_id: '2610.25736'
  title: 'Learning from Fleet Experience: Collective Experience Learning Across 96 Robots'
  prefilter_score: 18.0
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: method
  tags:
  - fleet-learning
  - real-world-rl
  - vla
  - imitation-learning
  - deployment
  affiliations:
  - Tsinghua University
  - AgiBot
  - Infinigence AI
  one_liner: 用机队部署经验替代专家纠正：FERT 从成功轨迹检索与失败相关的片段，96 台真机 5 个任务达 93.3–99.2% 成功率。
  summary: 为减少策略持续改进对专家纠正动作的依赖，作者提出 Collective Experience Learning：机器人在部署中汇集自身执行经验更新共享策略，并以 FERT 实现——用失败片段的上下文从成功轨迹中检索相关片段、提高其采样优先级，只用机器人自主动作做监督，人工仅提供二元
    episode 结果与环境重置；配套容错异步系统 FATS 协调 96 台机器人、云端推理与训练。在 AgiBot G2 的 5 个真机任务上，作者报告 FERT 在未参与采集的机器人上每任务 120 次试验的成功率为 93.3–99.2%，均值由
    (M)HG-DAgger 的 81.0% 升至 97.3%，手机包装从 79.2% 升至 98.3%。该结果提示部署经验可替代部分专家监督，但仍依赖任务特定的专家初始化与人工结果标注，未验证跨任务/跨本体迁移。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 2
    T: 4
  rationale:
    C: 提出「从机队部署经验学习」的新范式，把动作监督来源从专家纠正换成机器人自身执行，并以 FERT + FATS 在 96 台真机上落地，规模在同类工作中罕见
    E: 5 个真机任务、未参与采集的机器人上每任务 120 次试验，对照 (M)HG-DAgger/RECAP/RLT，含检索/同步频率/片段扩展/优先级消融与 96 台 9,834 episode 的系统运行分析；但单本体、无仿真与跨任务迁移
    O: 项目页只指向通用 RLinf 框架，未在其中找到 CEL/FERT 实现，也未发布权重或机队数据，当前开放度低
    T: 清华 + AgiBot + Infinigence AI，作者含 Bo Dai 等，机器人学习与大规模训练系统产出可核实
