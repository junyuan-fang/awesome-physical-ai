    O: 2
    T: 4
  rationale:
    C: 把操作、导航、轨迹预测统一到一个 VLA 并给出完整分阶段训练配方，属基础模型级工作，但架构组件多为已有技术组合。
    E: 覆盖 6+ 个仿真基准、真机 ALOHA、OOD 测试与多项消融；基线数字多引自原文，真机平台单一。
