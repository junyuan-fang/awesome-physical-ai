- arxiv_id: '2605.26820'
  title: Can VLA Models Learn from Real-World Data Continually without Forgetting?
  triage: include
  reason: null
  date_v1: '2026-05-26'
  category: vla
  route: adjacent
  contribution: benchmark
  tags:
  - continual-learning
  - experience-replay
  - catastrophic-forgetting
  - real-world
  - bimanual
  affiliations:
