- arxiv_id: '2610.26625'
  title: 'EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience'
  prefilter_score: 18.0
  triage: include
  reason: null
  category: foundation-general
  route: core
  contribution: model
  tags:
  - egocentric
  - 3d-reconstruction
  - hand-object
  - dataset
  - benchmark
  affiliations:
  - Ropedia
  - Nanyang Technological University
  - Tsinghua University
  - Peking University
  one_liner: EgoXperience 构建 50 小时自我中心数据 EgoX-Data-6M 与基准 EgoX-Bench，EgoX 单次前向联合重建相机、深度、双手与物体 6DoF；作者报告 EgoX-Bench 手部误差降至
    113.24 mm。
  summary: 为解决自我中心视频中相机、场景几何与手–物交互通常分开重建、尺度与坐标系不一致的问题，作者提出全栈方案 EgoXperience：EgoX-Engine 用立体深度与 SLAM 把手部 MANO、物体轨迹和场景对齐到同一度量世界坐标，据此标注
    50 小时的 EgoX-Data-6M（101 个物体、270 个任务脚本），并留出 1 小时作为 EgoX-Bench；EgoX 在 VGGT 式骨干上加手、物体与尺度 token，单次前向预测位姿、深度、双手与物体 6DoF。在 HOT3D、EgoX-Bench、HOI4D、H2O
    上作者报告世界坐标手部 W-MPJPE 均最低（EgoX-Bench 由 WiLoR+SLAM 的 328.81 mm 降至 113.24 mm）、深度 AbsRel 最优，但相机 nATE 在 HOT3D 与 EgoX-Bench 不及
    VGGT-，且仅支持刚性物体、无真机验证。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 2
    T: 4
  rationale:
    C: 把自动标注引擎、50 小时联合标注数据、评测基准与单次前向联合重建模型打包成全栈方案，相对 HaWoR/ReViV 等只恢复子集的工作有清晰增量
    E: 在 HOT3D、EgoX-Bench、HOI4D、H2O 四个基准上与手部、物体、几何三类基线对比，并给出 ScaleHead/DepthHead 消融与效率表，但无真机或下游任务验证，且部分相机指标不及 VGGT-
    O: 代码仓库仅 5 个文件且 README 称即将发布，HF 模型页与 EgoX-Data-6M/EgoX-Bench 数据集页均为空占位，均无许可证
    T: Ropedia 与 NTU S-Lab（Ziwei Liu、Fangzhou Hong 等）在自我中心视觉与 3D 人体/场景重建方向有可核实积累
