- arxiv_id: '2609.14973'
  title: 'PhysBrain 1.5: From Vision-Language Models to Physical Foundation Models'
  prefilter_score: 17.5
  triage: include
  reason: null
  category: foundation-general
  route: core
  contribution: model
  tags:
  - physical-foundation-model
  - vla
  - autoregressive
  - human-video-pretraining
  - embodied-understanding
  affiliations:
  - DeepCybo
  one_liner: PhysBrain 1.5 在 Qwen3-VL 上把语言、末端轨迹与未来 RGB/深度/机器人掩码统一为离散 token 联合自回归训练，8B 模型在 28 个具身理解基准上平均 72.5，为开源最高。
  summary: 为把具身理解、动作生成与未来状态预测纳入同一学习框架，作者以 Qwen3-VL-Instruct 8B 为底座扩展动作与视觉词表：末端轨迹经 ActionPiece 编码为 16 步相对动作 token，未来 RGB、深度与机器人掩码共享一个
    VQ-VAE，三者与语言共用同一自回归目标；预训练用约 3 万小时人类交互视频（含 Ego4D、EgoDex、EgoVerse、Ego-Exo4D 等）生成感知、动作与未来状态监督，再用人类/真机/仿真混合数据 SFT。作者报告 28
    个具身理解基准平均 72.5、为开源最高，与闭源 Gemini 3.6 Flash（73.0）和 GPT-6-Astra（73.3）接近，12 个通用多模态基准大体保持；但动作与未来预测仅有定性图示，无真机成功率与消融，评测多为 VLM
    式问答而非闭环执行。
  venue: ''
  scores:
    C: 4
    E: 3
    O: 3
    T: 3
  rationale:
    C: 在 Qwen3-VL 上把语言理解、动作 token 与未来视觉 token 统一进一个自回归模型并用约 3 万小时人类视频预训练，是明确的模型与资源增量，但组件多为已有做法（ActionPiece、VQ-VAE、UniVLA/RynnVLA
      式统一）的组合
    E: 28 个具身理解基准 + 12 个通用多模态基准、与十余个开源/闭源模型对比，范围广且对照合理，但动作与未来状态预测只有定性图示，无真机成功率、无消融
    O: 8B/2B 权重已在 HF 以 safetensors 提供，含 28 个基准评测脚本的 EvalKit 已开源，但主仓库仅 README 与技术报告，训练代码与训练数据未开放且无许可证
    T: DeepCybo 为新兴团队，除本系列（1.5 版本）外无可核实的具身方向标志性成果，信息不足按默认给 3
