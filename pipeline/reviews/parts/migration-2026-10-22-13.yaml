- arxiv_id: '2608.16837'
  title: 'HAF: Adapting Generalist VLAs to Humanoid Whole-Body Loco-manipulation via Hierarchical Action Flow and Spectral
    Latent RL'
  triage: include
  reason: null
  date_v1: '2026-08-17'
  category: vla
  route: core
  contribution: method
  tags:
  - humanoid
  - loco-manipulation
  - flow-matching
  - latent-noise-rl
  - real-world-rl
  affiliations:
  - Peking University
  - Beijing Innovation Center of Humanoid Robotics
  - Nankai University
  one_liner: HAF 将通用流匹配 VLA 改为"行走/头部→腰部→双臂"三阶段分层去噪，并在冻结骨干上做 DCT 低维噪声空间离线到在线 SAC；作者报告 7 项真机人形任务平均分 70.5%，高于最强基线 53.3%。
  summary: |
    通用 VLA 单阶段生成全身动作，难以协调人形机器人的行走、腰部姿态与双臂操作，而直接用在线 RL 微调大骨干又昂贵且危险。HAF 包含两部分：HAF-VLA 基于预训练流匹配 VLA（π0.5），按运动学依赖依次生成行走与头部、腰部、双臂动作，用阶段嵌入和跨阶段 KV cache 传递前一阶段的干净动作；HAF-Steer 利用流匹配可逆性把示教动作反推为初始噪声，经 DCT 压缩到低维谱空间，先行为克隆再做离线-在线混合 SAC，骨干保持冻结。在天工 2.0/3.0 人形机器人 7 项长程家务任务（每项 10 次）上，作者报告 HAF-VLA 平均归一化得分 70.5%，最强基线为 53.3%，对比 GR00T N1.7、Cosmos Policy、ACT；消融显示增益并非来自更多去噪步数；HAF-Steer 在分布内外设置下均提升成功次数，而 DSRL 出现不安全探索。但每项仅 10 次试验，任务与数据为自采，代码未见公开。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 2
