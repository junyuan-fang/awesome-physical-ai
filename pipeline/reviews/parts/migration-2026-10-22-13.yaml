- arxiv_id: '2608.16172'
  title: 'SparkVLA: Stop-Aware Hierarchical VLA with Adaptive Action Chunking for Long-Horizon Manipulation'
  triage: include
  reason: null
  date_v1: '2026-08-17'
  category: vla
  route: core
  contribution: method
  tags:
  - hierarchical-vla
  - adaptive-action-chunking
  - long-horizon
  - subtask-termination
  affiliations:
