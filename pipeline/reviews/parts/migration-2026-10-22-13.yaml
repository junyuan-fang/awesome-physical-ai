- arxiv_id: '2608.16590'
  title: 'Zetta $\zeta$: An Efficient Closed-Loop Embodied Harness for Self-Evolving Physical Intelligence'
  triage: include
  reason: null
  date_v1: '2026-08-17'
  category: vla
  route: core
  contribution: system
  tags:
  - embodied-agent
  - self-evolution
  - runtime-critic
  - rollout-infrastructure
  - failure-recovery
  affiliations:
  - Institute for AI Industry Research (AIR), Tsinghua University
  - Z-Trans AI
  one_liner: Zetta 为冻结的 VLA 演化代码化运行时 critic 与恢复技能，形成闭环具身 harness；作者报告在 LIBERO-Pro 与 RoboCasa 留出种子上分别达 90.8% 与 93.6%，并配套 Z-Infra 提升 rollout 吞吐。
  summary: |
    现有具身智能体 harness 多在回合结束后做事后反思，无法在执行中随状态变化干预。Zetta 在保持基础策略（π0.5 / GR00T N1.5）权重冻结的前提下，通过三个时间尺度的循环：动作频率的代码化 critic 监控、基于失败聚类与分层因果诊断的 critic-恢复提案、以及经验证门控的技能合并，在线演化监控与恢复技能；Z-Infra 则把智能体逻辑与异构仿真/推理资源解耦以支撑大规模并行 rollout。作者报告在 RoboCasa 18 项原子任务上宏平均成功率从冻结策略的 73.56% 经四轮修复提升到 93.56%，LIBERO-Pro 上达 90.8%（均为与开发集不相交的留出种子），部分技能可零样本迁移到同类任务，Z-Infra 吞吐较基线高 7.7–12.8 倍。结果提示 harness 层自演化可补足冻结 VLA 的执行鲁棒性，但实验仅在仿真中、依赖人工设计的 critic 框架与 LLM 智能体，真实机器人上的有效性和演化成本尚待验证。
  venue: ''
  scores:
    C: 4
    E: 3
    O: 2
    T: 3
  rationale:
    C: 将运行时 critic 与恢复技能的在线演化引入冻结 VLA 的执行闭环，并配套 rollout 基础设施，是有影响潜力的系统性方案。
    E: 两个仿真基准、留出种子评测、迁移与扩展曲线，但无真机实验，且与其他 agent harness 的对照有限。
    O: 仅有项目页 air-embodied-brain.github.io/zetta，未见代码仓库。
    T: 清华 AIR 刘云新、曹婷团队以系统方向见长，具身方向积累可核实信息有限。
