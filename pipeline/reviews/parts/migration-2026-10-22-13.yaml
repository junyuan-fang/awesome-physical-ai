- arxiv_id: '2608.16503'
  title: 'NebulaVLA: A Dual-Frequency Vision-Language-Action Model With Guide Action for Robotic Manipulation'
  triage: include
  reason: null
  date_v1: '2026-08-17'
  category: vla
  route: core
  contribution: model
  tags:
  - dual-system
  - asynchronous-inference
