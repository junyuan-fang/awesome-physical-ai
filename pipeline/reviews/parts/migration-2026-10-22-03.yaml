    T: 3
  rationale:
    C: 将置信度 3DGS、动态场景图更新与按需网格生成组合为面向人形的闭环系统，问题定义清晰但多为已有模块的系统集成。
    E: 真机 G1 上针对三个问题分别设置基线与消融，但仅单一办公室环境、试验次数有限。
