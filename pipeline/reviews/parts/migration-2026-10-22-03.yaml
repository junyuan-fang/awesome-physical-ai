- arxiv_id: '2605.29438'
  title: 'ElegantVLA: Learning When to Think for Efficient Vision-Language-Action Models'
  triage: include
  reason: null
  date_v1: '2026-05-28'
  category: vla
  route: adjacent
  contribution: method
  tags:
  - inference-acceleration
  - adaptive-compute
