  one_liner: Gaze2Act 把第一视角注视映射到机器人视角，以视觉提示和动作头条件注入 GR00T N1.5；作者报告 G1 上 15 个任务平均成功率 83.5%，高于 RoboGround 39.6%、ControlVLA 41.5%。
  summary: |-
