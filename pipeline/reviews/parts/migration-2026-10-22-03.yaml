- arxiv_id: '2605.30226'
  title: 'BORA: Bridging Offline Reinforcement Learning and Online Residual Adaptation for Real-World Dexterous VLA Models'
  triage: include
  reason: null
  date_v1: '2026-05-28'
  category: vla
  route: core
  contribution: method
  tags:
  - offline-to-online-rl
  - residual-policy
  - dexterous-manipulation
  - human-in-the-loop
  - real-world-rl
  affiliations:
  - Shanghai Jiao Tong University
  - Shanghai AI Laboratory
  - USTC
  - Duke University
  - CASIA
  one_liner: BORA 在一致性策略 VLA 中集成动作条件 critic，离线训练后冻结基座、在线只学轻量残差 actor，并用局部策略辅助灵巧手人工纠正；作者报告 6 个真实灵巧任务每任务 20 条在线轨迹后成功率 60.8%→82.5%。
  summary: |-
    为解决灵巧手 VLA 在真机上难以由人纠正、在线交互昂贵的问题，作者提出离线到在线 RL 系统 BORA：离线阶段在一致性策略 VLA 中加入与 VLM cognition token 共享表征的动作条件 critic（Q 回归 + IQL 式期望回归 V，PPO 式裁剪目标改进策略）；在线阶段冻结 VLA，仅用 RLPD 式 1:1 离线/在线混合数据训练 MLP 残差 actor；人工纠正方面结合可穿戴臂-手遥操作，对拧瓶盖等接触密集动作用基于 15 条人类示范的局部策略把粗略意图转为具身相关的手指动作。在 Franka–DexHand021 五个任务与 ROKAE–Linker L20 双臂拧盖任务（每任务 20 次）上，作者报告 BORA-Full 99/120（82.5%），高于 BORA-Offline 73/120、VITRA 60/120、CP Base 57/120 和解耦 critic 消融 47/120；未见物体上平均 52%→70%。结果提示 VLA 内嵌 critic 与冻结基座残差学习是实用的真机适配路径，但作者也指出在线收益是在线数据与残差更新的合并效应，无触觉反馈，两平台执行不同任务、未验证单策略跨本体。
  venue: ''
  scores:
    C: 3
    E: 4
    O: 1
    T: 4
  rationale:
    C: 把 VLA 对齐 critic、冻结基座残差 RL 与辅助式灵巧遥操作整合成真机系统，各部分有先例，整体增量明确但有限。
