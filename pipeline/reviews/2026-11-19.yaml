  - Beijing Institute of Technology
  - National University of Singapore
  - The Hong Kong Polytechnic University
  - Sun Yat-sen University
  - Zhejiang University
  one_liner: TCP4D 从单目视频恢复末端位姿并生成动作，作者报告在 RoboTwin 2.0 的 48 项任务上，同分布成功率为 69.19%，环境随机化后为 10.94%。
  summary: |-
    许多操作视频保留了机器人如何移动的画面，却缺少能直接用于训练的动作标签。TCP4D 以工具中心点作为不同机械臂共享的动作表示，从首帧给定的二维位置出发，联合恢复场景几何、末端六自由度位姿和夹爪开合状态。生成器沿恢复的轨迹读取局部特征，结合语言和本体观测预测下一段动作；同一条轨迹还可通过逆运动学转到另一机械臂，用于合成示范。作者在 DROID 和 RoboLab 上分别报告 7.60 和 16.07 毫米的绝对轨迹误差。在 RoboTwin 2.0 的 48 项任务上，每项用 50 条干净示范训练，同分布测试平均成功率为 69.19%，测试环境随机化后降至 10.94%。在 CoBoT Magic 上，用相同示范微调后，放笔和叠碗各测 30 次，成功率分别为 83.33% 和 73.33%，均高于 ACT 和 DP3。跨构型复用显示了视频标注的价值，场景外观变化仍是明显短板。
  venue: ''
  scores:
    C: 4
    E: 5
    O: 5
    T: 3
  rationale:
    C: 在同一四维场景表示中连接末端轨迹恢复、动作生成和跨机械臂示范合成。
    E: 覆盖独立采集的真实视频、48 项仿真任务、跨构型训练对照和两项有同协议基线的实机试验。
    O: 官方仓库提供训练与推理入口、两阶段权重、训练数据和评测分集，代码及模型采用 CC-BY-4.0。
    T: 已核对论文署名和本项目交付，尚缺作者团队此前在跨构型轨迹学习上的独立成果核验。
