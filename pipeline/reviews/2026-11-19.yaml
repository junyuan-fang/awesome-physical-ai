  title: 'VSpark: Speculative Decoding for Autoregressive Vision-Language-Action Models'
  prefilter_score: 10.0
  triage: include
  reason: null
  category: vla
  route: core
  contribution: method
  tags:
  - speculative-decoding
  - action-tokens
  - inference-efficiency
