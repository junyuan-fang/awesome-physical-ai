  title: 'ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models'
  prefilter_score: 16.6
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: system
  tags:
  - force-feedback
  - contact-rich
  - frozen-models
  - real-robot
  affiliations:
  - Show Lab, National University of Singapore
  one_liner: ForceHarness 把接触力转成可调用的技能和物理量，作者报告冻结模型在 FR3 六项实机任务中由 2/60 次成功升至 54/60 次。
  summary: |-
    仅凭图像很难分辨外观相同的瓶子孰轻孰重，而等待云端模型决定下一步也赶不上插接时的接触变化。ForceHarness 让机器人在本地调节力，并在接触事件发生时结束技能。上层模型收到带不确定度的质量、刚度或插入位移，再决定是否需要重试。作者在没有腕部力传感器的 Franka FR3 上由关节力矩估力，每种设置测试六项任务、每项十次。同一个冻结的 GPT-6 Astra 使用该接口成功 54/60 次，移除力工具和读数后为 2/60 次。在 HiddenPhys 七项任务的相同测试种子上，作者报告该模型成功 135/140 次，手写专家为 136/140 次。消融显示，仅报告接触事件就有助于完成插接，而判断负载还需要可比较的物理量。真机多数任务的指令带有操作提示，HiddenPhys 也提供带噪物体位姿，结果对开放场景感知的覆盖仍有限。
  venue: ''
  scores:
    C: 4
    E: 5
    O: 4
    T: 4
  rationale:
    C: 把快速接触控制与可供冻结模型推理的力反馈接在一起，并给出可单独评测这两部分的基准。
    E: 有六项真机任务、两个仿真基准、同模型无力对照，以及反馈格式和决策循环消融。
    O: MIT 仓库提供力控原语、实机后端和复现实验入口，公开了专家示范，端到端实验依赖外部模型服务。
    T: 同一署名实验室先前发表过机器人策略 ActionMap 和人机视频转换工作 H2R-Grounder，有相关研究积累。
