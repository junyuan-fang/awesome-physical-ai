- arxiv_id: '2611.23143'
  title: 'TCP4D: A Unified Tool-Center-Point Tracking and Generation Model for Robot Manipulation'
  prefilter_score: 15.6
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: model
  tags:
  - tcp-tracking
