  title: 'InteractVLA: Turning VLAs into Interactive Tools for Agentic Robotic Manipulation'
  prefilter_score: 14.0
  triage: include
  reason: null
  category: vla
  route: core
  contribution: method
  tags:
  - geometric-guidance
  - flow-matching
  - test-time-guidance
  - real-robot
  affiliations:
  - Key Laboratory of Data Engineering and Knowledge Engineering, MOE, China
  - Renmin University of China, Beijing 100872, China
  - Meituan, Beijing 100102, China
  one_liner: InteractVLA 让智能体指定接触位姿并检查动作轨迹，作者报告在 LIBERO-Plus 在线操作中，成功率由纯语言调用的 93.1% 升至 98.3%。
  summary: |-
    机器人抓取偏离目标时，上层智能体若只能重新下达语言指令，底层策略可能反复做出相同动作。InteractVLA 让智能体指定末端位置、朝向和夹爪状态，经由可微的动作到位姿映射引导流模型去噪。系统根据候选轨迹估计最合适的到达时刻，并把动作段投影回相机画面，供智能体区分目标位置错误和抓取过早，进而修改后续动作。作者报告，在 LIBERO-Plus 的在线实验中，语言调用基线成功率为 93.1%，加入双向几何接口后为 98.3%；另在独立练习场景中积累策略后才达到 99.4%。在 Dexmal 平台上，四项任务各用 50 条示范训练同一骨干，每种方法各测 30 次；倒水任务平均得分由 38.5 升至 79.2。软时间对齐和轨迹回投均有消融支持，但移植到新平台仍需相机标定、动作映射和兼容的策略权重。
  venue: ''
  scores:
    C: 4
    E: 5
    O: 3
    T: 3
  rationale:
    C: 让上层智能体以几何目标干预已有 VLA 的生成过程，并能依据回投轨迹诊断和局部修订动作。
    E: 三个仿真基准、四项有匹配基线的实体任务及目标时间和反馈形式消融，分别评价成功、任务得分与调用开销。
    O: 官方实现含 PyTorch/JAX 引导、动作反馈和平台配置；需自备上游模型及部署参数，未核实本文代码的统一许可。
    T: 已核对作者与三个署名单位，尚未核对该合作团队此前直接相关的机器人策略成果。
