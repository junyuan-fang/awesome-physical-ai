  one_liner: A³-VLA用操作轨迹产生伪区域监督；作者在VLABench五类任务上报告不同VLA骨干成功率提升16.4至25.2个百分点。
  summary: |
    为减少VLA微调中语言、视觉与机器人状态的错位，A³-VLA从示范中的交互时刻生成目标物体及机器人候选区域，再用SAM2细化和传播。
    训练时对语言或状态查询视觉的注意力施加软下界，并用区域—语言对比目标拉近目标、排斥背景；推理仍只运行微调后的VLA。
    作者在VLABench五类任务各50次测试、RoboTwin四项任务各100次测试及五项真机厨房任务中比较多个骨干，报告VLABench平均成功率提升16.4至25.2个百分点，RoboTwin子集提升6.5至9.8个百分点。
    损失消融、纹理变化和图像噪声测试支持感知监督的贡献。
    结果表明示范自带的交互信息有助于细粒度目标辨别，但这不是完整VLABench或RoboTwin排行榜成绩；区域提议仍依赖接触启发式及分割质量，难以保证覆盖无明显交互信号的任务。
    官方实现与权重尚未核实公开。
