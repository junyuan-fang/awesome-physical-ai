  one_liner: LMGN联合学习末段导航和抓取；作者报告Habitat下GraspSR为74.8%，GAMMA为64.5%。
  summary: |
    为解决四足机械臂抵达目标附近后仍站位不当、接近方向不适合抓取的问题，LMGN把候选六维抓取姿态转换成距离与方向可达性特征，用分层混合专家区分底座调整、预抓取及抬升阶段，并联合优化PPO任务奖励、专家路由对齐与动作一致性。
    作者在搭载Z1机械臂的Unitree B1仿真中进行对照；Habitat匹配设置下，GraspSR为74.8%，GAMMA为64.5%，GazeSR分别为73.9%和66.3%。
    Isaac Gym六类物体消融中完整模型平均GraspSR为53.86%，去掉联合优化降至2.79%；三个未见对象的平均抓取成功率为48.52%。
    这些结果支持局部可达性和阶段分工，但Habitat使用高层运动接口、Isaac Gym涉及底层全身控制，两套数字不能直接合并。
    评测仅限有限几何物体和仿真环境，尚无真机接触、感知误差及开放场景泛化验证。
