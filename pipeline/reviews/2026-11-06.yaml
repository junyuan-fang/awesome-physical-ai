- arxiv_id: '2611.07712'
  title: 'AffectiveVLA: Safe and Intent-Aware VLA Control for Human-Humanoid Social Interaction'
  prefilter_score: 17.0
  triage: include
  reason: 范围内：具身方法或支撑资源的方法与实验证据可核验，进入深入评审。
