  one_liner: TactileLab以刚体仿真生成剪切敏感触觉流，作者通过模态消融与双臂跟随、手内旋转真机任务验证其作用。
  summary: |
    为兼顾剪切感知与大规模强化学习吞吐，TactileLab在Isaac Lab刚体仿真中从接触界面相对运动生成稠密触觉流，并与接触深度互补。
    策略先用特权状态训练教师，再以PETS-Net融合本体历史和触觉观测训练学生；TacFlowNet把真实连续触觉图像映射到模拟流与深度。
    作者在双臂接触跟随和灵巧手内旋转中比较本体感知、低维接触、深度及触觉流，报告深度加流在已见和未见物体上的掉落率最低，并给出多随机种子学习曲线。
    配对采集与多种触觉传感器转换支持后续双臂及灵巧手真机部署。
    结果表明时间性的接触运动信息能补充瞬时几何，但触觉流是运动代理而非完整弹性体应力求解，仍依赖配对采集、传感器适配和接触模型；真机任务覆盖有限，不能直接外推到任意材料与接触模式。
