    O: 3
    T: 3
  rationale:
    C: 利用视觉基元已知结构并行预测整段坐标，以空间精度取代逐token一致性，适用多类规划输出。
    E: 有轨迹误差、闭环MolmoSpaces、消融和多硬件延迟测量；密集运动25倍仅是初步单rollout测量。
    O: 官方Eagle/Embodied已有VFlash训练评测实现，但目标模型及drafter权重明确尚未发布。
