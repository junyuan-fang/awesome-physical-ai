  summary: |
    为减少扩散或流策略强化学习微调的采样负担，LARBRID把环境动作空间与生成器初始噪声空间映射到共享表示，使价值估计不必重新学习无结构的噪声对应关系。
    理论在线性MDP、确定性解码及最优策略可实现等假设下建立Bridge Equation和微调界，实际算法学习表示并用SAC优化噪声分布，离线版本改在动作空间优化。
    作者在Gymnasium、Robomimic及OGBench的在线、离线和离线转在线设置中与DSRL、DPPO、FQL等比较，OGBench离线部分覆盖10项状态任务、4个种子；另在AlohaTransferCube和两项LIBERO任务微调π0，报告更快收敛。
    独立噪声critic消融支持表示桥接的作用。
    结果提示样本效率改善，但不能把摘要最高2至3倍收益概括为所有任务或运行时间提升；表示学习引入额外训练计算，复杂任务可能陷入局部最优，且未进行真机验证。
