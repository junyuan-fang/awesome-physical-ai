  one_liner: AffectiveVLA用意图门控改善人形社交动作选择；作者报告G1真机交互macro-F1从0.75升至0.90。
  summary: |
    为减少握手、碰拳和拥抱中的误启动，AffectiveVLA先用双视角RGB视频识别人类意图，只有预测连续达到置信阈值才向VLA发送任务提示；执行时切换交互专用阻抗参数，并设置独立语音停止机制。
    作者采集1270条示范，按参与者划分训练和测试，比较四个VLA在统一76维动作空间中的表现。
    真机评测由五名参与者分别进行三类交互，每策略150次试验；GR00T单独运行的macro-F1为0.75，加意图模块后为0.90，碰拳F1由0.50升至0.78。
    意图模块p95推理延迟6.27毫秒，不能等同完整控制管线延迟。
    结果说明显式意图提示能改善动作选择，但测试集不含无交互类别，连续运行误触发与噪声环境语音停止仍未充分评估；阻抗降低不提供接触力上界，舒适性用户研究还在进行，不能据此宣称物理安全已获保证。
  venue: ''
  scores:
    C: 3
    E: 3
    O: 1
    T: 3
  rationale:
    C: 将轻量意图门控、VLA和交互阻抗策略组合到人形社交接触，主要为系统集成贡献。
    E: 有四VLA对照及每策略150次真机试验，但仅五名参与者和三种交互，舒适性研究尚未完成。
    O: 缓存及原文未给官方代码、训练权重或数据发布入口，不能将基础模型开放性计入本文。
    T: 已核对署名单位，但未独立核验团队近五年的强相关代表成果，按规则暂记3分。
