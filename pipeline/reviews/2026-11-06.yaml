  one_liner: Open-HumanWAM研究5万小时人类视频预训练；作者报告HumanWAM-Goal在RoboTwin Clean2Random成功率84.60%。
  summary: |
    为把大规模第一人称人类视频转化为机器人可用经验，Open-HumanWAM清洗五类来源，按手部可见性、运动稳定性和活动程度筛选，并把腕姿与手部动作统一到双手末端表示。
    HumanWAM-Vanilla联合学习未来视频与动作，HumanWAM-Goal进一步结合机器人数据和视觉目标。
    所读v2的受控实验表明，在RoboTwin相同后训练协议下，扩大人类数据及任务场景多样性能够提升分布外成功率并减少机器人示范需求；但预训练批量和最佳检查点随数据规模调整，不能视为固定算力的纯数据定律。
    最终Goal模型在官方10000回合协议下，作者报告Clean2Clean为92.70%、Clean2Random为84.60%。
    该结果支持跨来源经验扩展，尚不代表无限外推的泛化规律。
    开放核查发现50K语料需申请访问且仍上传，部分权重及复现流程未齐备，Vanilla仓库评测回合数与报告还存在差异。
