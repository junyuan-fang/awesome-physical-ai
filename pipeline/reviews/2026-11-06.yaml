  scores:
    C: 4
    E: 4
    O: 4
    T: 3
  rationale:
    C: 原生像素输入与跨层动作读取提供明确架构探索，并用匹配实验分析早层视觉信息。
    E: 包含受控骨干与读层消融、多个扰动基准和三项真机任务，真机样本仍较少。
    O: VLAKit训练评测代码和Apache-2.0权重已核验；处理后动作数据公开，但相机视频需从上游另行组装。
