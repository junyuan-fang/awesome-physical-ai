- arxiv_id: '2610.28589'
  title: 'AgenticRoboRL: Bringing Coding-Agent Post-Training to Agentic Robotics'
  prefilter_score: 16.2
  triage: include
  reason: null
  category: vla
  route: core
  contribution: method
  tags:
  - agentic
  - planner-post-training
  - rl
  - sft
  - libero
  affiliations:
  - University of Central Florida
  - University of Southern California
  - Michigan State University
  one_liner: 把编码智能体的 SFT+多轮 RL 后训练搬给机器人 planner；9B 规划器在 LIBERO-PRO 成功率 18.1%→71.0%（无外部记忆），逼近带记忆 Codex(GPT-5.5) 的 72.1%，并开源框架与 checkpoint。
  summary: |-
    为检验「后训练规划器本身」能否提升 agentic 机器人系统（而非只改进 harness 或外部记忆），作者提出 AgenticRoboRL：跨 harness 的规划器后训练框架，以 SFT 在成功轨迹上初始化、再以多轮 RL 优化，通过 harness 专用 adapter 把录制的模型调用与 episode 结果对齐，从而用同一管线支持 VLA 技能调用（RPent）与控制代码生成（CaP-X）两种执行机制。作者报告 9B Qwen3.5 规划器在 LIBERO-PRO 成功率由 18.1% 升至 SFT 65.1%、再经 RL 达 71.0%（无外部记忆），逼近带记忆 Codex(GPT-5.5) 的 72.1%；同一 checkpoint 零样本在 LIBERO-Plus 达 72.2%，并推广到 CaP-X harness。结果提示后训练规划器是提升 agentic 机器人系统的有效路线，但主评测为仿真、无真机，且 SFT 依赖更强 teacher 的轨迹。
  venue: ''
  scores:
    C: 4
    E: 3
    O: 4
    T: 3
  rationale:
    C: 把编码智能体的后训练范式系统化迁移到机器人规划器并跨 harness 通用，是本方向清晰且有示范意义的方法增量。
    E: LIBERO-PRO 800 例 + LIBERO-Plus 10030 例 + CaP-X harness + 消融与符号检验；但均为仿真、无真机。
    O: 框架与 checkpoint 已开源（Apache-2.0，HF 可见 9B 规划器权重），许可清晰。
    T: UCF/USC/MSU 学术团队，相关积累可核实但非该方向顶级，按默认 3。
  evidence_read:
