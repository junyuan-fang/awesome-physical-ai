- arxiv_id: '2610.29997'
  title: 'DONIC: Generalist Dexterous Bimanual Tracking Control from Human Demonstrations'
  prefilter_score: 23.0
  triage: include
  reason: null
  category: manipulation
  route: core
  contribution: model
  tags:
  - dexterous-manipulation
  - bimanual
