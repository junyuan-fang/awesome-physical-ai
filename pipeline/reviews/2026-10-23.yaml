  one_liner: 把代码规划与视频/动作预测统一进一个 MoT 世界动作模型（AW-0）；RoboTwin 2.0 平均成功率 50.7%（clean 80.8%），真机 8 任务平均 rubric 71.1%，超过 VLA/WAM 基线。
  summary: |-
    为解决世界动作模型（WAM）缺乏组合式技能复用、而 agentic 机器人又缺少物理动力学预测落地的问题，作者提出 AW-0：在统一 mixture-of-transformers 主干中把「代码（技能规划）」「未来视频」「机器人动作」作为三条耦合生成流联合去噪（代码用离散 masked diffusion，视频/动作用 flow matching），并配自动标注流水线把机器人与人类视频轨迹标注为可复用技能库。在 RoboTwin 2.0 上作者报告平均成功率 50.7%（clean 80.8%、random 20.6%），超过 π0.5、DreamZero、EgoScale、WLA 等基线；在 YAM 双臂与 Tianji–Sharpa 灵巧手共 8 个真机任务上平均 rubric 71.1%，比最强基线高 25.1 分，hybrid 执行进一步改善鲁棒性。结果提示代码规划能把 WAM 的规划、预测与执行连接起来，但 random 场景性能骤降暴露像素级 OOD 预测的局限。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 4
    T: 5
  rationale:
    C: 把代码规划/技能复用与视频-动作预测统一进单一 WAM，是 agentic WAM 的范式级尝试，方法+技能库管线增量清晰。
    E: RoboTwin 2.0（50 任务）+ 8 个真机任务（双臂/灵巧手），多强基线与消融（注意力序、ViT vs VAE、代码内容、joint vs AR），证据较完整。
    O: 代码落在 NVIDIA/Isaac-GR00T（Apache-2.0）并有基座权重，但 AW-0 专有权重与训练数据/技能库未单独公开。
    T: UC Berkeley + NVIDIA（Goldberg、Darrell、Jim Fan、Yuke Zhu 等）为 embodied AI/WAM 公认领先团队，近期多项标志性成果。
