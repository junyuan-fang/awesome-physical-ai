- arxiv_id: '2610.29560'
  title: 'From VLM Planners to Robotic Agents: Self-Evolving Harnesses for History-Dependent Manipulation'
  prefilter_score: 18.5
  triage: include
  reason: null
  category: vla
  route: core
  contribution: method
  tags:
  - agentic
  - memory
  - hierarchical
  - self-evolution
  - vla
  affiliations:
  - University of Science and Technology of China
  - Shanghai Artificial Intelligence Laboratory
  - Shanghai Jiao Tong University
  - Mohamed bin Zayed University of Artificial Intelligence
  - Zhejiang University
  one_liner: 用可编辑 harness 把高层 VLM 组织成自进化机器人 agent（SERA），配固定 VLA 执行器；RoboMME 上作者报告 51.38% 成功率（无自进化 44.38%）。
  summary: |-
    为解决长程操作中历史依赖决策（相似观测需不同动作）与执行反馈难以沉淀为规划改进的问题，作者提出 SERA：以可编辑 harness 把高层 VLM 组织成 agent，在固定 VLA 执行器之上维护任务上下文、利用执行反馈更新规划，并通过 rollout 自进化（分析/修订 agent 加验证器）改进规划引导、评估标准与控制规则，配置在留出测试前冻结。在 RoboMME（16 个历史依赖任务、800 例）上作者报告 SERA 成功率 51.38%，比无自进化的 44.38% 高 7.0 个百分点，超过 MemER（42.38%）、FrameSamp+Modul（44.51%）等基线，在 Reference/Permanence 套件表现最佳。结果提示把规划器组织为可自进化 agent 是历史依赖操作的有力方向，但 VLM 推理引入规划延迟、无真机评测，且相对基线增益有限。
  venue: ''
  scores:
    C: 3
    E: 3
    O: 3
    T: 3
  rationale:
    C: 把可编辑 harness 与执行驱动自进化用于历史依赖操作的规划层，属 agentic VLA 方向的扎实增量，但核心仍是围绕已有 VLA 的组织方式。
    E: 单一 RoboMME 基准（800 例）+ 多类基线 + 自进化消融；无真机、单基准。
    O: 代码实质（Apache-2.0），权重/数据未公开。
    T: 中科大/上海人工智能实验室/MBZUAI 等学术团队，信息有限按默认 3。
  evidence_read:
