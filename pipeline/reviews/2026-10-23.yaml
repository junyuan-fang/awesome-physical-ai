  one_liner: 首个通用双手灵巧跟踪器 DONIC 与多视角双手交互数据集 BiHOI；单 checkpoint 无需微调在未见轨迹/未见物体成功率 86.79%/57.32%，比最强双手基线分别高 77.36/45.73 个百分点（仿真）。
  summary: |-
    为解决现有灵巧跟踪只做单手、缺乏持续双手接触数据的问题，作者提出 DONIC——首个跨操作类别与人体运动来源联合训练的通用双手跟踪器，并发布 BiHOI 多视角数据集（1,575 段、229 物体、65.91% 双手同时接触率）。方法上用「物体中心逐手奖励」保持物体运动反馈并按各手参考接触角色监督，用 Clip-Centered Advantages 消除参考间优势偏移，再以 PPO+BC 循环把验证成功的执行回灌为示范。作者报告单个 checkpoint 无需微调，在未见轨迹上成功率 86.79%、未见物体上 57.32%，分别比最强双手基线 Dexplore-bi 高 77.36/45.73 个百分点，消融支持两个学习信号与 BiHOI 数据增益。结果提示统一策略可跨异构参考协调双手，但评估限于仿真单物体、依赖重定向的运动参考。
  venue: ''
  scores:
    C: 4
    E: 4
    O: 3
    T: 3
  rationale:
    C: 首个通用双手灵巧跟踪器并配套首个强调持续双手接触的数据集，相对单手跟踪工作增量清晰。
    E: 多基线（DexTrack-bi、Dexplore-bi）+ 双 held-out 划分 + 消融 + 数据集对比，证据完整；但为纯仿真、依赖重建参考。
    O: 代码仓库较实质（689 个代码文件），但 license none-found、README 标注 coming soon，权重与 BiHOI 数据公开状态待核实。
    T: Ropedia 为新兴公司，公开可核实的积累有限，按默认 3。
